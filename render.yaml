services:
  - type: web
    name: soporte-holded
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /salud
    envVars:
      - key: TZ
        value: Europe/Madrid
      - key: DATABASE_URL
        fromDatabase:
          name: soporte-holded-db
          property: connectionString
      - key: DASH_USER        # usuario y contraseña de la consola y el dashboard
        sync: false
      - key: DASH_PASS
        sync: false
      - key: TECNICOS         # ej. Blanch,David,Pablo,Pako
        sync: false
      - key: ENTRADA_KEY      # clave para crear tickets desde WhatsApp o correo (cabecera x-entrada-key)
        sync: false
      - key: PUBLIC_URL       # https://<servicio>.onrender.com, para los enlaces que reciben los clientes
        sync: false
      # WhatsApp Cloud API. Webhook en Meta: <PUBLIC_URL>/whatsapp/webhook
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_VERIFY_TOKEN  # cualquier texto; el mismo que se pone en Meta al suscribir el webhook
        sync: false
      - key: WA_APP_SECRET    # secreto de la app de Meta, para comprobar la firma
        sync: false
      # Buzón de soporte: IMAP para leer, SMTP para responder
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: HOLDED_API_KEY   # vacía = datos comerciales de ejemplo
        sync: false

databases:
  - name: soporte-holded-db
    plan: free
