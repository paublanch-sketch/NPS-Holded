services:
  - type: web
    name: soporte-holded
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /salud
    envVars:
      - key: TZ
        value: Europe/Madrid
      - key: DATABASE_URL     # Postgres (Supabase: cadena del Session pooler)
        sync: false
      # Acceso único al panel /admin. Los clientes no tienen login.
      - key: ADMIN_USUARIO
        sync: false
      - key: ADMIN_CLAVE
        sync: false
      - key: ADMIN_GOOGLE     # quién entra con «Continuar con Google»: correos o dominios; por defecto interactivos.net
        sync: false
      - key: SESSION_SECRET   # texto largo aleatorio; si cambia, se cierran las sesiones abiertas
        generateValue: true
      - key: TECNICO          # el técnico que atiende (por defecto Pau Blanch)
        sync: false
      - key: PUBLIC_URL       # https://<servicio>.onrender.com, para los enlaces que reciben los clientes
        sync: false
      - key: HORARIO_LABORAL  # para el SLA de 1 h; por defecto 09:00-18:00, lunes a viernes
        sync: false
      - key: KIT_DIGITAL_2    # 1 cuando abra el Kit Digital 2: sale como servicio y con su línea en Métricas
        sync: false
      # Comercial: cuentas de Super Gemas (api/soporte_cuentas.php de Super Gemas, con su cron_clave)
      - key: SUPERGEMAS_CLAVE
        sync: false
      - key: SUPERGEMAS_URL   # por defecto https://supergemas.interactivos.net/api/soporte_cuentas.php
        sync: false
      - key: OPERACIONES_EMAIL # aviso de cada convenio de partner firmado; también se pone en Asesorías
        sync: false
      # Lo que muestra el portal público
      - key: WA_NUMERO_PUBLICO  # número de WhatsApp de soporte, con prefijo (34600...)
        sync: false
      - key: SOPORTE_EMAIL      # correo de soporte visible; si falta, se usa MAIL_USER
        sync: false
      - key: SOPORTE_TELEFONO   # teléfono que se muestra en «Otras formas de contactar»
        sync: false
      - key: GOOGLE_RESENA_URL  # enlace para dejar reseña en Google (se ofrece a quien puntúa 9 o 10)
        sync: false
      - key: ENTRADA_KEY      # clave para crear tickets desde otros sistemas (cabecera x-entrada-key)
        sync: false
      # WhatsApp Cloud API. Webhook en Meta: <PUBLIC_URL>/whatsapp/webhook
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_VERIFY_TOKEN  # cualquier texto; el mismo que se pone en Meta al suscribir el webhook
        sync: false
      - key: WA_APP_SECRET    # secreto de la app de Meta, para comprobar la firma
        sync: false
      - key: WA_PLANTILLA_IDIOMA  # idioma de las plantillas en WhatsApp Manager (es, es_ES…); por defecto es
        sync: false
      # Buzón de soporte. Con Google Workspace bastan MAIL_USER y MAIL_PASS (contraseña de
      # aplicación): IMAP_HOST y SMTP_HOST se deducen del MX. Estado en el panel → Canales.
      - key: MAIL_USER
        sync: false
      - key: AVISOS_EQUIPO    # a quién le llega por correo el chat del portal y WhatsApp (separado por comas); por defecto, el propio buzón. Respondiendo, entra en el chat
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: SMTP_HOST
        sync: false
      # Google Meet y Calendar. Lo normal: cliente OAuth y botón «Continuar con Google» en
      # el panel → Canales (sin administrador de Workspace). Vuelta: <PUBLIC_URL>/admin/google/vuelta
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET # también cifra el permiso guardado: si cambia, hay que volver a conectar
        sync: false
      # Alternativa con administrador: cuenta de servicio con delegación de todo el dominio
      # (calendar.events, calendar.freebusy, meetings.space.readonly). Sin cliente OAuth.
      - key: GOOGLE_SA_JSON     # el JSON de la clave de la cuenta de servicio, tal cual o en base64
        sync: false
      - key: GOOGLE_ORGANIZADOR # calendario donde se crean las reuniones; si falta, el de MAIL_USER
        sync: false
      - key: CITA_MIN           # minutos de las videollamadas que reserva el cliente; por defecto 30
        sync: false
      - key: MANTENER_DESPIERTO # 0 para no visitarse cada 10 min (solo hace falta en el plan gratuito)
        sync: false
