services:
  - type: web
    name: dashboard-servicio-holded
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /salud
    envVars:
      - key: SHEET_CSV_URL   # Google Sheet de incidencias: Archivo > Compartir > Publicar en la web > CSV
        sync: false
      - key: HOLDED_API_KEY  # vacía = datos de ejemplo
        sync: false
      - key: DASH_USER       # usuario y contraseña para el jefe (vacío = abierto)
        sync: false
      - key: DASH_PASS
        sync: false
