<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar · Panel de soporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --rojo: #C81D25; --cal: #F9F9F8; --bruma: #5B616A; --pizarra: #1C1C1C; --linea: #e6e5e1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--pizarra);
         background: radial-gradient(1200px 600px at 10% -10%, #fff 0%, transparent 60%), var(--cal); }
  .caja { width: 100%; max-width: 400px; }
  .marca { margin-bottom: 26px; text-align: center; line-height: 0; }
  .marca img { width: 240px; max-width: 100%; height: auto; }
  form { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 28px; box-shadow: 0 1px 2px rgba(28,28,28,.04), 0 16px 40px rgba(28,28,28,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  p { margin: 0 0 22px; color: var(--bruma); font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .campo { position: relative; }
  input { width: 100%; font: inherit; color: inherit; border: 1px solid #d9d8d3; border-radius: 10px; padding: 12px 13px; background: #fff; transition: border-color .15s, box-shadow .15s; }
  input:focus { outline: none; border-color: var(--pizarra); box-shadow: 0 0 0 3px rgba(28,28,28,.08); }
  input[aria-invalid="true"] { border-color: var(--rojo); }
  .ver { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 13px; font-weight: 600; color: var(--bruma); background: none; border: 0; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
  .ver:hover { color: var(--pizarra); background: var(--cal); }
  #clave { padding-right: 76px; }
  button[type=submit] { width: 100%; margin-top: 22px; font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 13px; background: var(--pizarra); color: #fff; cursor: pointer; transition: filter .15s; }
  button[type=submit]:hover { filter: brightness(1.2); }
  button[type=submit]:disabled { opacity: .6; cursor: default; }
  .error { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: #fbeaeb; color: #8f1219; font-size: 14px; }
  .error[hidden] { display: none; }
  /* Botón de Google según su guía de marca, como en Super Gemas. */
  .boton-google { display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; border: 1px solid #747775; border-radius: 22px; background: #fff; color: #1f1f1f; font: 500 15px/1 Roboto, Inter, system-ui, sans-serif; text-decoration: none; transition: background .15s, box-shadow .15s; }
  .boton-google:hover { background: #f8faff; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
  .boton-google svg { width: 20px; height: 20px; }
  .o { display: flex; align-items: center; gap: 12px; margin: 20px 0 4px; color: var(--bruma); font-size: 13px; }
  .o::before, .o::after { content: ""; flex: 1; height: 1px; background: #e6e5e0; }
  .pie { text-align: center; margin-top: 18px; font-size: 13px; color: var(--bruma); }
  .pie a { color: var(--bruma); }
</style>
</head>
<body>
<div class="caja">
  <div class="marca"><img src="/img/logo-interactivos-holded.png" alt="Interactivos · Holded" width="701" height="71"></div>
  <form id="f" novalidate>
    <h1>Panel de soporte</h1>
    <p>Bandeja de incidencias y métricas del servicio Holded.</p>
    <a class="boton-google" href="/admin/google/entrar"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continuar con Google</a>
    <div class="o">o con usuario y contraseña</div>
    <label for="usuario">Usuario</label>
    <input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="clave">Contraseña</label>
    <div class="campo">
      <input id="clave" type="password" autocomplete="current-password" required>
      <button type="button" class="ver" id="ver" aria-pressed="false">Mostrar</button>
    </div>
    <button type="submit" id="entrar">Entrar</button>
    <div class="error" id="error" role="alert" hidden></div>
  </form>
  <div class="pie">¿Eres cliente? <a href="/">Abre una incidencia aquí</a></div>
</div>
<script>
const $ = id => document.getElementById(id);
// Vuelta de «Continuar con Google» sin poder entrar: se explica aquí mismo.
const motivo = new URLSearchParams(location.search).get('google');
if (motivo) {
  $('error').textContent = {
    cancelado: 'Has cancelado el acceso con Google.',
    caducado: 'El acceso con Google ha caducado. Vuelve a pulsar «Continuar con Google».',
    'sin-configurar': 'El acceso con Google aún no está configurado en el servidor: faltan GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en Render. Entra con usuario y contraseña.',
  }[motivo] || motivo;
  $('error').hidden = false;
  history.replaceState(null, '', '/admin/login');
}
$('ver').onclick = () => {
  const visible = $('clave').type === 'password';
  $('clave').type = visible ? 'text' : 'password';
  $('ver').textContent = visible ? 'Ocultar' : 'Mostrar';
  $('ver').setAttribute('aria-pressed', visible);
  $('clave').focus();
};
$('f').onsubmit = async e => {
  e.preventDefault();
  const usuario = $('usuario').value.trim(), clave = $('clave').value;
  $('error').hidden = true;
  ['usuario', 'clave'].forEach(k => $(k).removeAttribute('aria-invalid'));
  if (!usuario || !clave) {
    if (!usuario) $('usuario').setAttribute('aria-invalid', 'true');
    if (!clave) $('clave').setAttribute('aria-invalid', 'true');
    $('error').textContent = 'Escribe el usuario y la contraseña.';
    $('error').hidden = false;
    return;
  }
  $('entrar').disabled = true;
  $('entrar').textContent = 'Entrando…';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario, clave }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'No se ha podido entrar.');
    const next = new URLSearchParams(location.search).get('next');
    location.replace(next && next.startsWith('/admin') ? next : '/admin');
  } catch (err) {
    $('error').textContent = err.message;
    $('error').hidden = false;
    $('clave').setAttribute('aria-invalid', 'true');
    $('clave').select();
    $('entrar').disabled = false;
    $('entrar').textContent = 'Entrar';
  }
};
</script>
</body>
</html>
