<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicio Holded</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --mute:#6b7280; --line:#e5e7eb;
          --ok:#1f9d55; --warn:#e08a00; --crit:#d64545; --info:#3b6fd8; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 24px 8px; }
  h1 { margin:0; font-size:22px; }
  .sub { color:var(--mute); font-size:13px; }
  main { padding:8px 24px 40px; display:grid; gap:18px; max-width:1200px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; min-width:0; }
  h2 { margin:0 0 2px; font-size:17px; display:flex; gap:10px; align-items:center; }
  h3 { margin:16px 0 8px; font-size:12px; letter-spacing:.06em; color:var(--mute); text-transform:uppercase; }
  .pill { font-size:12px; font-weight:600; padding:2px 10px; border-radius:99px; color:#fff; white-space:nowrap; }
  .ok{background:var(--ok)} .warn{background:var(--warn)} .crit{background:var(--crit)} .info{background:var(--info)}
  .rings { display:flex; flex-wrap:wrap; gap:22px; margin-top:14px; }
  .ring { width:130px; text-align:center; }
  .ring svg { width:96px; height:96px; }
  .ring .l { font-size:12px; color:var(--mute); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--mute); font-weight:600; font-size:11px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid var(--line); }
  .tablewrap { overflow-x:auto; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--mute); flex-wrap:wrap; }
  @media (max-width:600px){ header,main{padding-left:16px;padding-right:16px} .ring{width:44%} }
</style>
</head>
<body>
<header>
  <h1>Servicio Holded</h1>
  <div class="sub">Dashboard operativo · Implementación y Soporte Premium · <span id="upd"></span> · <a href="/consola">Consola</a> · <a href="/soporte" target="_blank">Portal del cliente</a></div>
  <div class="legend" style="margin-top:8px">
    <span><i class="dot ok"></i>OK</span><span><i class="dot warn"></i>Atención</span><span><i class="dot crit"></i>Crítico</span><span><i class="dot info"></i>Informativo</span>
  </div>
</header>
<main id="app">Cargando…</main>
<script>
const nivelAbiertas = n => n <= 5 ? 'ok' : n <= 10 ? 'warn' : 'crit';
const nivelNota = v => v == null ? 'info' : v >= 4.5 ? 'ok' : v >= 4 ? 'warn' : 'crit';
const nivelDias = d => d == null ? 'info' : d <= 3 ? 'ok' : d <= 7 ? 'warn' : 'crit';
const peor = (...n) => n.includes('crit') ? 'crit' : n.includes('warn') ? 'warn' : 'ok';
const txt = { ok:'OK', warn:'Atención', crit:'Crítico', info:'Info' };
const color = { ok:'#1f9d55', warn:'#e08a00', crit:'#d64545', info:'#3b6fd8' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dur = m => m >= 1440 ? `${Math.floor(m/1440)} d` : m >= 60 ? `${Math.floor(m/60)}h ${m%60}min` : `${m} min`;
const fechaCorta = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)} ${iso.slice(11,16)}` : '';

function ring(valor, max, etiqueta, nivel, num = parseFloat(valor) || 0) {
  const r = 40, c = 2 * Math.PI * r, f = Math.min(1, max ? num / max : 0);
  return `<div class="ring"><svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#eceef2" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color[nivel]}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c * f} ${c}" transform="rotate(-90 50 50)"/>
    <text x="50" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2330">${esc(valor)}</text></svg>
    <div class="l">${etiqueta}</div><span class="pill ${nivel}">${txt[nivel]}</span></div>`;
}

const anillos = b => [
  ring(b.abiertas, 20, 'Incidencias abiertas', nivelAbiertas(b.abiertas)),
  ring(b.diasCierre ?? '—', 14, 'Días medios hasta el cierre', nivelDias(b.diasCierre)),
  ring(b.valoracion ?? '—', 5, 'Valoración media (NPS)', nivelNota(b.valoracion)),
  ring(b.horasMes + 'h', 40, `Horas este mes · ${b.horasTotal}h en total`, 'info'),
].join('');

function bloque(b) {
  const estado = peor(nivelAbiertas(b.abiertas), nivelDias(b.diasCierre) === 'info' ? 'ok' : nivelDias(b.diasCierre),
    nivelNota(b.valoracion) === 'info' ? 'ok' : nivelNota(b.valoracion));
  const filas = b.casos.map(c => {
    const n = c.esperaMin > 2 * 1440 ? 'crit' : c.esperaMin > 1440 ? 'warn' : 'ok';
    return `<tr><td>${esc(c.cliente)}</td><td>${esc(c.tecnico)}</td><td>${esc(c.tipo)}</td>
      <td>${fechaCorta(c.entrada)}</td><td><span class="pill ${n}">${dur(c.esperaMin)}</span></td><td>${c.horas}h</td><td>${esc(c.estado)}</td></tr>`;
  }).join('') || '<tr><td colspan="7">Sin casos abiertos</td></tr>';
  return `<section><h2>${esc(b.nombre)} <span class="pill ${estado}">${txt[estado]}</span></h2>
    <div class="sub">${b.total} incidencias · ${b.cerradosMes} cerradas este mes</div>
    <div class="rings">${anillos(b)}</div>
    <h3>Casos abiertos ahora</h3><div class="tablewrap"><table><tr><th>Cliente</th><th>Técnico</th><th>Tipo</th><th>Entrada</th><th>Abierto</th><th>Horas</th><th>Estado</th></tr>${filas}</table></div></section>`;
}

function semaforo(c, max) {
  if (c.estado === 'Pagado' || c.estado === 'Rechazado') return ['info', c.estado];
  return c.dias <= max / 2 ? ['ok', `${c.dias} días`] : c.dias <= max ? ['warn', `${c.dias} días`] : ['crit', `${c.dias} días · atención`];
}

const tablaHoras = (titulo, filas) => `<section><h2>${titulo}</h2><div class="tablewrap"><table>
  <tr><th>Nombre</th><th>Tickets</th><th>Horas</th></tr>
  ${filas.map(h => `<tr><td>${esc(h.nombre)}</td><td>${h.tickets}</td><td>${h.horas}h</td></tr>`).join('')}</table></div></section>`;

async function cargar() {
  const d = await (await fetch('/api/resumen')).json();
  if (d.error) { app.textContent = 'Error: ' + d.error; return; }
  upd.textContent = 'Actualizado ' + new Date(d.actualizado).toLocaleString('es-ES');
  const tipos = Object.entries(d.porTipo);
  const pendientes = d.comercial.filter(c => c.estado === 'Firmado, pendiente de pago');
  const firmados = d.comercial.filter(c => c.estado.startsWith('Firmado') || c.estado === 'Pagado');
  const ratio = firmados.length ? Math.round(pendientes.length / firmados.length * 100) : 0;
  app.innerHTML = d.servicios.map(bloque).join('') +
    (tipos.length > 1 ? `<section><h2>KPI por tipo de cliente</h2><div class="grid2">${tipos.map(([n, b]) =>
      `<div><h3>${esc(n)}</h3><div class="rings">${anillos(b)}</div></div>`).join('')}</div></section>` : '') +
    `<section><h2>Comercial · contratos, licencias y presupuestos</h2>
      <div class="sub">Plazo de respuesta del cliente: ${d.diasRespuesta} días. Firmados sin pagar: ${pendientes.length} de ${firmados.length} (${ratio}%).</div>
      <div class="tablewrap"><table style="margin-top:10px"><tr><th>Cliente</th><th>Documento</th><th>Tipo</th><th>Importe</th><th>Fecha</th><th>Estado</th><th>Tiempo</th></tr>
      ${d.comercial.map(c => { const [n, t] = semaforo(c, d.diasRespuesta); return `<tr><td>${esc(c.cliente)}</td><td>${esc(c.documento)}</td><td>${esc(c.tipo)}</td>
        <td>${Number(c.importe).toLocaleString('es-ES')} €</td><td>${esc(c.fecha)}</td><td>${esc(c.estado)}</td><td><span class="pill ${n}">${t}</span></td></tr>`; }).join('')}
      </table></div></section>
    <div class="grid2">${tablaHoras('Horas por técnico', d.horasPorTecnico)}${tablaHoras('Horas por cliente', d.horasPorCliente)}</div>
    <section><h2>Mejoras señaladas en el NPS</h2><div class="tablewrap"><table><tr><th>Cliente</th><th>Nota</th><th>Mejora</th></tr>
      ${d.mejoras.map(m => `<tr><td>${esc(m.cliente)}</td><td>${m.nps ?? '—'}</td><td>${esc(m.mejora)}</td></tr>`).join('') || '<tr><td colspan="3">Aún no hay respuestas NPS</td></tr>'}</table></div></section>`;
}
cargar(); setInterval(cargar, 60000);
</script>
</body>
</html>
