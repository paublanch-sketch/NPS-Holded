  cargarClientes().then(pintarClientes).catch(fallo);
}
function pintarClientes() {
  const c = clientesCache;
  if (!c || !$('ctabla')) return;
  const q = filtroCli.q.trim().toLowerCase();
  const l = c.clientes.filter(x => (!filtroCli.sin || pendiente(x))
    && (!q || `${x.nombre} ${x.emails.join(' ')} ${x.telefonos.join(' ')}`.toLowerCase().includes(q)));
  $('ccuenta').textContent = `${l.length} de ${c.clientes.length} clientes · ${c.clientes.filter(pendiente).length} por clasificar`;
  const sel = (campo, lista, v) => `<select class="campo" data-campo="${campo}" style="padding:5px 7px;font-size:13px">${lista.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  $('ctabla').innerHTML = l.length ? `<table><thead><tr><th>Cliente</th><th>Servicio</th><th>Origen</th><th class="num">Tickets</th><th class="num">Abiertos</th><th>Último</th><th>Contacto</th><th></th></tr></thead><tbody>
    ${l.slice(0, 300).map(x => `<tr data-nombre="${esc(x.nombre)}"><td><b>${esc(x.nombre)}</b></td><td>${sel('servicio', c.servicios, x.servicio)}</td><td>${sel('tipo_cliente', c.origenes, x.tipo_cliente)}</td><td class="num">${x.tickets}</td><td class="num">${x.abiertos || ''}</td><td>${x.ultimo ? fecha(x.ultimo) : ''}</td><td style="font-size:12px;color:var(--bruma)">${esc(x.emails[0] || x.telefonos[0] || '')}${x.emails.length > 1 ? ` +${x.emails.length - 1}` : ''}</td><td><button class="boton sec peq" data-fusion>Fusionar…</button></td></tr>`).join('')}
  </tbody></table>` : '<div class="vacio">Ningún cliente coincide.</div>';
  $('ctabla').onchange = async e => {
    const s = e.target.closest('select[data-campo]');
    if (!s) return;
    const nombre = s.closest('tr').dataset.nombre;
    try {
      await api('/api/clientes', { nombre, [s.dataset.campo]: s.value });
      const x = clientesCache.clientes.find(y => y.nombre === nombre);
      x[s.dataset.campo] = s.value;
      aviso(`${nombre}: ${s.value}`);
    } catch (err) { fallo(err); }
  };
  $('ctabla').onclick = e => {
    if (!e.target.closest('[data-fusion]')) return;
    const de = e.target.closest('tr').dataset.nombre;
    dialogo(`<h3>Fusionar «${esc(de)}»</h3><p class="sub">Todas sus incidencias pasan al cliente que elijas; «${esc(de)}» queda como nombre de contacto. No se puede deshacer desde aquí.</p>
      <label>Es el mismo cliente que…</label><input class="campo" name="a" list="dlFusion" placeholder="Escribe para buscar" required>
      <datalist id="dlFusion">${c.clientes.filter(x => x.nombre !== de).map(x => `<option value="${esc(x.nombre)}">`).join('')}</datalist>
      <div class="pie"><button type="button" class="boton sec" data-cerrar>Cancelar</button><button type="submit" class="boton">Fusionar</button></div>`,
      async f => {
        const a = f.a.value.trim();
        if (!c.clientes.some(x => x.nombre === a)) { aviso('Elige un cliente de la lista.', true); return false; }
        const r = await api('/api/clientes/fusionar', { de, a });
        aviso(`${r.movidos} incidencias pasadas a ${a}.`);
        clientesCache = null;
        await cargarClientes();
        pintarClientes();
      });
  };
}

// ================= Adjuntos =================
const pesoTxt = b => b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${num(b / 1048576, 1)} MB`;
function adjuntoHtml(a) {
  const url = `/api/adjuntos/${a.id}`;
  const ext = (a.nombre.match(/\.([a-z0-9]+)$/i)?.[1] || '').toUpperCase().slice(0, 4);
  if (/^image\/(png|jpeg|gif|webp)$/.test(a.tipo)) return `<a class="adj" href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(a.nombre)}" loading="lazy"></a><small>📎 ${esc(a.nombre)} · ${pesoTxt(a.tamano)}</small>`;
  return `<a class="adj" href="${url}" target="_blank" rel="noopener"><span class="ico">${esc(ext)}</span><span><b>${esc(a.nombre)}</b><small>${pesoTxt(a.tamano)} · abrir</small></span></a>`;
}

  <li>Google Auth Platform → Clientes → <b>Crear cliente</b> → Aplicación web, con este URI de redireccionamiento autorizado:<br><code>${esc((r.publica || location.origin) + '/admin/google/vuelta')}</code></li>
  <li>En Render: <code>GOOGLE_CLIENT_ID</code> y <code>GOOGLE_CLIENT_SECRET</code> de ese cliente, y guarda con «Save, rebuild and deploy».</li>
  <li>Vuelve aquí (o al login) y pulsa <b>Continuar con Google</b> con la cuenta cuyo calendario quieras usar.</li>
</ol>`;

// Aviso rojo en el menú si el buzón está configurado pero falla.
function marcarCanales(r) {
  googleInfo = r.google || googleInfo;
  const c = r.correo;
  $('alertaCanales').classList.toggle('oculto', !((c.configurado && (c.lectura.ok === false || c.envio.ok === false)) || (googleInfo.activo && googleInfo.ok === false)));
}

// ================= Arranque =================
(async () => {
  try {
    [equipo, portal] = await Promise.all([api('/api/equipo'), fetch('/api/portal').then(r => r.json())]);
    [H_INI, H_FIN] = (portal.horario || '09:00-18:00').split('-').map(h => { const [a, b] = h.split(':').map(Number); return a * 60 + (b || 0); });
  } catch (e) { return fallo(e); }
  const guardadoYo = leer('tecnico', '');
  $('yo').innerHTML = `<option value="">— Elige quién eres —</option>` + equipo.map(n => `<option ${n === guardadoYo ? 'selected' : ''}>${esc(n)}</option>`).join('');
  $('yo').onchange = () => { escribir('tecnico', yo()); $('yo').classList.toggle('falta', !yo()); if ($('items')) pintarLista(selActual); };
  $('salir').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/admin/login'; };
  cargarClientes().catch(() => {});
  api('/api/canales').then(marcarCanales).catch(() => {});
  // Vuelta de «Continuar con Google».
  const vueltaGoogle = new URLSearchParams(location.search).get('google');
  if (vueltaGoogle !== null) {
    history.replaceState(null, '', '/admin' + location.hash);
    const bien = {
      ok: 'Google conectado: ya se pueden crear videollamadas y el cliente puede reservar.',
      entrado: 'Has entrado con Google.',
      'entrado-calendario': 'Has entrado con Google y tu calendario queda conectado para las videollamadas.',
    }[vueltaGoogle];
    aviso(bien || {
      cancelado: 'Has cancelado la conexión con Google.',
      caducado: 'La conexión ha caducado: vuelve a pulsar «Continuar con Google».',
      'sin-configurar': 'Falta crear el cliente de Google y poner GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en Render: los pasos están en Canales.',
    }[vueltaGoogle] || vueltaGoogle, !bien);
  }
  ruta();
  if (!yo()) $('yo').classList.add('falta');
})();
</script>
