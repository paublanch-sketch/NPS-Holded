<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de soporte · Interactivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #C81D25; --cal: #f6f7f9; --bruma: #5b6472; --pizarra: #1c2230; --linea: #e6e8ec; --linea2: #d8dce3; --blanco: #fff;
    --suave: #f1f3f6; --muted: #8a919c;
    /* Barra lateral azul marino y acento azul, como el diseño del panel */
    --marino: #0f1b33; --azul: #2563eb; --azul-h: #1d4ed8; --azul-f: #eef3fe; --azul-l: #c7d7fb;
    --sombra-b: 0 1px 2px rgba(16, 24, 40, .06);
    /* Estado (fijos, siempre con icono y texto) */
    --ok: #0ca30c; --ok-t: #0a6b0a; --ok-f: #e7f5e7;
    --at: #fab219; --at-t: #7a5200; --at-f: #fdf3dc;
    --cr: #d03b3b; --cr-t: #a32020; --cr-f: #fbe9e9;
    /* Gráficos */
    --nota: #fff8e1; --nota-l: #f0d58a;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { min-height: 100%; }
  body { margin: 0; font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cal); color: var(--pizarra); display: grid; grid-template-columns: 228px minmax(0, 1fr); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .oculto { display: none !important; }

  /* Navegación */
  /* Barra lateral fija a la izquierda: solo se desplaza el panel */
  .nav { background: var(--marino); color: #fff; display: flex; flex-direction: column; gap: 4px; padding: 22px 14px 16px; position: fixed; top: 0; left: 0; bottom: 0; width: 228px; overflow-y: auto; z-index: 20; }
  .nav .marca { padding: 4px 10px 24px; line-height: 0; }
  .nav .marca img { display: block; width: 100%; max-width: 180px; height: auto; }
  .nav .enlaces { display: flex; flex-direction: column; gap: 4px; }
  .nav a.ir { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #c3cbdb; text-decoration: none; font-size: 15px; font-weight: 500; position: relative; transition: background .15s, color .15s; }
  .nav a.ir:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  .nav a.ir.on { background: var(--azul); color: #fff; font-weight: 600; box-shadow: 0 6px 16px rgba(37, 99, 235, .35); }
  /* Punto claro a la derecha del activo, salvo si ya lleva contador */
  .nav a.ir.on::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #9bb8ff; }
  .nav a.ir.on:has(.cuenta:not(.oculto))::after { display: none; }
  .nav a.ir svg { flex: none; width: 20px; height: 20px; }
  .nav .cuenta { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--azul); color: #fff; }
  /* Cuenta: avatar con iniciales del técnico; al pulsar, el menú (quién soy, portal y salir) */
  .nav .abajo { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .1); padding-top: 14px; position: relative; }
  .yo-boton { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px; border: 0; border-radius: 12px; background: none; color: #fff; cursor: pointer; text-align: left; }
  .yo-boton:hover, .yo-boton[aria-expanded="true"] { background: rgba(255, 255, 255, .06); }
  .yo-boton .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2c3b5c; display: grid; place-items: center; font-size: 14px; font-weight: 600; flex: none; }
  .yo-boton b { display: block; font-weight: 600; font-size: 14px; }
  .yo-boton small { display: block; font-size: 12px; color: #9aa6bd; }
  .yo-boton > svg { margin-left: auto; color: #9aa6bd; flex: none; }
  .yo-boton.falta .avatar { background: #b45309; }
  .yo-boton.falta { box-shadow: inset 0 0 0 2px rgba(250, 178, 25, .7); }
  .menu-yo { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: var(--blanco); color: var(--pizarra); border-radius: 14px; padding: 14px; box-shadow: 0 16px 40px rgba(15, 27, 51, .35); z-index: 30; }
  .menu-yo label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  .menu-yo select { width: 100%; }
  .menu-yo select.falta { border-color: var(--at); box-shadow: 0 0 0 3px rgba(250, 178, 25, .25); }
  .menu-yo a, .menu-yo button.salir { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--pizarra); text-decoration: none; background: none; border: 0; cursor: pointer; text-align: left; }
  .menu-yo a:hover, .menu-yo button.salir:hover { background: var(--suave); }
  .menu-yo hr { border: 0; border-top: 1px solid var(--linea); margin: 12px 0 4px; }
  #vista { min-width: 0; grid-column: 2; }

  /* Comunes */
  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; text-decoration: none; border: 1px solid var(--azul); border-radius: 10px; padding: 9px 16px; cursor: pointer; background: var(--azul); color: #fff; white-space: nowrap; box-shadow: 0 1px 2px rgba(37, 99, 235, .25); transition: background .15s, border-color .15s, box-shadow .15s; }
  .boton:hover { background: var(--azul-h); border-color: var(--azul-h); }
  .boton:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--azul-l); }
  .boton:disabled { opacity: .5; cursor: default; }
  .boton svg { flex: none; }
  .boton.sec { background: var(--blanco); color: var(--pizarra); border-color: var(--linea2); box-shadow: var(--sombra-b); }
  .boton.sec:hover { background: #f8f9fb; border-color: #c9ced8; }
  .boton.verde { background: var(--ok-t); border-color: var(--ok-t); box-shadow: none; }
  .boton.verde:hover { background: #085a08; border-color: #085a08; }
  .boton.rojo { background: var(--cr-t); border-color: var(--cr-t); box-shadow: none; }
  .boton.rojo:hover { background: #8a1a1a; border-color: #8a1a1a; }
  .boton.peq { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
  .campo { border: 1px solid var(--linea2); border-radius: 10px; padding: 8px 10px; background: var(--blanco); }
  .campo:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-f); }
  .tarjeta { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; padding: 18px 20px; box-shadow: var(--sombra-b); }
  .tarjeta h3 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--bruma); }
  .pastilla { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--suave); color: var(--bruma); }
  .pastilla.ok { background: var(--ok-f); color: var(--ok-t); }
  .pastilla.atencion { background: var(--at-f); color: var(--at-t); }
  .pastilla.critico { background: var(--cr-f); color: var(--cr-t); }
  .pastilla.oscura { background: var(--pizarra); color: #fff; }
  .pastilla.urg { background: var(--rojo); color: #fff; }
  .cabeza { display: flex; align-items: center; gap: 12px; padding: 20px 28px 0; flex-wrap: wrap; }
  .cabeza h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .vacio { color: var(--muted); text-align: center; padding: 36px 16px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.clic { cursor: pointer; }
  tr.clic:hover td { background: #fbfbfa; }
  .tabla { overflow-x: auto; }

  /* Bandeja */
  .bandeja { display: grid; grid-template-columns: clamp(300px, 25vw, 380px) minmax(0, 1fr); height: 100vh; }
  .bandeja > *, .detalle > *, .conv, .lista .top > * { min-width: 0; }
  .lista { border-right: 1px solid var(--linea); background: var(--blanco); display: flex; flex-direction: column; min-height: 0; }
  .lista .top { padding: 16px 14px 10px; border-bottom: 1px solid var(--linea); }
  .lista .top .fila { display: flex; gap: 8px; align-items: center; }
  .lista .top h1 { font-size: 18px; margin: 0 auto 0 0; }
  .buscar { width: 100%; margin-top: 12px; }
  .pestanas { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .pestanas button { border: 0; background: none; padding: 6px 9px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--bruma); cursor: pointer; white-space: nowrap; }
  .pestanas button:hover { background: var(--suave); }
  .pestanas button.on { background: var(--azul); color: #fff; }
  .pestanas button b { font-weight: 600; opacity: .7; margin-left: 3px; }
  .items { overflow-y: auto; flex: 1; }
  .item { display: block; padding: 12px 14px; border-bottom: 1px solid var(--linea); text-decoration: none; color: inherit; border-left: 3px solid transparent; }
  .item:hover { background: #fbfbfa; }
  .item.sel { background: var(--azul-f); border-left-color: var(--azul); }
  .item .l1 { display: flex; gap: 8px; align-items: baseline; }
  .item .l1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .l1 time { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .item .l2 { font-size: 12px; color: var(--bruma); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item .l3 { font-size: 13px; color: var(--bruma); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--azul); flex: none; display: inline-block; }
  .detalle { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 20vw, 300px); min-height: 0; height: 100vh; }
  .conv { display: flex; flex-direction: column; min-height: 0; }
  .conv .cab { padding: 18px 24px 14px; background: var(--blanco); border-bottom: 1px solid var(--linea); }
  .conv .cab h2 { font-size: 19px; margin: 0; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .conv .cab .meta { color: var(--bruma); font-size: 13px; margin-top: 3px; }
  .acciones-contacto { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .acciones-contacto a, .acciones-contacto button { font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--linea2); background: var(--blanco); text-decoration: none; cursor: pointer; color: var(--pizarra); }
  .acciones-contacto a:hover, .acciones-contacto button:hover { background: var(--suave); }
  .hilo { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 76%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m small { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
  .m.cliente { align-self: flex-start; background: var(--blanco); border: 1px solid var(--linea); border-bottom-left-radius: 4px; }
  .m.tecnico { align-self: flex-end; background: var(--pizarra); color: #fff; border-bottom-right-radius: 4px; }
  .m.nota { align-self: flex-end; background: var(--nota); border: 1px dashed var(--nota-l); }
  .m.sistema { align-self: center; background: none; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 8px; }
  .redactar { background: var(--blanco); border-top: 1px solid var(--linea); padding: 10px 24px 14px; }
  .redactar .modos { display: flex; gap: 4px; margin-bottom: 8px; align-items: center; }
  .redactar .modos button { border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--muted); padding: 5px 9px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .redactar .modos select { min-width: 0; flex: 0 1 190px; }
  .redactar .modos button.on { color: var(--pizarra); background: var(--suave); }
  .redactar .modos button.on.nota { background: var(--nota); }
  .redactar .modos select { margin-left: auto; font-size: 13px; padding: 5px 8px; }
  .redactar .caja { display: flex; gap: 8px; align-items: flex-end; }
  .redactar textarea { flex: 1; min-height: 46px; max-height: 200px; resize: none; }
  .redactar.es-nota textarea { background: var(--nota); border-color: var(--nota-l); }
  .redactar .ayuda { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .lado { border-left: 1px solid var(--linea); background: var(--cal); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .lado .tarjeta { padding: 14px 16px; }
  .reloj { font-size: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .reloj.on { color: var(--ok-t); }
  .reloj-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .botones { display: flex; gap: 6px; flex-wrap: wrap; }
  .botones.tiempo { display: grid; grid-template-columns: repeat(3, 1fr); }
  .botones.tiempo .boton:first-child { grid-column: 1 / -1; }
  .botones.tiempo .boton { padding: 8px 6px; }
  .botones .boton { flex: 1; }
  .prop { display: grid; grid-template-columns: 92px 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
  .prop span { color: var(--bruma); }
  .prop select, .prop input[type=text] { width: 100%; padding: 6px 8px; font-size: 13px; }
  .historial a { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--linea); text-decoration: none; }
  .historial a span { color: var(--muted); white-space: nowrap; }
  .adj { display: flex; gap: 10px; align-items: center; text-decoration: none; color: inherit; }
  .adj img { max-width: 220px; max-height: 160px; border-radius: 8px; display: block; border: 1px solid var(--linea); }
  .adj .ico { width: 34px; height: 34px; border-radius: 8px; background: var(--suave); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--bruma); flex: none; }
  .adj b { display: block; font-weight: 600; }
  .adj small { margin: 0 !important; }
  .estado-linea { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--linea); font-size: 13px; }
  .estado-linea:first-of-type { border-top: 0; }
  .estado-linea .k { width: 150px; color: var(--bruma); flex: none; }
  .estado-linea > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .pasos-ayuda { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--bruma); }
  .pasos-ayuda li { margin: 4px 0; }
  /* Botón de Google según su guía de marca: blanco, borde gris y la G de colores. */
  .boton-google { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px 0 12px; margin-top: 14px; border: 1px solid #747775; border-radius: 20px; background: #fff; color: #1f1f1f; font: 500 14px/1 Roboto, Inter, system-ui, sans-serif; text-decoration: none; }
  .boton-google:hover { background: #f8faff; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
  .boton-google svg { width: 20px; height: 20px; }
  code { background: var(--suave); padding: 1px 6px; border-radius: 5px; font-size: 12px; }

  /* Métricas */
  .filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 14px 28px; position: sticky; top: 0; z-index: 5; background: rgba(246, 247, 249, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--linea); }
  .filtros .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; display: inline-flex; gap: 4px; background: var(--blanco); border: 1px solid var(--linea); border-radius: 12px; padding: 5px; box-shadow: var(--sombra-b); }
  .filtros .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--bruma); white-space: nowrap; transition: background .15s, color .15s; }
  .filtros .seg button:hover { background: var(--suave); color: var(--pizarra); }
  .filtros .seg button.on { background: var(--azul); color: #fff; box-shadow: 0 1px 3px rgba(37, 99, 235, .35); }
  .filtros select, .filtros input { padding: 7px 9px; font-size: 13px; }
  /* Desplegables con icono (Fechas, equipo), como botones blancos */
  .desplegable { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: var(--blanco); border: 1px solid var(--linea); border-radius: 12px; box-shadow: var(--sombra-b); font-size: 14px; font-weight: 500; color: var(--pizarra); cursor: pointer; position: relative; }
  .desplegable:hover { border-color: #c9ced8; }
  .desplegable.on { border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-f); }
  .desplegable:focus-within { border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-f); }
  .desplegable > svg { flex: none; color: var(--bruma); }
  .desplegable > svg:last-of-type { margin-left: auto; }
  /* El selector de verdad va encima, invisible: se abre pulsando en cualquier parte del botón */
  .desplegable select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .desplegable.equipo { min-width: 230px; }
  .filtros .fechas { display: inline-flex; gap: 6px; align-items: center; }
  .filtros .der { margin-left: auto; }
  .contenido { padding: 20px 28px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1360px; }
  .aviso { background: var(--at-f); color: var(--at-t); border-radius: 10px; padding: 10px 14px; font-size: 13px; }

  /* Métricas con el diseño del mockup (PDF) */
  .mk { --mk-ok: #16a34a; --mk-ok-t: #15803d; --mk-ok-f: #e8f7ee; --mk-ok-p: #d6f2df;
        --mk-at: #f59e0b; --mk-at-t: #b45309; --mk-at-f: #fff4e0; --mk-at-p: #fdeccc;
        --mk-cr: #dc2626; --mk-cr-t: #b91c1c; --mk-cr-f: #fdecec; --mk-cr-p: #fbdada;
        --mk-azul: #2563eb; --mk-azul-f: #eef3fe; --mk-gris: #f7f7f8; }
  .mk-cab { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 22px 28px 4px; }
  .mk-logo { width: 48px; height: 48px; border-radius: 12px; background: var(--azul); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 6px 16px rgba(37, 99, 235, .3); }
  .mk-cab h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .mk-cab p { margin: 0; color: var(--bruma); font-size: 13px; }
  .mk-chips { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .mk-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--bruma); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--linea); background: var(--blanco); white-space: nowrap; box-shadow: var(--sombra-b); }
  .mk-chip svg, .mk-cab .boton svg { color: var(--bruma); }
  .mk-leyenda { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; background: var(--blanco); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 18px; font-size: 13px; color: var(--bruma); }
  .mk-leyenda .tit { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  .mk-leyenda b { color: var(--pizarra); }
  .mk-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .mk-sec { background: var(--blanco); border: 1px solid var(--linea); border-radius: 16px; padding: 22px 24px; }
  .mk-sec-cab { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
  .mk-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--mk-azul-f); color: var(--mk-azul); display: grid; place-items: center; flex: none; }
  .mk-sec-cab h2 { font-size: 17px; margin: 0 0 2px; }
  .mk-sec-cab p { margin: 0; color: var(--bruma); font-size: 13px; max-width: 460px; }
  .mk-estado { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
  .mk-estado.ok { color: var(--mk-ok-t); border-color: #b7e4c4; background: var(--mk-ok-f); }
  .mk-estado.atencion { color: var(--mk-at-t); border-color: #f5d49a; background: var(--mk-at-f); }
  .mk-estado.critico { color: var(--mk-cr-t); border-color: #f3b4b4; background: var(--mk-cr-f); }
  .mk-estado.nada { color: var(--muted); border-color: var(--linea2); background: var(--blanco); }

<script>
// ================= Utilidades =================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 0) => n == null ? '—' : Number(n).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const horasTxt = h => h == null ? '—' : `${num(h, h % 1 ? 1 : 0)} h`;
const fecha = iso => iso ? new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '';
const fechaHora = iso => iso ? new Date(iso).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const hace = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `${m} min`;
  if (m < 1440) return `${Math.floor(m / 60)} h`;
  const d = Math.floor(m / 1440);
  return d < 30 ? `${d} d` : fecha(iso);
};
const dur = min => min == null ? '—' : min < 60 ? `${min} min` : min < 600 ? `${Math.floor(min / 60)} h ${min % 60 ? (min % 60) + ' min' : ''}`.trim() : `${Math.round(min / 60)} h`;
const hms = s => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const iso = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = '/admin/login?next=' + encodeURIComponent('/admin' + location.hash); throw new Error('Sesión caducada'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Algo ha fallado');
  return d;
}
function aviso(texto, error = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (error ? ' error' : '');
  t.textContent = texto;
  $('avisos').append(t);
  setTimeout(() => t.remove(), error ? 6000 : 3000);
}
const fallo = e => aviso(e.message, true);

// Horario laboral para el SLA (el mismo que usa el servidor).
let H_INI = 540, H_FIN = 1080;
function laborables(a, b = new Date()) {
  const ini = new Date(a), fin = new Date(b);
  if (!(fin > ini)) return 0;
  let total = 0;
  const d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate());
  while (d <= fin) {
    if (d.getDay() % 6) {
      const s = Math.max(d.getTime() + H_INI * 60000, ini), e = Math.min(d.getTime() + H_FIN * 60000, fin);
      if (e > s) total += (e - s) / 60000;
    }
    d.setDate(d.getDate() + 1);
  }
  return Math.round(total);
}

// ================= Estado global =================
let equipo = [], tickets = [], clientesCache = null, portal = {}, googleInfo = { activo: false };
const TIPOS = ['Facturación y Verifactu', 'Contabilidad e impuestos', 'Bancos y conciliación', 'Equipo y fichajes', 'Acceso y usuarios', 'Formación', 'Importación de datos', 'Plantillas', 'Suscripción y plan', 'Otra cosa'];
const yo = () => $('yo').value;
// Tarjeta de cuenta de la barra: iniciales y nombre del técnico elegido; el menú lleva el selector.
function pintarYo() {
  const n = yo();
  $('yoIni').textContent = n ? n.split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase() : '?';
  $('yoNombre').textContent = n || 'Elige quién eres';
  $('yoBoton').classList.toggle('falta', !n);
  $('yo').classList.toggle('falta', !n);
}
const menuYo = abrir => { $('menuYo').classList.toggle('oculto', !abrir); $('yoBoton').setAttribute('aria-expanded', abrir); };
function exigirTecnico() {
  if (yo()) return true;
  menuYo(true);
  $('yo').focus();
  aviso('Elige primero quién eres en «Trabajando como».', true);
  return false;
}

// ================= Router =================
let pararVista = () => {};
function ruta() {
  const [, v = 'bandeja', arg] = location.hash.split('/');
  document.querySelectorAll('.nav a.ir').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  if (v === 'bandeja' && $('items')) return seleccionar(Number(arg) || null);
  pararVista();
  pararVista = () => {};
  ({ bandeja: vistaBandeja, metricas: vistaMetricas, clientes: vistaClientes, canales: vistaCanales }[v] || vistaBandeja)(arg);
}
addEventListener('hashchange', ruta);

// ================= Bandeja =================
const PESTANAS = [
  ['abiertos', 'Abiertos', t => t.estado !== 'Cerrado'],
  ['sin', 'Sin asignar', t => t.estado !== 'Cerrado' && !t.tecnico],
  ['mios', 'Míos', t => t.estado !== 'Cerrado' && t.tecnico && t.tecnico === yo()],
  ['espera', 'Espera cliente', t => t.estado === 'Pendiente cliente'],
  ['cerrados', 'Cerrados', t => t.estado === 'Cerrado'],
];
let pestana = leer('pestana', 'abiertos'), busca = '', modoNota = false, selActual = null, firmaDet = '';
const firmaDe = t => JSON.stringify([t?.id, t?.mensajes?.length, t?.estado, t?.tecnico, t?.sesiones?.length, t?.activa?.inicio, t?.tipo_incidencia, t?.urgente, t?.nps]);

// Cambia el ticket abierto sin volver a montar la bandeja.
function seleccionar(id) {
  selActual = id;
  document.querySelector('.bandeja')?.classList.toggle('con-sel', !!id);
  document.querySelectorAll('.item').forEach(a => a.classList.toggle('sel', a.getAttribute('href') === '#/bandeja/' + id));
  const t = tickets.find(x => x.id === id);
  firmaDet = firmaDe(t);
  if (id) pintarDetalle(t);
  else $('detalle').innerHTML = '<div class="vacio" style="grid-column:1/-1;align-self:center">Elige un ticket de la bandeja</div>';
}

function slaDe(t) {
  if (t.estado === 'Cerrado') return ['', 'Resuelto'];
  if (t.estado === 'Pendiente cliente') return ['atencion', 'Espera cliente'];
  if (t.primera_respuesta) return ['oscura', 'En curso'];
  if (t.origen === 'Sheet') return ['', t.estado];
  const m = laborables(t.entrada);
  return [m > 60 ? 'critico' : m > 45 ? 'atencion' : 'ok', m > 60 ? `Fuera de SLA · ${dur(m)}` : `Sin responder · ${dur(m)}`];
}
const segundos = t => (t.horas_previas || 0) * 3600 + (t.sesiones || []).reduce((s, x) => s + ((x.fin ? new Date(x.fin) : new Date()) - new Date(x.inicio)) / 1000, 0);

function ordenar(l) {
  if (pestana === 'cerrados') return l.sort((a, b) => (b.cierre || '').localeCompare(a.cierre || ''));
  const peso = t => (t.urgente ? 0 : 2) + (t.primera_respuesta ? 1 : 0);
  return l.sort((a, b) => peso(a) - peso(b) || a.entrada.localeCompare(b.entrada));
}

function vistaBandeja(idSel) {
  selActual = Number(idSel) || null;
  const sel = selActual;
  $('vista').innerHTML = `
    <div class="bandeja ${sel ? 'con-sel' : ''}">
      <section class="lista">
        <div class="top">
          <div class="fila"><h1>Bandeja</h1><button class="boton peq" id="nuevo">+ Nuevo ticket</button></div>
          <input class="campo buscar" id="buscar" placeholder="Buscar cliente, correo o texto…" value="${esc(busca)}">
          <div class="pestanas" id="pestanas"></div>
        </div>
        <div class="items" id="items"></div>
      </section>
      <section class="detalle" id="detalle">${sel ? '' : '<div class="vacio" style="grid-column:1/-1;align-self:center">Elige un ticket de la bandeja</div>'}</section>
    </div>`;
  $('buscar').oninput = e => { busca = e.target.value; pintarLista(selActual); };
  $('nuevo').onclick = nuevoTicket;
  $('pestanas').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    pestana = b.dataset.p;
    escribir('pestana', pestana);
    pintarLista(selActual);
  };
  const refrescar = async () => {
    if (document.hidden) return;
    try { tickets = await api('/api/tickets'); } catch (e) { return fallo(e); }
    pintarLista(selActual);
    if (selActual) {
      const t = tickets.find(x => x.id === selActual);
      if (firmaDe(t) !== firmaDet) { firmaDet = firmaDe(t); pintarDetalle(t); }
    }
  };
  // Con la lista ya en memoria se pinta al instante; luego se refresca.
  if (tickets.length) { pintarLista(selActual); if (selActual) seleccionar(selActual); }
  refrescar();
  const i1 = setInterval(refrescar, 8000);
  const i2 = setInterval(tick, 1000);
  document.addEventListener('visibilitychange', refrescar);
  pararVista = () => { clearInterval(i1); clearInterval(i2); document.removeEventListener('visibilitychange', refrescar); };
}

function pintarLista(sel) {
  const abiertos = tickets.filter(t => t.estado !== 'Cerrado');
  $('cuentaBandeja').textContent = abiertos.length;
  $('cuentaBandeja').classList.toggle('oculto', !abiertos.length);
  if (!$('items')) return;
  $('pestanas').innerHTML = PESTANAS.map(([k, n, f]) => `<button data-p="${k}" class="${k === pestana ? 'on' : ''}">${n}${k === 'cerrados' ? '' : `<b>${tickets.filter(f).length}</b>`}</button>`).join('');
  const filtro = PESTANAS.find(p => p[0] === pestana)?.[2] || PESTANAS[0][2];
  const q = busca.trim().toLowerCase();
  const l = ordenar(tickets.filter(t => filtro(t) && (!q || `${t.id} ${t.cliente} ${t.contacto} ${t.email} ${t.descripcion}`.toLowerCase().includes(q))));
  const vista = pestana === 'cerrados' ? l.slice(0, 150) : l;
  $('items').innerHTML = vista.map(t => {
    const [n, txt] = slaDe(t);
    const ultimoCliente = [...t.mensajes].reverse().find(m => m.de === 'cliente')?.texto || t.descripcion;
    return `<a class="item ${t.id === sel ? 'sel' : ''}" href="#/bandeja/${t.id}">
      <div class="l1">${t.urgente && t.estado !== 'Cerrado' ? '<span class="punto" title="Urgente"></span>' : ''}<b>#${t.id} ${esc(t.cliente)}</b><time>${hace(t.estado === 'Cerrado' ? t.cierre || t.entrada : t.entrada)}</time></div>
      <div class="l2"><span class="pastilla ${n}">${esc(txt)}</span>${esc(t.canal)} · ${esc(t.tipo_incidencia)}${t.tecnico ? ' · ' + esc(t.tecnico) : ''}${t.activa ? ' · <b style="color:var(--ok-t)">⏱ en marcha</b>' : ''}</div>
      <div class="l3">${esc(ultimoCliente)}</div></a>`;
  }).join('') + (l.length > vista.length ? `<div class="vacio">Se muestran los 150 más recientes. Usa el buscador para el resto.</div>` : '')
    || `<div class="vacio">${q ? 'Nada coincide con la búsqueda.' : pestana === 'sin' ? 'Todo asignado. 👌' : 'No hay tickets aquí.'}</div>`;
}

const PLANTILLAS = [
  ['Saludo', 'Hola{contacto}, soy {tecnico}, del soporte de Holded de Interactivos. Ya estoy mirando tu incidencia y te digo algo en breve.'],

  ['Recuperar contraseña', 'Para recuperar el acceso: en la pantalla de inicio de Holded pulsa «¿Has olvidado tu contraseña?» y escribe el correo con el que te diste de alta. Si en 5 minutos no te llega, revisa la carpeta de spam y dínoslo.'],
  ['Proponer videollamada', '¿Te va bien que lo veamos en una videollamada corta? Dime un par de horas que te encajen y te paso el enlace.'],
  ['Escalar a Holded', 'Lo hemos revisado y es un error de la propia plataforma. Lo hemos comunicado al soporte de Holded y te avisamos en cuanto lo corrijan.'],
  ['Resuelto', 'Lo damos por resuelto. Si vuelve a pasar, responde a este mensaje y lo retomamos.'],
];

function pintarDetalle(t) {
  const det = $('detalle');

  const wa = tel.replace(/^\+/, '').replace(/^(?=[6-9]\d{8}$)/, '34');
  const [n, txt] = slaDe(t);
  const cerrado = t.estado === 'Cerrado';
  const borrador = $('resp')?.value || '';
  const ficha = clientesCache?.clientes.find(c => c.nombre === t.cliente);
  const otros = tickets.filter(x => x.cliente === t.cliente && x.id !== t.id).sort((a, b) => b.entrada.localeCompare(a.entrada));
  const horasCliente = tickets.filter(x => x.cliente === t.cliente).reduce((s, x) => s + segundos(x), 0) / 3600;
  const tiposOpc = [...new Set([...TIPOS, t.tipo_incidencia])].map(x => `<option ${x === t.tipo_incidencia ? 'selected' : ''}>${esc(x)}</option>`).join('');
  det.innerHTML = `
    <div class="conv">
      <div class="cab">
        <a class="volver-movil" href="#/bandeja">← Bandeja</a>
        <h2>#${t.id} · ${esc(t.cliente)} <span class="pastilla ${n}">${esc(txt)}</span>${t.urgente && !cerrado ? '<span class="pastilla urg">Urgente</span>' : ''}</h2>
        <div class="meta">${esc(t.contacto || 'Sin contacto')} · ${esc(t.canal)} · entró ${fechaHora(t.entrada)}${t.primera_respuesta ? ` · 1.ª respuesta en ${dur(laborables(t.entrada, t.primera_respuesta))} laborables` : ''}</div>
        <div class="acciones-contacto">
          ${tel ? `<a href="tel:${esc(tel)}">📞 ${esc(t.telefono)}</a>` : ''}
          ${wa.length >= 9 ? `<a href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
          ${t.email ? `<a href="mailto:${esc(t.email)}?subject=${encodeURIComponent('Incidencia #' + t.id)}">✉ ${esc(t.email)}</a>` : ''}
          <a href="/t/${esc(t.token)}" target="_blank" rel="noopener">Ver como cliente ↗</a>
          <button id="copiar">Copiar enlace del cliente</button>
        </div>
      </div>
      <div class="hilo" id="hilo">${t.mensajes.map(m => `<div class="m ${m.de}">${m.adjunto ? adjuntoHtml(m.adjunto) : esc(m.texto)}${m.enlace ? `<br><a href="${esc(m.enlace)}" target="_blank" rel="noopener">${esc(m.enlace)}</a>` : ''}${m.de === 'sistema' ? '' : `<small>${m.de === 'nota' ? 'Nota interna · ' : ''}${m.autor ? esc(m.autor) + ' · ' : m.de === 'cliente' ? esc(t.contacto || t.cliente) + ' · ' : ''}${fechaHora(m.fecha)}</small>`}</div>`).join('')}</div>
      <form class="redactar ${modoNota ? 'es-nota' : ''}" id="redactar">
        <div class="modos">
          <button type="button" data-m="cliente" class="${modoNota ? '' : 'on'}">Responder al cliente</button>
          <button type="button" data-m="nota" class="nota ${modoNota ? 'on' : ''}">Nota interna</button>
          <select class="campo" id="plantilla"><option value="">Respuestas rápidas…</option>${PLANTILLAS.map((p, i) => `<option value="${i}">${esc(p[0])}</option>`).join('')}</select>
        </div>
        <div class="caja"><textarea class="campo" id="resp" placeholder="${modoNota ? 'Nota solo para el equipo…' : `Escribe al cliente${t.canal === 'WhatsApp' ? ' (le llega por WhatsApp)' : t.email ? ' (le llega también por correo si está activo)' : ''}…`}">${esc(borrador)}</textarea><button class="boton">Enviar</button></div>
        <div class="ayuda">Enter envía · Mayús+Enter salto de línea</div>
      </form>
    </div>
    <aside class="lado">
      <div class="tarjeta">
        <h3>Tiempo</h3>
        <div class="reloj ${t.activa ? 'on' : ''}" id="reloj">${hms(segundos(t))}</div>

        ${cerrado ? '' : `<div class="botones tiempo">
          ${t.activa ? `<button class="boton rojo" data-a="parar">Pausar</button>` : `<button class="boton verde" data-a="iniciar">Iniciar</button>`}
          <button class="boton sec" data-t="15">+15′</button><button class="boton sec" data-t="30">+30′</button><button class="boton sec" data-t="otro">+…</button>
        </div>`}
      </div>
      <div class="tarjeta">
        <h3>Acciones</h3>
        <div class="botones" style="flex-direction:column">
          ${cerrado
            ? `<div style="font-size:13px;color:var(--bruma);margin-bottom:6px">Cerrado el ${fechaHora(t.cierre)}${t.nps != null ? ` · <b style="color:var(--pizarra)">NPS ${t.nps}</b>` : ' · valoración pendiente'}${t.mejora ? `<br>«${esc(t.mejora)}»` : ''}</div><button class="boton sec" data-a="reabrir">Reabrir</button>`
            : `${t.activa?.tipo === 'video' ? `<a class="boton sec" style="text-align:center;text-decoration:none" href="${esc(t.video)}" target="_blank" rel="noopener">Volver a la sala ↗</a>` : `<button class="boton sec" data-a="video">Videollamada</button>`}
               <button class="boton sec" data-a="pendiente" ${t.estado === 'Pendiente cliente' ? 'disabled' : ''}>Esperando al cliente</button>
               <button class="boton" data-a="cerrar">Cerrar y pedir valoración</button>`}
        </div>
      </div>
      ${tarjetaCitas(t)}
      <div class="tarjeta">
        <h3>Detalles</h3>
        <div class="prop">
          <span>Técnico</span><select class="campo" id="pTec"><option value="">Sin asignar</option>${[...new Set([...equipo, t.tecnico].filter(Boolean))].map(x => `<option ${x === t.tecnico ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
          <span>Tipo</span><select class="campo" id="pTipo">${tiposOpc}</select>
          <span>Urgente</span><label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="pUrg" ${t.urgente ? 'checked' : ''}> Me impide trabajar</label>
        </div>
      </div>
      <div class="tarjeta">
        <h3>Cliente</h3>
        <div class="prop">
          <span>Servicio</span><select class="campo" id="pServ">${(clientesCache?.servicios || []).map(x => `<option ${x === (ficha?.servicio || 'Sin clasificar') ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
          <span>Origen</span><select class="campo" id="pOrig">${(clientesCache?.origenes || []).map(x => `<option ${x === (ficha?.tipo_cliente || 'Sin clasificar') ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
        </div>
        <div class="historial" style="margin-top:12px">${otros.slice(0, 5).map(x => `<a href="#/bandeja/${x.id}">#${x.id} ${esc(x.tipo_incidencia)}<span>${fecha(x.entrada)} · ${esc(x.estado)}</span></a>`).join('') || '<div style="font-size:13px;color:var(--muted)">Primer ticket de este cliente.</div>'}</div>
      </div>

  hilo.scrollTop = hilo.scrollHeight;
  const resp = $('resp');
  const crecer = () => { resp.style.height = 'auto'; resp.style.height = Math.min(200, resp.scrollHeight) + 'px'; };
  resp.oninput = crecer;
  resp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('redactar').requestSubmit(); } };
  $('redactar').querySelector('.modos').onclick = e => {
    const b = e.target.closest('button[data-m]');
    if (!b) return;
    modoNota = b.dataset.m === 'nota';
    pintarDetalle(t);
    $('resp').focus();
  };
  $('plantilla').onchange = e => {
    const p = PLANTILLAS[e.target.value];
    if (!p) return;
    resp.value = p[1].replace('{contacto}', t.contacto ? ' ' + t.contacto.split(' ')[0] : '').replace('{tecnico}', yo() || 'el técnico');
    e.target.value = '';
    crecer();
    resp.focus();
  };
  $('redactar').onsubmit = async e => {
    e.preventDefault();
    const texto = resp.value.trim();
    if (!texto || !exigirTecnico()) return;
    resp.value = '';
    try { await accion(t.id, 'mensaje', { texto, nota: modoNota }); }
    catch (err) { resp.value = texto; fallo(err); }
  };
  $('copiar').onclick = async () => {
    try { await navigator.clipboard.writeText(`${location.origin}/t/${t.token}`); aviso('Enlace copiado: el cliente lo abre sin login.'); }
    catch { aviso('No se ha podido copiar.', true); }
  };
  det.querySelector('.lado').onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.t) {
      if (!exigirTecnico()) return;
      if (b.dataset.t === 'otro') return pedirTiempo(t);
      return accion(t.id, 'tiempo', { minutos: Number(b.dataset.t) }).then(() => aviso(`+${b.dataset.t} min apuntados a ${yo()}`)).catch(fallo);
    }
    const a = b.dataset.a;
    if (!a) return;
    if (a !== 'reabrir' && !exigirTecnico()) return;
    if (a === 'cerrar') return cerrarTicket(t);
    if (a === 'video') return dialogoVideo(t);
    if (a === 'anularCita') {
      if (!confirm('¿Anular esta videollamada? El cliente recibirá el aviso.')) return;
      return accion(t.id, 'anularCita', { cita: Number(b.dataset.cita) }).then(() => aviso('Videollamada anulada.')).catch(fallo);
    }
    accion(t.id, a).catch(fallo);
  };
  $('pTec').onchange = e => accion(t.id, 'asignar', { asignado: e.target.value }).then(() => aviso(e.target.value ? `Asignado a ${e.target.value}` : 'Sin asignar')).catch(fallo);
  $('pTipo').onchange = e => accion(t.id, 'datos', { tipo_incidencia: e.target.value }).catch(fallo);
  $('pUrg').onchange = e => accion(t.id, 'urgencia', { urgente: e.target.checked }).catch(fallo);
  const guardarFicha = () => api('/api/clientes', { nombre: t.cliente, servicio: $('pServ').value, tipo_cliente: $('pOrig').value })
    .then(() => { clientesCache = null; cargarClientes(); aviso('Cliente actualizado.'); }).catch(fallo);
  $('pServ').onchange = guardarFicha;
  $('pOrig').onchange = guardarFicha;
}

// Videollamadas de Google Meet del ticket: previstas, hechas (con su duración real) y anuladas.
function tarjetaCitas(t) {
  const l = (t.citas || []).filter(c => c.origen !== 'ahora' || c.estado !== 'prevista').slice().sort((a, b) => b.inicio.localeCompare(a.inicio));
  if (!l.length) return '';
  const ahoraIso = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
  return `<div class="tarjeta"><h3>Videollamadas</h3><div class="historial">${l.map(c => {
    const futura = c.estado === 'prevista' && c.fin > ahoraIso;
    const estado = c.estado === 'hecha' ? `${c.minutosReales} min (Meet)` : c.estado === 'anulada' ? 'Anulada' : c.estado === 'sin_datos' ? 'Sin registro en Meet' : futura ? (c.origen === 'cliente' ? 'Reservada por el cliente' : 'Prevista') : 'Pendiente de Meet';
    return `<div style="padding:8px 0;border-top:1px solid var(--linea);font-size:13px">
      <div style="display:flex;justify-content:space-between;gap:8px"><b style="${c.estado === 'anulada' ? 'text-decoration:line-through;color:var(--muted)' : ''}">${c.origen === 'ahora' ? 'Al momento' : fechaHora(c.inicio)}</b><span style="color:var(--muted)">${esc(estado)}</span></div>
      ${futura ? `<div style="display:flex;gap:6px;margin-top:6px"><a class="boton sec peq" style="text-decoration:none" href="${esc(c.enlace)}" target="_blank" rel="noopener">Unirme ↗</a><button class="boton sec peq" data-a="anularCita" data-cita="${c.id}">Anular</button></div>` : ''}
    </div>`;
  }).join('')}</div></div>`;
}

function dialogoVideo(t) {
  const g = googleInfo.activo && googleInfo.ok !== false;
  const manana = new Date(Date.now() + 864e5);
  const fechaDef = new Date(manana - manana.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  dialogo(`<h3>Videollamada con Google Meet</h3>
    <p class="sub">${g ? 'La reunión se crea en el calendario de soporte y el enlace le llega al cliente por su canal.' : `${googleInfo.activo ? 'Google da error' : 'Google no está conectado'} (panel → Canales). Crea la reunión en meet.new y pega aquí el enlace.`}</p>
    ${g ? `<div class="filtros" style="position:static;padding:8px 0 0;border:0;background:none"><div class="seg" id="vModo"><button type="button" data-v="ahora" class="on">Ahora</button><button type="button" data-v="agendar">Agendar</button><button type="button" data-v="pegar">Pegar enlace</button></div></div>` : ''}
    <div data-panel="ahora" class="${g ? '' : 'oculto'}"><p style="font-size:13px;color:var(--bruma);margin:12px 0 0">Crea la reunión, te la abre y arranca el cronómetro. Cuando termine, Meet nos dirá cuánto duró de verdad.</p></div>
    <div data-panel="agendar" class="oculto"><div class="dos">
      <div><label>Día</label><input class="campo" type="date" name="dia" value="${fechaDef}"></div>
      <div><label>Hora</label><input class="campo" type="time" name="hora" value="10:00" step="900"></div>
      <div><label>Duración</label><select class="campo" name="min"><option value="30">30 min</option><option value="45">45 min</option><option value="60">1 hora</option><option value="90">1 h 30 min</option></select></div>
    </div><p style="font-size:12px;color:var(--muted);margin:8px 0 0">${t.email ? `El cliente (${esc(t.email)}) recibe la invitación de Google Calendar.` : 'Este cliente no tiene correo: le llega el enlace por su canal.'}</p></div>
    <div data-panel="pegar" class="${g ? 'oculto' : ''}"><label>Enlace de Google Meet</label><input class="campo" name="enlace" placeholder="https://meet.google.com/abc-defg-hij">
      <p style="font-size:12px;color:var(--muted);margin:8px 0 0"><a href="https://meet.new" target="_blank" rel="noopener">Crear una reunión en meet.new ↗</a> y copiar su enlace.</p></div>
    <div class="pie"><button type="button" class="boton sec" data-cerrar>Cancelar</button><button type="submit" class="boton" id="vEnviar">${g ? 'Crear y abrir' : 'Enviar al cliente'}</button></div>`,
    async f => {
      const modo = g ? f.querySelector('#vModo .on').dataset.v : 'pegar';
      if (modo === 'agendar') {
        if (!f.dia.value || !f.hora.value) { aviso('Elige día y hora.', true); return false; }
        await accion(t.id, 'cita', { inicio: `${f.dia.value}T${f.hora.value}`, minutos: Number(f.min.value) });
        aviso('Videollamada agendada y enviada al cliente.');
        return;
      }
      const w = modo === 'ahora' ? open('about:blank') : null;
      try {
        const r = await accion(t.id, 'video', modo === 'pegar' ? { enlace: f.enlace.value.trim() } : {});
        if (w) w.location = r.video;
        aviso('Enlace enviado al cliente.');
      } catch (e) { if (w) w.close(); throw e; }
    });
  const seg = $('vModo');
  if (seg) seg.onclick = e => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    [...seg.children].forEach(x => x.classList.toggle('on', x === b));
    $('dlg').querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('oculto', p.dataset.panel !== b.dataset.v));
    $('vEnviar').textContent = { ahora: 'Crear y abrir', agendar: 'Agendar y enviar', pegar: 'Enviar al cliente' }[b.dataset.v];
  };
}

function tick() {
  const t = tickets.find(x => x.id === selActual);
  if (t && $('reloj') && t.activa) $('reloj').textContent = hms(segundos(t));
}

async function accion(id, a, extra = {}) {
  const t = await api(`/api/tickets/${id}/${a}`, { tecnico: yo(), ...extra });
  tickets = tickets.map(x => x.id === t.id ? t : x);
  pintarLista(selActual);
  firmaDet = firmaDe(t);
  if (t.id === selActual) pintarDetalle(t);
  return t;
}

function dialogo(html, alEnviar) {
  const d = $('dlg');
  d.innerHTML = `<form method="dialog" novalidate>${html}</form>`;
  const f = d.querySelector('form');
  f.onsubmit = async e => {
    e.preventDefault();
    const b = f.querySelector('button[type=submit]');
    b.disabled = true;
    try { if (await alEnviar(f) !== false) d.close(); } catch (err) { fallo(err); }
    b.disabled = false;
  };
  f.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = () => d.close());
  d.showModal();
  f.querySelector('input, textarea, select')?.focus();
}

function pedirTiempo(t) {
  dialogo(`<h3>Apuntar tiempo</h3><p class="sub">Trabajo hecho fuera del cronómetro, a nombre de ${esc(yo())}.</p>
    <div class="dos"><div><label>Minutos</label><input class="campo" name="min" type="number" min="1" max="600" value="20"></div>
    <div><label>Qué has hecho <small>(opcional)</small></label><input class="campo" name="motivo" placeholder="Llamada, revisión…"></div></div>
    <div class="pie"><button type="button" class="boton sec" data-cerrar>Cancelar</button><button type="submit" class="boton">Apuntar</button></div>`,

function cerrarTicket(t) {
  const ficha = clientesCache?.clientes.find(c => c.nombre === t.cliente);
  const sinClasificar = !ficha || pendiente(ficha);
  const como = t.canal === 'WhatsApp' ? 'por WhatsApp' : t.email ? 'en su página y por correo (si el correo está activo)' : 'en su página';
  dialogo(`<h3>Cerrar #${t.id} · ${esc(t.cliente)}</h3>
    <p class="sub">Tiempo registrado: <b>${hms(segundos(t))}</b>. El cliente recibirá la encuesta de valoración ${como}.</p>
    <label>Tipo de incidencia</label><select class="campo" name="tipo">${[...new Set([...TIPOS, t.tipo_incidencia])].map(x => `<option ${x === t.tipo_incidencia ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <label>Cómo se ha resuelto <small>(nota interna, opcional)</small></label><textarea class="campo" name="solucion" rows="3" placeholder="Para la próxima vez que pase…"></textarea>
    <label>Minutos extra fuera del cronómetro <small>(opcional)</small></label><input class="campo" name="min" type="number" min="0" max="600" placeholder="0">
    ${sinClasificar ? `<div class="dos"><div><label>Servicio del cliente</label><select class="campo" name="serv">${(clientesCache?.servicios || []).map(x => `<option ${x === (ficha?.servicio || 'Sin clasificar') ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div><label>Origen del cliente</label><select class="campo" name="orig">${(clientesCache?.origenes || []).map(x => `<option ${x === (ficha?.tipo_cliente || 'Sin clasificar') ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div></div>` : ''}
    <div class="pie"><button type="button" class="boton sec" data-cerrar>Cancelar</button><button type="submit" class="boton verde">Cerrar y pedir valoración</button></div>`,
    async f => {
      if (f.serv) await api('/api/clientes', { nombre: t.cliente, servicio: f.serv.value, tipo_cliente: f.orig.value }).then(() => { clientesCache = null; cargarClientes(); });
      await accion(t.id, 'cerrar', { tipo_incidencia: f.tipo.value, solucion: f.solucion.value, minutos: Number(f.min.value) || 0 });
      aviso('Ticket cerrado. Encuesta enviada.');
    });
}

function nuevoTicket() {
  if (!exigirTecnico()) return;
  const nombres = (clientesCache?.clientes || []).map(c => c.nombre);
  dialogo(`<h3>Nuevo ticket</h3><p class="sub">Para llamadas, WhatsApp o correos que te llegan a ti. El cronómetro arranca solo.</p>
    <div class="dos">

// ================= Métricas =================
const PERIODOS = {
  mes: ['Este mes', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), h.getMonth(), 1)), iso(h)]; }],
  pasado: ['Mes pasado', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), h.getMonth() - 1, 1)), iso(new Date(h.getFullYear(), h.getMonth(), 0))]; }],
  trim: ['Este trimestre', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), Math.floor(h.getMonth() / 3) * 3, 1)), iso(h)]; }],
  d90: ['90 días', () => { const h = new Date(); return [iso(new Date(h - 89 * 864e5)), iso(h)]; }],
  anio: ['Este año', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), 0, 1)), iso(h)]; }],
};
let fm = leer('filtrosMetricas', { periodo: 'trim', servicio: '', tecnico: '', tipo_cliente: '' });
const DESC = {
  'Implementación': 'Clientes fuera de Kit Digital: referidos por una gestoría/asesoría, o antiguos clientes de AKIRA sin Holded que lo solicitan.',
  'Premium': 'Gestorías y asesorías con servicio Premium, más cualquier cliente que lo contrate directamente.',
};
const TITULO = { 'Implementación': 'Implementación Holded', 'Premium': 'Servicio Premium Holded' };
const PALABRA = { ok: 'OK', atencion: 'Atención', critico: 'Crítico' };
const ICO = {
  tendencia: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
  engranaje: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  calendario: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  descarga: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  persona: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>',
  abajo: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  historial: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>',
  personas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>',
  alerta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg>',
  reloj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  estrella: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
};
const ICONO_SERVICIO = { 'Implementación': ICO.engranaje, 'Premium': ICO.estrella };

function rango() {
  if (fm.periodo === 'custom' && fm.desde && fm.hasta) return [fm.desde, fm.hasta];
  return (PERIODOS[fm.periodo] || PERIODOS.trim)[1]();
}

function vistaMetricas() {
  const [d, h] = rango();
  $('vista').innerHTML = `
    <div class="mk">
      <div class="mk-cab">
        <div class="mk-logo">${ICO.tendencia}</div>
        <div><h1>Servicio Holded</h1><p>Dashboard operativo — Implementación y Soporte Premium</p></div>
        <div class="mk-chips"><span class="mk-chip">${ICO.calendario}<span id="chipHoy"></span></span><a class="boton sec" id="csv">${ICO.descarga}Descargar horas (CSV)</a></div>
      </div>
      <div class="filtros">
        <div class="seg" id="seg">${Object.entries(PERIODOS).map(([k, [n]]) => `<button data-p="${k}" class="${fm.periodo === k ? 'on' : ''}">${n}</button>`).join('')}</div>
        <button type="button" class="desplegable ${fm.periodo === 'custom' ? 'on' : ''}" id="btnFechas">${ICO.calendario}Fechas${ICO.abajo}</button>
        <span id="fechas" class="fechas ${fm.periodo === 'custom' ? '' : 'oculto'}"><input type="date" class="campo" id="fDesde" value="${d}"> – <input type="date" class="campo" id="fHasta" value="${h}"></span>
        <label class="desplegable equipo">${ICO.persona}<span id="txtTec">${esc(fm.tecnico || 'Todo el equipo')}</span>${ICO.abajo}
          <select id="fTec" aria-label="Técnico"><option value="">Todo el equipo</option></select></label>
      </div>
      <div class="contenido" id="met"><div class="vacio">Cargando métricas…</div></div>
    </div>`;
  $('chipHoy').textContent = 'Hoy · ' + new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  $('fTec').innerHTML += equipo.map(x => `<option ${x === fm.tecnico ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const cambiar = () => { escribir('filtrosMetricas', fm); cargarMetricas(); };
  // Periodos fijos en el segmento; «Fechas» abre el rango a medida.
  const modoFechas = si => {
    $('btnFechas').classList.toggle('on', si);
    $('fechas').classList.toggle('oculto', !si);
    [...$('seg').children].forEach(x => x.classList.toggle('on', !si && x.dataset.p === fm.periodo));
  };
  $('seg').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    fm.periodo = b.dataset.p;
    modoFechas(false);
    cambiar();
  };
  $('btnFechas').onclick = () => {
    if (fm.periodo !== 'custom') { fm.periodo = 'custom'; fm.desde = $('fDesde').value; fm.hasta = $('fHasta').value; modoFechas(true); cambiar(); }
    $('fDesde').focus();
  };
  $('fDesde').onchange = $('fHasta').onchange = () => { fm.desde = $('fDesde').value; fm.hasta = $('fHasta').value; cambiar(); };
  $('fTec').onchange = e => { fm.tecnico = e.target.value; $('txtTec').textContent = fm.tecnico || 'Todo el equipo'; cambiar(); };
  cargarMetricas();
  const i = setInterval(() => !document.hidden && cargarMetricas(), 60000);
  pararVista = () => clearInterval(i);
}

async function cargarMetricas() {
  const [d, h] = rango();
  const q = new URLSearchParams({ desde: d, hasta: h, tecnico: fm.tecnico });
  if ($('csv')) $('csv').href = '/api/horas.csv?' + q;
  let r;
  try { r = await api('/api/resumen?' + q); } catch (e) { return fallo(e); }
  if (!$('met')) return;
  // Tal cual el mockup: leyenda, Implementación y Premium, y los KPI por tipo de cliente.
  $('met').innerHTML = `
    <div class="mk-leyenda"><span class="tit">LEYENDA</span>
      <span><i class="mk-dot" style="background:var(--mk-ok)"></i><b>OK</b> — dentro de la calidad de servicio</span>
      <span><i class="mk-dot" style="background:var(--mk-at)"></i><b>Atención</b> — hay riesgo, requiere seguimiento</span>
      <span><i class="mk-dot" style="background:var(--mk-cr)"></i><b>Crítico</b> — servicio mal hecho o SLA superado</span></div>
    ${r.servicios.map(bloqueServicio).join('')}
    ${r.antiguos.vacio ? '' : bloqueAntiguos(r.antiguos)}
    ${bloqueTipos(r)}`;
  $('met').querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => { location.hash = `#/bandeja/${tr.dataset.id}`; });
}

// Tarjeta de número grande, como las del mockup: icono y semáforo arriba, valor y etiqueta.
// Con «aviso», en vez del semáforo lleva esa palabra en azul (cifras sin umbral, como las del periodo).
function tile(icono, nivel, valor, sufijo, etiqueta, aviso) {
  const n = nivel || 'nada';
  const arriba = aviso ? `<span class="c-azul">${icono}</span><span class="mk-pill info">${aviso}</span>`
    : `<span class="c-${n}">${icono}</span><span class="mk-pill ${n}">${nivel ? PALABRA[nivel] : 'Sin datos'}</span>`;
  return `<div class="mk-tile"><div class="top">${arriba}</div>
    <div class="v">${valor}${sufijo ? `<small>${sufijo}</small>` : ''}</div><div class="l">${etiqueta}</div></div>`;
}

const exceso = m => !m ? '0 min' : m < 60 ? `+${m} min` : `+${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
const horaEntrada = isoTxt => {
  const d = new Date(isoTxt), hoy = new Date();
  const hm = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === hoy.toDateString() ? hm : `${fecha(isoTxt)} · ${hm}`;
};

function bloqueServicio(b) {
  const estado = b.vacio ? null : b.estado;
  const chip = !estado ? '<span class="mk-estado nada">Sin datos</span>'
    : estado === 'ok' ? '<span class="mk-estado ok">✓ Todo OK</span>'
    : estado === 'atencion' ? '<span class="mk-estado atencion">! Atención</span>' : '<span class="mk-estado critico">⊗ Crítico</span>';
  const niveles = b.niveles || {};
  return `<section class="mk-sec">
    <div class="mk-sec-cab"><span class="mk-ico">${ICONO_SERVICIO[b.nombre]}</span><div><h2>${esc(TITULO[b.nombre] || b.nombre)}</h2><p>${esc(DESC[b.nombre] || '')}</p></div>${chip}</div>
    <div class="mk-tiles">
      ${tile(ICO.alerta, niveles.abiertas, num(b.abiertas || 0), '', 'Incidencias abiertas')}
      ${tile(ICO.reloj, niveles.excedido, exceso(b.excedidoMin || 0), '', 'Tiempo excedido sobre la 1h de SLA')}
      ${tile(ICO.estrella, niveles.valoracion, b.valoracion == null ? '—' : num(b.valoracion, 1), b.valoracion == null ? '' : '/5', `Valoración media (NPS / Google)${b.respuestasNps ? ` · ${b.respuestasNps} resp.` : ''}`)}
    </div>
    ${tablaCasos(b, b.nombre === 'Premium')}
  </section>`;
}

// Clientes antiguos (Kit Digital), debajo de los dos bloques del mockup y con su mismo aspecto.
function bloqueAntiguos(b) {
  return `<section class="mk-sec">
    <div class="mk-sec-cab"><span class="mk-ico">${ICO.historial}</span><div><h2>Cliente antiguo (Kit Digital)</h2><p>Clientes del Kit Digital y antiguos clientes, con el histórico del antiguo formulario. El formulario no medía la primera respuesta ni la valoración.</p></div><span class="mk-estado nada">Histórico</span></div>
    <div class="mk-tiles">
      ${tile(ICO.alerta, null, num(b.tickets || 0), '', 'Incidencias en el periodo', 'Periodo')}
      ${tile(ICO.reloj, null, num(b.horas || 0, 1), ' h', 'Horas de soporte', 'Periodo')}
      ${tile(ICO.personas, null, num(b.clientes || 0), '', 'Clientes atendidos', 'Periodo')}
    </div>
    ${tablaCasos(b, false)}
  </section>`;
}

function tablaCasos(b, conCanal) {
  const casos = b.casos || [];
  // Sin casos: una línea con icono, como en el diseño, en vez de la tabla vacía.
  if (!casos.length) return `<div class="mk-vacio"><span class="mk-vacio-ico">${ICO.persona}</span><span>${b.vacio ? 'Aún no hay clientes con este servicio. Asígnalo en <a href="#/clientes">Clientes</a> o desde el propio ticket.' : 'Ningún caso abierto ahora.'}</span></div>`;
  return `<div class="mk-casos">
      <div class="tit">CASOS ABIERTOS AHORA</div>
      <div class="tabla"><table><thead><tr><th>Cliente</th><th>${conCanal ? 'Canal' : 'Origen'}</th><th>Entrada</th><th>Tiempo</th><th>Estado</th></tr></thead><tbody>
        ${casos.map(c => {
          const [cls, txt] = c.respondido ? ['resp', 'Respondido'] : c.esperaMin == null ? ['nada', c.estado] : c.esperaMin > 60 ? ['critico', 'Fuera de SLA'] : c.esperaMin > 45 ? ['atencion', 'Cerca del límite'] : ['ok', 'En plazo'];
          return `<tr class="clic" data-id="${c.id}"><td><b>${esc(c.cliente)}</b></td><td>${esc(conCanal ? c.canal : c.origen)}</td><td>${horaEntrada(c.entrada)}</td><td>${c.esperaMin == null ? '—' : dur(c.esperaMin)}</td><td><span class="mk-pill ${cls}">${txt}</span></td></tr>`;
        }).join('')}</tbody></table></div>
    </div>`;
}

// Aro de la página 2 del mockup: pista suave y arco del color del estado que arranca arriba,
// con el máximo encima («| 20»), el número dentro y la palabra del estado debajo.
function aro(valor, max, etiqueta, nivel, numero) {
  const n = nivel || 'nada';
  const r = 52, c = 2 * Math.PI * r;
  const f = Math.max(0, Math.min(1, (numero || 0) / max));
  return `<div class="mk-aro ${n}"><div class="max"><i></i>${max}</div>
    <svg viewBox="0 0 128 128" role="img" aria-label="${esc(etiqueta.replace('<br>', ' '))}: ${esc(valor)} de ${max}">
      <circle class="pista" cx="64" cy="64" r="${r}"/>
      ${f ? `<circle class="arco" cx="64" cy="64" r="${r}" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}"/>` : ''}
      <text x="64" y="64" dy=".36em" text-anchor="middle">${esc(valor)}</text></svg>
    <div class="l">${etiqueta}</div><div class="e">${nivel ? PALABRA[nivel] : 'Sin datos'}</div></div>`;
}

function bloqueTipos(r) {
  const tarjeta = s => {
    const impl = s.servicio === 'Implementación';
    return `<section class="mk-sec">
      <div class="mk-sec-cab" style="margin-bottom:6px"><span class="mk-ico">${ICONO_SERVICIO[s.servicio]}</span><div><h2>${esc(TITULO[s.servicio])}</h2>${s.sinOrigen ? `<p>${s.sinOrigen} cliente${s.sinOrigen > 1 ? 's' : ''} sin origen asignado no entra${s.sinOrigen > 1 ? 'n' : ''} aquí.</p>` : ''}</div></div>
      ${s.grupos.map(g => `<div class="mk-grupo"><div class="nom">${esc(g.nombre)}</div>
        <div class="mk-aros">
          ${aro(num(g.abiertas || 0), impl ? 10 : 20, impl ? 'Casos<br>activos' : 'Incidencias<br>abiertas', g.vacio ? null : g.niveles.abiertas, g.abiertas)}
          ${aro(num(g.fueraSla || 0), impl ? 5 : 10, 'Incidencias<br>fuera de SLA', g.vacio ? null : g.niveles.fueraSla, g.fueraSla)}
          ${aro(g.valoracion == null ? '—' : num(g.valoracion, 1), 5, 'Valoración<br>NPS / Google', g.vacio ? null : g.niveles.valoracion, g.valoracion)}
        </div></div>`).join('')}
    </section>`;
  };
  return `<div><div class="mk-cab" style="padding:8px 0 12px"><div class="mk-logo">${ICO.tendencia}</div><div><h1 style="font-size:19px">KPI por tipo de cliente</h1><p>Cada servicio separado por el origen del cliente.</p></div></div>
    <div class="mk-tipos">${r.porTipo.map(tarjeta).join('')}</div>
    <div class="mk-leyenda" style="margin-top:20px">
      <span><i class="mk-dot" style="background:var(--mk-ok)"></i>OK</span>
      <span><i class="mk-dot" style="background:var(--mk-at)"></i>Atención</span>
      <span><i class="mk-dot" style="background:var(--mk-cr)"></i>Crítico</span></div></div>`;
}

// ================= Clientes =================
async function cargarClientes() {
  if (!clientesCache) clientesCache = await api('/api/clientes');
  return clientesCache;
}
let filtroCli = { q: '', sin: false };

function pintarClientes() {

  </tbody></table>` : '<div class="vacio">Ningún cliente coincide.</div>';
  $('ctabla').onchange = async e => {
    const s = e.target.closest('select[data-campo]');

    const nombre = s.closest('tr').dataset.nombre;
    try {
      await api('/api/clientes', { nombre, [s.dataset.campo]: s.value });
      const x = clientesCache.clientes.find(y => y.nombre === nombre);
      x[s.dataset.campo] = s.value;
      aviso(`${nombre}: ${s.value}`);
    } catch (err) { fallo(err); }
  };
  $('ctabla').onclick = e => {
    if (!e.target.closest('[data-fusion]')) return;
    const de = e.target.closest('tr').dataset.nombre;
    dialogo(`<h3>Fusionar «${esc(de)}»</h3><p class="sub">Todas sus incidencias pasan al cliente que elijas; «${esc(de)}» queda como nombre de contacto. No se puede deshacer desde aquí.</p>
      <label>Es el mismo cliente que…</label><input class="campo" name="a" list="dlFusion" placeholder="Escribe para buscar" required>
      <datalist id="dlFusion">${c.clientes.filter(x => x.nombre !== de).map(x => `<option value="${esc(x.nombre)}">`).join('')}</datalist>
      <div class="pie"><button type="button" class="boton sec" data-cerrar>Cancelar</button><button type="submit" class="boton">Fusionar</button></div>`,
      async f => {
        const a = f.a.value.trim();

        const r = await api('/api/clientes/fusionar', { de, a });

}

// ================= Adjuntos =================
const pesoTxt = b => b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${num(b / 1048576, 1)} MB`;
function adjuntoHtml(a) {
  const url = `/api/adjuntos/${a.id}`;
  const ext = (a.nombre.match(/\.([a-z0-9]+)$/i)?.[1] || '').toUpperCase().slice(0, 4);
  if (/^image\/(png|jpeg|gif|webp)$/.test(a.tipo)) return `<a class="adj ver-img" href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(a.nombre)}" loading="lazy"></a><small>📎 ${esc(a.nombre)} · ${pesoTxt(a.tamano)}</small>`;
  return `<a class="adj" href="${url}" target="_blank" rel="noopener"><span class="ico">${esc(ext)}</span><span><b>${esc(a.nombre)}</b><small>${pesoTxt(a.tamano)} · abrir</small></span></a>`;
}

})();
// Visor de imágenes del chat: se cierra con la cruz, con Esc o pulsando fuera de la imagen.
// Ctrl/Cmd + clic sigue abriéndola en otra pestaña.
(() => {
  const visor = document.createElement('div');
  visor.className = 'visor'; visor.hidden = true;
  visor.setAttribute('role', 'dialog'); visor.setAttribute('aria-modal', 'true'); visor.setAttribute('aria-label', 'Imagen adjunta');
  visor.innerHTML = '<span class="nombre"></span><button type="button" class="cerrar" aria-label="Cerrar (Esc)" title="Cerrar (Esc)">×</button><img alt="">';
  document.body.append(visor);
  const img = visor.querySelector('img');
  let origen = null;
  const cerrar = () => {
    if (visor.hidden) return;
    visor.hidden = true; img.removeAttribute('src'); document.body.style.overflow = '';
    if (origen?.isConnected) origen.focus();
  };
  document.addEventListener('click', e => {
    const a = e.target.closest('a.ver-img');
    if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    origen = a; img.src = a.href; img.alt = a.querySelector('img')?.alt || '';
    visor.querySelector('.nombre').textContent = img.alt;
    visor.hidden = false; document.body.style.overflow = 'hidden';
    visor.querySelector('.cerrar').focus();
  });
  visor.addEventListener('click', e => { if (e.target !== img) cerrar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !visor.hidden) { e.preventDefault(); cerrar(); } });
})();
