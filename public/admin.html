  // Al girar o redimensionar la pantalla, de tabla a tarjetas y al revés.
  let ancho = TARJETAS_SOLO();
  const alCambiar = () => { if (TARJETAS_SOLO() !== ancho) { ancho = TARJETAS_SOLO(); pintarClientes(); } };
  addEventListener('resize', alCambiar);
  pararVista = () => { document.removeEventListener('keydown', tecla); removeEventListener('resize', alCambiar); };
  clientesCache = null;
  cargarClientes().then(pintarClientes).catch(fallo);
}

function pintarClientes() {
  const c = clientesCache;
  if (!c || !$('cltabla')) return;
  const f = filtroCli;
  // Servicio y origen: solo los que existen en la lista.
  const llenar = (campo, lista) => { const s = $('vista').querySelector(`select[data-f="${campo}"]`); if (s && s.options.length <= 1) s.innerHTML = `<option value="">Todos</option>${lista.map(o => `<option ${o === f[campo] ? 'selected' : ''}>${esc(o)}</option>`).join('')}`; };
  llenar('serv', c.servicios); llenar('orig', c.origenes);
  const q = f.q.trim().toLowerCase();
  const hoy = Date.now(), dias = iso => iso ? (hoy - new Date(iso)) / 864e5 : Infinity;
  const l = c.clientes.filter(x => !prospecto(x) &&
    // Dos grupos que nunca se mezclan: los que tienen incidencias y los del Kit Digital 1 que no han abierto ninguna.
    (f.tick === 'kit' ? kitSinTickets(x) : !kitSinTickets(x) && (f.tick !== 'abiertas' || x.abiertos > 0))
    && (!f.serv || x.servicio === f.serv) && (!f.orig || x.tipo_cliente === f.orig)
    && (!f.estado || (f.estado === 'pend' ? pendiente(x) : f.estado === 'clas' ? !pendiente(x) : !!x.kitDigital))
    && (!f.contacto || (f.contacto === 'nunca' ? !x.ultimo : f.contacto === 'viejo' ? x.ultimo && dias(x.ultimo) > 365 : dias(x.ultimo) <= Number(f.contacto)))
    && (!f.horas || (f.horas === 'con' ? x.horas > 0 : f.horas === 'sin' ? !x.horas : x.horas >= Number(f.horas)))
    && (!q || `${x.nombre} ${x.kitDigital || ''} ${x.codigo} ${x.emails.join(' ')} ${x.telefonos.join(' ')}`.toLowerCase().includes(q)));
  ordenarClientes(l);
  const paginas = Math.max(1, Math.ceil(l.length / POR_PAGINA));
  f.pag = Math.min(f.pag, paginas);
  const ini = (f.pag - 1) * POR_PAGINA, pag = l.slice(ini, ini + POR_PAGINA);
  $('ccuenta').textContent = `${l.length} ${l.length === 1 ? 'cliente' : 'clientes'}`;
  // Pestañas: con incidencias / Kit Digital 1 activos que nunca han abierto ninguna / todos.
  const cuantos = { con: c.clientes.filter(x => !prospecto(x) && !kitSinTickets(x)).length, kit: c.clientes.filter(kitSinTickets).length };
  if ($('cliTick')) $('cliTick').style.visibility = f.tick === 'kit' ? 'hidden' : '';
  $('cliTabs').innerHTML = [['con', 'Con incidencias'], ['kit', 'Kit Digital 1 sin incidencias']]
    .map(([k, t]) => `<button type="button" data-t="${k}" class="${(f.tick === k || (k === 'con' && f.tick === 'abiertas')) ? 'on' : ''}">${t} <span class="n">${num(cuantos[k])}</span></button>`).join('');
  $('cliTabs').onclick = e => {
    const b = e.target.closest('button[data-t]');
    if (!b) return;
    f.tick = b.dataset.t; f.pag = 1;
    const sel = $('vista').querySelector('select[data-f="tick"]');
    if (sel) sel.value = 'con';
    pintarClientes();
  };
  const ficha = x => `#/clientes/${encodeURIComponent(x.nombre)}`;
  const correo = x => x.emails[0] ? `<span class="cl-mail" title="${esc(x.emails.join(', '))}">${ICO_CLI.mail}${esc(x.emails[0])}${x.emails.length > 1 ? ` +${x.emails.length - 1}` : ''}</span>` : (x.telefonos[0] ? `<span class="cl-mail">${esc(x.telefonos[0])}</span>` : '<span style="color:var(--muted)">—</span>');
  // Toda la fila (o tarjeta) abre la ficha; «⋯» edita o fusiona.
  const acciones = () => `<div class="cl-acc"><button class="cl-menu-b" data-menu aria-label="Más acciones" title="Más acciones">⋯</button></div>`;
  const sub = x => `<small>${esc(x.codigo || '')}${x.kitDigital ? `${x.codigo ? ' · ' : ''}Kit Digital 1 activo${x.kitDigital !== x.nombre ? ` · ${esc(x.kitDigital)}` : ''}` : ''}</small>`;
  $('cltabla').innerHTML = !l.length ? '<div class="vacio">Ningún cliente coincide con los filtros.</div>'
    : (f.vista === 'grid' || TARJETAS_SOLO()) ? `<div class="cl-grid">${pag.map(x => `<div class="cl-card" data-nombre="${esc(x.nombre)}">
        <div class="cl-nom">${avatar(x.nombre)}<div style="min-width:0"><a href="${ficha(x)}">${esc(x.nombre)}</a>${sub(x)}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${pildoraServ(x.servicio)}${pildoraOrig(x.tipo_cliente)}</div>
        <div class="num3"><div><b>${x.tickets}</b><span>Tickets</span></div><div><b>${x.abiertos}</b><span>Abiertos</span></div><div><b>${num(x.horas, 1)}</b><span>Horas</span></div></div>
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px">${x.ultimo ? `<span class="cl-fecha">${ICO_CLI.cal}${fechaLarga(x.ultimo)}</span>` : '<span style="color:var(--muted)">Sin contacto</span>'}${acciones(x)}</div>
      </div>`).join('')}</div>`
    : `<div class="tabla"><table><thead><tr>${[['cliente', 'Cliente'], ['servicio', 'Servicio'], ['origen', 'Origen'], ['tickets', 'Tickets', 'num'], ['abiertos', 'Abiertos', 'num'], ['horas', 'Horas', 'num'], ['ultimo', 'Último contacto'], ['email', 'Email']].map(([k, t, cl]) => { const [col, dir] = ordenCli(); return `<th class="ord ${cl || ''} ${k === col ? 'on' : ''}" data-ord="${k}" title="Ordenar por ${t.toLowerCase()}" aria-sort="${k === col ? (dir === 1 ? 'ascending' : 'descending') : 'none'}">${t}<span class="fl">${k === col ? (dir === 1 ? '▲' : '▼') : '↕'}</span></th>`; }).join('')}<th></th></tr></thead><tbody>
      ${pag.map(x => `<tr data-nombre="${esc(x.nombre)}">
        <td><div class="cl-nom">${avatar(x.nombre)}<div style="min-width:0"><a href="${ficha(x)}">${esc(x.nombre)}</a>${sub(x)}</div></div></td>
        <td>${pildoraServ(x.servicio)}</td><td>${pildoraOrig(x.tipo_cliente)}</td>
        <td class="num">${x.tickets}</td><td class="num">${x.abiertos}</td><td class="num">${x.horas ? num(x.horas, 1) + ' h' : '—'}</td>
        <td>${x.ultimo ? `<span class="cl-fecha">${ICO_CLI.cal}${fechaLarga(x.ultimo)}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td>${correo(x)}</td><td>${acciones(x)}</td></tr>`).join('')}
    </tbody></table></div>`;
  // Paginación
  const nums = [...new Set([1, f.pag - 1, f.pag, f.pag + 1, paginas])].filter(n => n >= 1 && n <= paginas).sort((a, b) => a - b);
  $('clpie').innerHTML = l.length ? `<span>Mostrando ${ini + 1}-${ini + pag.length} de ${l.length} ${l.length === 1 ? 'cliente' : 'clientes'}</span>
    <div class="cl-pag"><button data-p="${f.pag - 1}" ${f.pag === 1 ? 'disabled' : ''} aria-label="Anterior">‹</button>${nums.map((n, i) => `${i && n - nums[i - 1] > 1 ? '<span style="padding:6px 2px">…</span>' : ''}<button data-p="${n}" class="${n === f.pag ? 'on' : ''}">${n}</button>`).join('')}<button data-p="${f.pag + 1}" ${f.pag === paginas ? 'disabled' : ''} aria-label="Siguiente">›</button></div>` : '';
  $('clpie').onclick = e => { const b = e.target.closest('button[data-p]'); if (!b || b.disabled) return; f.pag = Number(b.dataset.p); pintarClientes(); $('cltabla').scrollIntoView({ block: 'nearest' }); };
  // Menú «⋯»: editar o fusionar.
  $('cltabla').onclick = e => {
    const th = e.target.closest('th[data-ord]');
    if (th) {
      const [col, dir] = ordenCli(), k = th.dataset.ord;
      f.orden = `${k}:${k === col ? -dir : ORDEN_CLI[k].dir}`;
      const s = $('vista').querySelector('select[data-f="orden"]');
      if (s) s.value = f.orden;
      f.pag = 1;
      return pintarClientes();
    }
    const b = e.target.closest('[data-menu]');
    document.querySelectorAll('.cl-menu').forEach(m => m.remove());
    if (!b) {
      const fila = e.target.closest('[data-nombre]');
      if (fila && !e.target.closest('a, button, .cl-menu')) location.hash = `#/clientes/${encodeURIComponent(fila.dataset.nombre)}`;
      return;
    }
    const nombre = b.closest('[data-nombre]').dataset.nombre;
    const m = document.createElement('div');
    m.className = 'cl-menu';
    m.innerHTML = '<button data-a="editar">Editar servicio y origen…</button><button data-a="fusionar">Fusionar con otro…</button>';
    b.parentNode.append(m);
    m.onclick = ev => {
      const a = ev.target.closest('button[data-a]')?.dataset.a;
      m.remove();
      if (a === 'editar') editarCliente(nombre);
      if (a === 'fusionar') fusionarCliente(nombre);
    };
    e.stopPropagation();
  };
}
document.addEventListener('click', e => { if (e.target.closest('a[data-kit]')) { filtroCli.tick = 'kit'; filtroCli.pag = 1; } });
document.addEventListener('click', e => { if (!e.target.closest('.cl-menu, [data-menu]')) document.querySelectorAll('.cl-menu').forEach(m => m.remove()); });

const selCampo = (nombre, lista, v) => `<select class="campo" name="${nombre}">${lista.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;

function editarCliente(nombre) {

  dialogo(`<h3>${esc(nombre)}</h3><p class="sub">El servicio y el origen cuentan en todas sus incidencias y en las métricas.</p>

      await api('/api/clientes', { nombre, servicio: fm.servicio.value, tipo_cliente: fm.tipo_cliente.value, notas: fm.notas.value });
      Object.assign(x, { servicio: fm.servicio.value, tipo_cliente: fm.tipo_cliente.value, notas: fm.notas.value });

function fusionarCliente(de) {
  const c = clientesCache;
  dialogo(`<h3>Fusionar «${esc(de)}»</h3><p class="sub">Todas sus incidencias pasan al cliente que elijas; «${esc(de)}» queda como nombre de contacto. No se puede deshacer desde aquí.</p>
    <label>Es el mismo cliente que…</label><input class="campo" name="a" list="dlFusion" placeholder="Escribe para buscar" required>
    <datalist id="dlFusion">${c.clientes.filter(x => x.nombre !== de).map(x => `<option value="${esc(x.nombre)}">`).join('')}</datalist>
    <div class="pie"><button type="button" class="boton sec" data-cerrar>Cancelar</button><button type="submit" class="boton">Fusionar</button></div>`,
    async fm => {
      const a = fm.a.value.trim();
      if (!c.clientes.some(x => x.nombre === a)) { aviso('Elige un cliente de la lista.', true); return false; }
      const r = await api('/api/clientes/fusionar', { de, a });
      aviso(`${r.movidos} incidencias pasadas a ${a}.`);

// ---- Ficha de un cliente: sus incidencias (lo que pidió y cómo se le respondió) y, aparte,
// las notas internas del equipo. El servicio y el origen se cambian aquí igual que en la tabla.
async function vistaFicha(nombre) {
  const volver = '<div class="cabeza"><a href="#/clientes" style="font-size:13px;color:var(--bruma);text-decoration:none">← Clientes</a></div>';
  $('vista').innerHTML = `${volver}<div class="contenido"><div class="vacio">Cargando…</div></div>`;
  scrollTo(0, 0);
  let c, todos;
  let acc;
  try { [c, todos, acc] = await Promise.all([cargarClientes(), api('/api/tickets'), cargarAccesos(), cargarComAj()]); } catch (e) { return fallo(e); }
  if (location.hash !== `#/clientes/${encodeURIComponent(nombre)}`) return;
  const x = c.clientes.find(y => y.nombre === nombre);
  if (!x) { $('vista').innerHTML = `${volver}<div class="contenido"><div class="vacio">Este cliente no existe.</div></div>`; return; }
  const l = todos.filter(t => t.cliente === nombre && !t.interno).sort((a, b) => b.entrada.localeCompare(a.entrada));
  const horas = l.reduce((s, t) => s + segundos(t), 0) / 3600;
  const nps = l.map(t => t.nps).filter(v => v != null);
  const todasNotas = l.flatMap(t => t.mensajes.filter(m => m.de === 'nota').map(m => ({ ...m, t }))).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const llamadas = todasNotas.filter(m => m.llamada), notas = todasNotas.filter(m => !m.llamada);

  const incidencia = (t, i) => {
    const [n, txt] = slaDe(t);

          <div id="fsel" style="display:flex;gap:10px;flex-wrap:wrap">
            <label style="font-size:12px;color:var(--bruma)">Servicio<br>${sel('servicio', c.servicios, x.servicio)}</label>
            <label style="font-size:12px;color:var(--bruma)">Origen<br>${sel('tipo_cliente', c.origenes, x.tipo_cliente)}</label>
          </div>
        </div>
        ${(x.cambiosServicio || []).length ? `<p style="margin:10px 0 0;font-size:12px;color:var(--bruma)">${x.cambiosServicio.map(k => `${esc(k.a)} desde el ${fechaLarga(k.fecha)} (antes, ${esc(k.de)})`).reverse().join(' · ')}. Sus incidencias de antes de cada cambio siguen en el servicio de entonces.</p>` : ''}
        <div class="ficha-datos" style="margin-top:16px">
          <div class="ficha-dato"><b>${l.length}</b><span>Incidencias</span></div>
          <div class="ficha-dato"><b>${l.filter(t => t.estado !== 'Cerrado').length}</b><span>Abiertas ahora</span></div>
          <div class="ficha-dato"><b>${num(horas, 1)} h</b><span>Horas de soporte</span></div>
          <div class="ficha-dato"><b>${nps.length ? num(nps.reduce((a, b) => a + b, 0) / nps.length / 2, 1) + '/5' : '—'}</b><span>Valoración media${nps.length ? ` · ${nps.length} resp.` : ''}</span></div>
        </div>
        ${x.notas ? `<p style="margin:12px 0 0;font-size:13px;color:var(--bruma);white-space:pre-wrap">${esc(x.notas)}</p>` : ''}
      </section>
      ${tarjetasCom(x, c)}
      <div class="ficha">
        <section><h2 style="font-size:16px;margin:0 0 10px">Incidencias</h2>${l.map(incidencia).join('') || '<div class="vacio">Sin incidencias.</div>'}</section>

          <p style="margin:0 0 12px;font-size:12px;color:var(--bruma)">Solo las ve el equipo, nunca el cliente. Las del Excel son la columna de observaciones (comentarios internos) del antiguo formulario.</p>
          ${notas.map(m => `<div class="nota-f">${m.t.origen === 'Sheet' ? '<b style="display:block;font-size:11px;color:var(--at-t);margin-bottom:2px">Observación del Excel</b>' : ''}${esc(m.texto)}<small>${m.autor ? esc(m.autor) + ' · ' : ''}${fechaHora(m.fecha)} · <a href="#/bandeja/${m.t.id}">#${m.t.id}</a></small></div>`).join('') || '<div style="font-size:13px;color:var(--muted)">Ninguna nota interna.</div>'}
        </section></div>
      </div>

function montarCom(x, c, recargar) {
  const caja = $('vista').querySelector('.contenido');
  caja.addEventListener('click', async e => {
    const del = e.target.closest('[data-borrar]'), b = e.target.closest('[data-co]');

      if (!confirm('¿Borrar esta nota del seguimiento?')) return;
      try { await api('/api/comercial/nota/borrar', { cliente: x.nombre, id: del.dataset.borrar }); recargar(); } catch (err) { fallo(err); }
      return;
    }
    if (!b) return;
    const a = b.dataset.co, hacer = async (url, cuerpo, txt) => { try { await api(url, { cliente: x.nombre, autor: autorCom(), ...cuerpo }); aviso(txt); recargar(); } catch (err) { fallo(err); } };
    if (a === 'nota') anotarCom(x.nombre, recargar);
    if (a === 'licencia') licenciaCom(x, recargar);
    if (a === 'renovada') renovadaCom(x.nombre, x.holded?.renovacion, recargar);
    if (a === 'baja') bajaCom(x.nombre, recargar);
    if (a === 'reactivar' && confirm('¿La licencia de Holded vuelve a estar activa?')) hacer('/api/comercial/reactivar', {}, 'Licencia activa otra vez.');
    if (a === 'gemas') gemasCom(x, recargar);
    if (a === 'enviar') enviarConvenioDlg(x, recargar);
    if (a === 'anular' && confirm('¿Anular el envío del convenio? El enlace deja de valer.')) hacer('/api/asesorias/anular', {}, 'Envío anulado.');
    if (a === 'onboarding') {
      await hacer('/api/asesorias/onboarding', { hecho: true }, `${x.nombre}: onboarding hecho. Ya es partner activa.`);
      mirarOnboarding();
      if (!(accesosCache || []).some(y => y.cliente === x.nombre)) setTimeout(() => aviso('Dale acceso al portal desde «Acceso al portal» de su ficha.'), 400);
    }
    if (a === 'referir') referirCom(x, recargar);
  });
  $('coEtapa')?.addEventListener('change', async e => {
    const etapa = e.target.value;
    let aMano = false;
    if (etapa === 'Convenio firmado' && !x.partner.convenio?.firmado) {
      if (!confirm('No ha firmado en línea. ¿Lo ha firmado en papel? Pasa a partner con el soporte Premium gratis.')) { e.target.value = x.partner.etapa; return; }
      aMano = true;
    }
    try { await api('/api/asesorias/etapa', { cliente: x.nombre, etapa, aMano, autor: autorCom() }); aviso(`${x.nombre}: ${etapa}.`); mirarOnboarding(); recargar(); }
    catch (err) { fallo(err); e.target.value = x.partner.etapa; }
  });
  $('coAses')?.addEventListener('change', async e => {
    try { await api('/api/comercial/asesoria', { cliente: x.nombre, asesoria: e.target.value }); aviso(e.target.value ? `Vinculado a ${e.target.value}.` : 'Ya no está vinculado a ninguna asesoría.'); recargar(); }
    catch (err) { fallo(err); }
  });
}

// ---- Periodo (el mismo botón que Métricas, como Super Gemas) ----
function periodoHtml(p) {
  return `<div class="periodo">
    <button type="button" class="desplegable" id="${p}BtnPer" aria-haspopup="true" aria-expanded="false">${ICO.calendario}<span id="${p}TxtPer"></span>${ICO.abajo}</button>
    <div class="periodo-panel oculto" id="${p}PanelPer">
      <div class="per-cal oculto" id="${p}CalPer">
        <div class="per-entradas"><input class="campo" id="${p}Desde" inputmode="numeric" placeholder="dd/mm/aaaa" aria-label="Desde"><span>–</span><input class="campo" id="${p}Hasta" inputmode="numeric" placeholder="dd/mm/aaaa" aria-label="Hasta"></div>
        <div class="per-meses" id="${p}MesesPer"></div>
        <p class="per-ayuda">Pulsa el primer día y luego el último.</p>
      </div>
      <div class="per-atajos" role="menu">
        ${Object.entries(PERIODOS).map(([k, [n]]) => `<button type="button" role="menuitem" data-p="${k}">${n}</button>`).join('')}
        <hr><button type="button" role="menuitem" data-p="custom">Personalizado</button>
      </div></div></div>`;
}
const MESES_PER = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function montarPeriodo(p, est, rangoDe, alCambiar) {
  const corta = s => new Date(s + 'T12:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  const dos = n => String(n).padStart(2, '0');
  const ddmm = s => s ? s.split('-').reverse().join('/') : '';
  // dd/mm/aaaa (o aaaa-mm-dd) a aaaa-mm-dd; vacío si no es una fecha.
  const leerFecha = t => {
    const s = String(t).trim();
    let m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/), d, mes, a;
    if (m) [, d, mes, a] = m;
    else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, a, mes, d] = m;
    else return '';
    const f = `${a}-${dos(mes)}-${dos(d)}`;
    return iso(new Date(f + 'T12:00')) === f ? f : '';
  };
  // Lo que se va eligiendo: el primer día pulsado queda de ancla hasta que se pulsa el segundo.
  const cal = { desde: est.desde || '', hasta: est.hasta || '', ancla: null, mes: null };
  const mesHtml = (f, i) => {
    const a = f.getFullYear(), m = f.getMonth(), hoy = iso(new Date()), fin = cal.hasta || cal.desde;
    let celdas = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<span class="dow">${d}</span>`).join('') + '<span></span>'.repeat((new Date(a, m, 1).getDay() + 6) % 7);
    for (let dia = 1, n = new Date(a, m + 1, 0).getDate(); dia <= n; dia++) {
      const x = `${a}-${dos(m + 1)}-${dos(dia)}`;
      const cls = ['per-dia', x === hoy && 'hoy', cal.desde && fin && x > cal.desde && x < fin && 'dentro', (x === cal.desde || x === fin) && 'punta'].filter(Boolean).join(' ');
      celdas += `<button type="button" class="${cls}" data-dia="${x}">${dia}</button>`;
    }
    const y0 = new Date().getFullYear(), anios = [];
    for (let y = y0 - 6; y <= y0 + 1; y++) anios.push(y);
    return `<div class="per-mes"><div class="per-mes-cab">
      ${i === 0 ? '<button type="button" class="per-nav" data-nav="-1" aria-label="Mes anterior">‹</button>' : ''}
      <select data-cal="mes" data-i="${i}" aria-label="Mes">${MESES_PER.map((n, k) => `<option value="${k}"${k === m ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <select data-cal="anio" data-i="${i}" aria-label="Año">${anios.map(y => `<option${y === a ? ' selected' : ''}>${y}</option>`).join('')}</select>
      <span class="hueco"></span>
      ${i === 1 ? '<button type="button" class="per-nav" data-nav="1" aria-label="Mes siguiente">›</button>' : ''}
      </div><div class="per-rejilla">${celdas}</div></div>`;
  };
  const pintarCal = () => {
    // Si no hay nada elegido, el mes pasado y este (hoy queda a la derecha).
    if (!cal.mes) { const b = cal.desde ? new Date(cal.desde + 'T12:00') : new Date(); cal.mes = new Date(b.getFullYear(), b.getMonth() - (cal.desde ? 0 : 1), 1); }
    $(p + 'MesesPer').innerHTML = mesHtml(cal.mes, 0) + mesHtml(new Date(cal.mes.getFullYear(), cal.mes.getMonth() + 1, 1), 1);
    $(p + 'Desde').value = ddmm(cal.desde);
    $(p + 'Hasta').value = ddmm(cal.hasta);
  };
  const pintar = () => {
    const [a, b] = rangoDe();
    $(p + 'TxtPer').textContent = `${est.periodo === 'custom' ? 'Personalizado' : PERIODOS[est.periodo][0]} · ${corta(a)} – ${corta(b)}`;
    $(p + 'PanelPer').querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x.dataset.p === est.periodo));
  };
  const verCal = si => { $(p + 'CalPer').classList.toggle('oculto', !si); if (si) pintarCal(); };
  const abrir = si => {
    $(p + 'PanelPer').classList.toggle('oculto', !si);
    $(p + 'BtnPer').setAttribute('aria-expanded', si);
    if (si) { Object.assign(cal, { desde: est.desde || '', hasta: est.hasta || '', ancla: null, mes: null }); verCal(est.periodo === 'custom'); }
  };
  const aplicar = () => { Object.assign(est, { periodo: 'custom', desde: cal.desde, hasta: cal.hasta }); abrir(false); pintar(); alCambiar(); };
  $(p + 'BtnPer').onclick = e => { e.stopPropagation(); abrir($(p + 'PanelPer').classList.contains('oculto')); };
  $(p + 'PanelPer').onclick = e => {
    e.stopPropagation();
    const nav = e.target.closest('[data-nav]'), dia = e.target.closest('[data-dia]'), b = e.target.closest('[data-p]');
    if (nav) { cal.mes = new Date(cal.mes.getFullYear(), cal.mes.getMonth() + Number(nav.dataset.nav), 1); return pintarCal(); }
    if (dia) {
      const x = dia.dataset.dia;
      if (!cal.ancla) { Object.assign(cal, { desde: x, hasta: '', ancla: x }); return pintarCal(); }
      [cal.desde, cal.hasta] = x < cal.ancla ? [x, cal.ancla] : [cal.ancla, x];
      cal.ancla = null;
      pintarCal();
      return aplicar();
    }
    if (!b) return;
    if (b.dataset.p === 'custom') { verCal(true); $(p + 'PanelPer').querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x === b)); return; }
    est.periodo = b.dataset.p;
    abrir(false); pintar(); alCambiar();
  };
  // Mes y año de cada calendario: el de la derecha siempre es el siguiente al de la izquierda.
  $(p + 'PanelPer').onchange = e => {
    const s = e.target.closest('[data-cal]');
    if (!s) return;
    const i = Number(s.dataset.i), actual = new Date(cal.mes.getFullYear(), cal.mes.getMonth() + i, 1);
    const elegido = s.dataset.cal === 'mes' ? new Date(actual.getFullYear(), Number(s.value), 1) : new Date(Number(s.value), actual.getMonth(), 1);
    cal.mes = new Date(elegido.getFullYear(), elegido.getMonth() - i, 1);
    pintarCal();
  };
  // Las fechas escritas a mano: con las dos bien puestas, se aplica.
  [['Desde', 'desde'], ['Hasta', 'hasta']].forEach(([id, k]) => {
    const inp = $(p + id);
    const tomar = () => {
      const f = leerFecha(inp.value);
      if (!f) { if (inp.value.trim()) aviso('Escribe la fecha como dd/mm/aaaa.', true); return; }
      cal[k] = f; cal.ancla = null; cal.mes = null;
      if (cal.desde && cal.hasta && cal.desde > cal.hasta) [cal.desde, cal.hasta] = [cal.hasta, cal.desde];
      pintarCal();
      if (cal.desde && cal.hasta) aplicar();
    };
    inp.onchange = tomar;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); tomar(); } };
  });
  const fuera = () => abrir(false);
  document.addEventListener('click', fuera);
  pintar();
  return () => document.removeEventListener('click', fuera);
}

function pintarSeg(c) {
  const caja = $('coSegLista');
  if (!caja) return;
  const f = segF, q = f.q.trim().toLowerCase();
  // Para campañas: clientes reales (sin los de ejemplo) y sin las asesorías del embudo.
  const l = c.clientes.filter(x => {
    const h = x.holded, g = gemasTxt(x.gemas) ? x.gemas : null;
    if (x.ejemplo || prospecto(x)) return false;
    if (f.lic === 'activa' && !(h && h.estado !== 'Baja')) return false;
    if (f.lic === 'baja' && !(h && h.estado === 'Baja')) return false;
    if (f.lic === 'sin' && h) return false;
    if (f.plan && h?.plan !== f.plan) return false;
    if (f.renueva) {
      if (!h?.renovacion || h.estado === 'Baja') return false;
      const n = diasA(h.renovacion);
      if (f.renueva === 'vencida' ? n >= 0 : n < 0 || n > Number(f.renueva)) return false;
    }
    if (f.premium && (x.servicio === 'Premium') !== (f.premium === 'si')) return false;
    if (f.gemas === 'si' && !g) return false;
    if (f.gemas === 'no' && g) return false;
    if (['pago', 'gratis'].includes(f.gemas) && g?.pago !== f.gemas) return false;
    if (f.origen && x.tipo_cliente !== f.origen) return false;
    if (f.asesoria && x.asesoria !== f.asesoria) return false;
    return !q || `${x.nombre} ${x.emails.join(' ')}`.toLowerCase().includes(q);
  }).sort(cmpNom);
  const correos = [...new Set(l.map(x => x.emails[0]).filter(Boolean))];
  caja.innerHTML = (l.length ? `<div class="tabla co-seg-t"><table><thead><tr><th>Cliente</th><th>Licencia</th><th>Renovación</th><th>Premium</th><th>Super Gemas</th><th>Origen</th><th>Correo</th></tr></thead><tbody>
    ${l.slice(0, 50).map(x => `<tr><td><a href="#/clientes/${encodeURIComponent(x.nombre)}">${esc(x.nombre)}</a></td><td>${pildoraLic(x.holded)}</td><td>${x.holded?.renovacion ? diaTxt(x.holded.renovacion) : '—'}</td><td>${x.servicio === 'Premium' ? 'Sí' : '—'}</td><td>${esc(gemasTxt(x.gemas) || '—')}</td><td>${esc(x.asesoria ? `Asesoría: ${x.asesoria}` : x.tipo_cliente)}</td><td>${esc(x.emails[0] || '—')}</td></tr>`).join('')}
    </tbody></table></div>${l.length > 50 ? `<p class="co-nota" style="margin:8px 0 0">Se ven 50 de ${num(l.length)}; el CSV los lleva todos.</p>` : ''}` : '<div class="vacio" style="padding:20px">Ningún cliente cumple todo eso.</div>')
    + `<div class="co-seg-pie"><b>${num(l.length)} ${l.length === 1 ? 'cliente' : 'clientes'} · ${num(correos.length)} con correo</b><button type="button" class="boton sec peq" id="segCopiar" ${correos.length ? '' : 'disabled'}>Copiar correos</button><button type="button" class="boton peq" id="segCsv" ${l.length ? '' : 'disabled'}>Descargar CSV</button></div>`;
  $('segCopiar').onclick = async () => { try { await navigator.clipboard.writeText(correos.join(', ')); aviso(`${correos.length} correos copiados.`); } catch { aviso('No se han podido copiar.', true); } };
  $('segCsv').onclick = () => descargarCsv(l);
}
function descargarCsv(l) {
  const celda = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = [['Cliente', 'Correo', 'Teléfono', 'Plan de Holded', 'Licencia', 'Renovación', 'Ingreso anual', 'Soporte Premium', 'Super Gemas', 'Origen', 'Asesoría'],
    ...l.map(x => [x.nombre, x.emails[0] || '', x.telefonos[0] || '', x.holded?.plan || '', x.holded ? (x.holded.estado === 'Baja' ? 'De baja' : 'Activa') : 'Sin licencia', x.holded?.renovacion || '',
      x.holded?.importe ?? '', x.servicio === 'Premium' ? 'Sí' : 'No', gemasTxt(x.gemas) || 'No', x.tipo_cliente, x.asesoria || ''])];
  const blob = new Blob(['﻿' + filas.map(f => f.map(celda).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `segmento-${iso(new Date())}.csv` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function preciosCom(alFin) {
  try { await Promise.all([cargarComAj(true), cargarClientes()]); } catch (e) { return fallo(e); }
  const planes = planesConocidos();
  dialogo(`<h3>Ingreso anual por plan</h3><p class="sub">Lo que nos deja al año una licencia de cada plan. Cuenta para las licencias que no traen su propio importe.</p>
    ${planes.map((p, i) => `<div class="dos"><div><label>Plan</label><input class="campo" name="p${i}" value="${esc(p)}"></div><div><label>€ al año</label><input class="campo" name="e${i}" inputmode="decimal" value="${comAj.precios[p] ?? ''}"></div></div>`).join('')}
    <div class="dos"><div><label>${planes.length ? 'Otro plan' : 'Plan'}</label><input class="campo" name="pN" placeholder="Nombre del plan"></div><div><label>€ al año</label><input class="campo" name="eN" inputmode="decimal"></div></div>
    ${PIE_DLG('Guardar')}`,
    async f => {
      const precios = {};
      planes.forEach((p, i) => { if (f['p' + i].value.trim() && f['e' + i].value.trim()) precios[f['p' + i].value.trim()] = f['e' + i].value; });
      if (f.pN.value.trim() && f.eN.value.trim()) precios[f.pN.value.trim()] = f.eN.value;
      await api('/api/comercial/ajustes', { precios });
      aviso('Ingresos por plan guardados.'); alFin?.();
    });
}

// Convenios firmados que esperan el onboarding: número en el menú y aviso cuando llega uno nuevo.
let pendOnb = null;
async function mirarOnboarding() {
  let l;
  try { l = await api('/api/asesorias/pendientes'); } catch { return; }
  if (pendOnb) for (const p of l.filter(p => !pendOnb.some(q => q.cliente === p.cliente))) aviso(`${p.cliente} ha firmado el convenio: toca hacer el onboarding.`);
  pendOnb = l;
  $('cuentaAses').textContent = l.length;
  $('cuentaAses').classList.toggle('oculto', !l.length);
}

// ================= Asesorías y acceso al portal =================
// El portal va con cuenta. Las asesorías partner (origen «Asesoría», con el Premium gratis) se dan
// de alta a mano aquí con su acceso; a los demás clientes se les da desde su ficha.
let accesosCache = null;
const cargarAccesos = async () => accesosCache ||= await api('/api/accesos');
const correoOk = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);

// Siempre dice qué ha pasado (acceso nuevo, ya tenía cuenta o ya estaba invitado). Si el correo ha
// salido, basta un aviso; si no, el panel da el enlace para pasarlo a mano.
function avisoAcceso(r, email) {
  const que = r.nueva ? `Acceso creado para ${email}` : r.conClave ? `${email} ya tenía acceso` : `${email} ya estaba dado de alta`;
  // 30/10/2026: sin enlace. Entra en la página principal con su correo y la primera vez elige la contraseña.
  if (r.sinEnlace) {
    const portal = r.portal || location.origin;
    if (r.enviado) return aviso(`${que}: le ha llegado un correo para entrar en ${portal} con su correo.`);
    const texto = `Ya tienes acceso al Soporte Holded de Interactivos. Entra en ${portal} con tu correo (${email}). ${r.conClave ? 'Usa tu contraseña de siempre.' : 'La primera vez eliges tu contraseña.'}`;
    return dialogo(`<h3>${esc(que)}</h3><p class="sub">Ya puede entrar en <b>${esc(portal)}</b> con su correo${r.conClave ? ' y su contraseña' : ': la primera vez elige su contraseña'}. Si quieres, pásale este mensaje:</p>
      <textarea class="campo" name="texto" rows="3" readonly>${esc(texto)}</textarea>
      <div class="pie"><button type="button" class="boton sec" data-cerrar>Cerrar</button><button type="submit" class="boton">Copiar mensaje</button></div>`,
      async f => { try { await navigator.clipboard.writeText(f.texto.value); aviso('Mensaje copiado.'); } catch { f.texto.select(); return false; } });
  }
  if (r.enviado) return aviso(`${que}: le ha llegado un correo para ${r.conClave ? 'entrar y, si quiere, cambiar la contraseña' : 'poner su contraseña'}.`);
  const url = r.enlace.startsWith('http') ? r.enlace : location.origin + r.enlace;
  dialogo(`<h3>${esc(que)}</h3><p class="sub">${r.correoCaido ? 'El correo no ha salido: Render, en el plan gratuito, no deja enviar correo.' : 'El correo no ha salido.'} Pásale este enlace a ${esc(email)} para que ponga su contraseña. Vale 7 días.</p>
    <input class="campo" name="enlace" readonly value="${esc(url)}">
    <div class="pie"><button type="button" class="boton sec" data-cerrar>Cerrar</button><button type="submit" class="boton">Copiar enlace</button></div>`,
    async f => { try { await navigator.clipboard.writeText(f.enlace.value); aviso('Enlace copiado.'); } catch { f.enlace.select(); return false; } });
}

function tarjetaAcceso(cliente, cuentas) {
  const estado = c => c.estado === 'Activa' ? (c.ultimoAcceso ? `último acceso hace ${hace(c.ultimoAcceso)}` : 'aún no ha entrado') : c.invitacionCaducada ? 'la invitación ha caducado' : 'aún no ha entrado: la primera vez elige su contraseña';
  return `<section class="tarjeta" id="acceso" style="padding:16px 18px">
    <h2 style="font-size:16px;margin:0 0 4px">Acceso al portal</h2>
    <p class="acc-sub">Con su cuenta entra en el portal, abre tickets y ve los de su empresa desde cualquier dispositivo.</p>
    ${cuentas.map(c => `<div class="acc-fila"><div><b>${esc(c.nombre || c.email)}</b><small>${c.nombre ? esc(c.email) + ' · ' : ''}${estado(c)}</small></div>
      <span class="pl ${c.estado === 'Activa' ? 'acc-activa' : 'acc-inv'}">${c.estado}</span>
      <button type="button" class="boton sec peq" data-reenviar="${esc(c.email)}" data-nombre="${esc(c.nombre || '')}" title="Le llega otro aviso para entrar (o te da el mensaje para pasárselo)">Reenviar</button>
      <button type="button" class="boton sec peq" data-quitar-acc="${c.id}">Quitar</button></div>`).join('') || '<p class="acc-vacio">Todavía no tiene acceso al portal.</p>'}
    <form class="acc-nuevo" novalidate>
      <input class="campo" name="email" type="email" placeholder="correo@empresa.com" aria-label="Correo">
      <input class="campo" name="nombre" placeholder="Nombre de la persona (opcional)" aria-label="Nombre">
      <button class="boton peq">Dar acceso</button>
    </form>
  </section>`;
}
function montarAcceso(cliente) {
  const card = $('acceso');
  if (!card) return;
  const recargar = async () => {
    accesosCache = null;
    try { const a = await cargarAccesos(); if (!$('acceso')) return; $('acceso').outerHTML = tarjetaAcceso(cliente, a.filter(x => x.cliente === cliente)); montarAcceso(cliente); }
    catch (e) { fallo(e); }
  };
  const dar = async (email, nombre) => { const r = await api('/api/accesos', { cliente, email, nombre }); await recargar(); avisoAcceso(r, email); };
  card.querySelector('.acc-nuevo').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, email = f.email.value.trim();
    if (!correoOk(email)) { aviso('Pon un correo válido.', true); return f.email.focus(); }
    const b = f.querySelector('button');
    b.disabled = true; b.textContent = 'Dando acceso…';
    try { await dar(email, f.nombre.value.trim()); } catch (err) { fallo(err); b.disabled = false; b.textContent = 'Dar acceso'; }
  };
  card.onclick = async e => {

// El script del puente de Google (29/10/2026): se pega en script.google.com con la cuenta del buzón.
// Recibe cada correo ya hecho y lo envía con su Gmail; la clave, que pone el panel, lo protege.
const codigoPuente = clave => `// Puente de correo del Soporte Holded (Interactivos).
// Render, en el plan gratuito, no deja enviar correo por SMTP: el panel manda aquí cada correo
// ya hecho y este script lo envía con tu Gmail. Necesita el servicio «Gmail API» (Servicios → +).
const CLAVE = '${clave}';

function doPost(e) {
  try {
    const d = JSON.parse(e.postData.contents);
    if (d.clave !== CLAVE) return responder({ error: 'Clave incorrecta' });
    if (d.prueba) return responder({ ok: true, cuenta: Session.getEffectiveUser().getEmail() });
    const enviado = Gmail.Users.Messages.send({ raw: d.raw }, 'me');
    // Gmail puede cambiar el Message-ID: se devuelve el que ha quedado para reconocer las respuestas.
    const m = Gmail.Users.Messages.get('me', enviado.id, { format: 'metadata', metadataHeaders: ['Message-ID'] });
    const h = (m.payload.headers || []).find(x => x.name.toLowerCase() === 'message-id');
    return responder({ ok: true, id: enviado.id, messageId: h ? h.value : null });
  } catch (err) {
    return responder({ error: String((err && err.message) || err) });
  }
}

function responder(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
`;

// SDK de Meta para su ventana de alta de WhatsApp (Embedded Signup, coexistencia). Se carga al abrir Canales:
// si se cargara al pulsar, el navegador bloquearía la ventana.
let sdkMeta = null;
function cargarSdkMeta(appId) {
  if (sdkMeta?.appId === appId) return sdkMeta.listo;
  const iniciar = () => FB.init({ appId, autoLogAppEvents: true, xfbml: false, version: 'v21.0' });
  const listo = window.FB ? Promise.resolve(iniciar()) : new Promise((ok, ko) => {
    window.fbAsyncInit = () => { iniciar(); ok(); };
    const s = document.createElement('script');
    Object.assign(s, { src: 'https://connect.facebook.net/es_ES/sdk.js', async: true, crossOrigin: 'anonymous', onerror: () => ko(new Error('No se ha podido cargar Meta')) });
    document.head.append(s);
  });
  sdkMeta = { appId, listo };
  return listo;
}
// La ventana de Meta: se elige el número de la app WhatsApp Business y se confirma con el QR del móvil. Meta
// devuelve un código (para el token) y, por mensaje, la cuenta y el número.
function altaCoexistencia(w) {
  if (!window.FB) return aviso('Meta aún se está cargando: vuelve a pulsar en un momento.', true);
  let sesion = null;
  const oir = e => {
    if (!/^https:\/\/([\w-]+\.)?facebook\.com$/.test(e.origin)) return;
    try { const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; if (d?.type === 'WA_EMBEDDED_SIGNUP') sesion = d; } catch {}
  };
  addEventListener('message', oir);
  const terminar = async code => {
    // El mensaje con el número a veces llega justo después del código.
    for (let i = 0; i < 20 && code && !sesion?.data?.phone_number_id; i++) await new Promise(ok => setTimeout(ok, 250));
    removeEventListener('message', oir);
    if (!code) return aviso(sesion?.event === 'CANCEL' ? 'Has cerrado la ventana de Meta sin terminar.' : 'Meta no ha completado el alta.', true);
    try {
      const r2 = await api('/api/canales/whatsapp/coexistencia', { code, wabaId: sesion?.data?.waba_id, telefonoId: sesion?.data?.phone_number_id });
      cargarCanales(r2);
      aviso(`WhatsApp conectado con la app del móvil: ${r2.whatsapp.numero || 'número guardado'}.`);
    } catch (err) { fallo(err); }
  };
  // FB.login no acepta funciones async: por eso el «terminar» aparte.
  FB.login(resp => { terminar(resp?.authResponse?.code || null); }, {
    config_id: w.configId, response_type: 'code', override_default_response_type: true,
    extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' },
  });
}

  };
}
// Tickets que entraron por correo y no están en la etiqueta (de cuando se leía toda la bandeja):
// se enseñan, se desmarcan los que se quieran guardar y se archivan, con «Deshacer» al acabar.
async function limpiarFueraEtiqueta(bt) {
  const usuario = bt.dataset.limpiar, txt = bt.textContent;
  bt.disabled = true; bt.textContent = 'Mirando la etiqueta…';
  let r;
  try { r = await api('/api/canales/limpiar', { usuario }); } catch (e) { fallo(e); return; } finally { bt.disabled = false; bt.textContent = txt; }
  if (!r.tickets.length) return aviso(`En la bandeja ya solo hay correos con la etiqueta «${r.carpeta}».`);
  const d = $('dlg');
  dialogo(`<h3>Correos que no están en «${esc(r.carpeta)}»</h3>
    <p class="sub">${r.tickets.length === 1 ? 'Este ticket entró' : `Estos ${r.tickets.length} tickets entraron`} por correo y no ${r.tickets.length === 1 ? 'tiene' : 'tienen'} ningún mensaje con la etiqueta. Se archivan: salen de la bandeja y de las métricas, sin avisar a nadie. Desmarca los que quieras dejar.</p>
    <label class="limp-todos"><input type="checkbox" checked data-todos> Todos</label>
    <ul class="limp-lista">${r.tickets.map(t => `<li><label><input type="checkbox" name="id" value="${t.id}" checked>
      <span><b>${esc(t.asunto || '(sin asunto)')}</b><small>${esc(t.cliente)}${t.email && t.email !== t.cliente ? ` · ${esc(t.email)}` : ''} · ${fechaHora(t.entrada)} · ${esc(t.estado)}${t.respondido ? ' · <em>respondido</em>' : ''}</small></span></label></li>`).join('')}</ul>
    <div class="pie"><button type="button" class="boton sec" data-cerrar>Cancelar</button><button type="submit" class="boton">Archivar ${r.tickets.length}</button></div>`,
    async fm => {
      const ids = [...fm.querySelectorAll('[name=id]:checked')].map(x => Number(x.value));
      if (!ids.length) { aviso('No has marcado ninguno.', true); return false; }
      const hecho = await api('/api/canales/limpiar/archivar', { usuario, ids });
      tickets = tickets.filter(t => !hecho.ids.includes(t.id));
      pintarLista(selActual);
      dialogo(`<h3>${hecho.ids.length === 1 ? 'Archivado 1 ticket' : `Archivados ${hecho.ids.length} tickets`}</h3>
        <p class="sub">Ya no salen en la bandeja ni en las métricas. Los del portal, WhatsApp o puestos a mano no se han tocado.</p>
        <div class="pie"><button type="button" class="boton sec" id="limpDeshacer">Deshacer</button><button type="submit" class="boton">Hecho</button></div>`, () => {});
      $('limpDeshacer').onclick = async () => {
        try { const v = await api('/api/canales/limpiar/deshacer', { ids: hecho.ids }); d.close(); aviso(v.ids.length === 1 ? 'El ticket ha vuelto a la bandeja.' : `${v.ids.length} tickets han vuelto a la bandeja.`); tickets = await api('/api/tickets'); pintarLista(selActual); }
        catch (e) { fallo(e); }
      };
      return false;
    });
  const todos = d.querySelector('[data-todos]'), marcas = [...d.querySelectorAll('[name=id]')], enviar = d.querySelector('button[type=submit]');
  const contar = () => { const n = marcas.filter(x => x.checked).length; enviar.textContent = `Archivar ${n}`; todos.checked = n === marcas.length; todos.indeterminate = n > 0 && n < marcas.length; };
  todos.onchange = () => { marcas.forEach(x => x.checked = todos.checked); contar(); };
  marcas.forEach(x => x.onchange = contar);
  d.classList.add('ancho');
  d.addEventListener('close', () => d.classList.remove('ancho'), { once: true });
}
// Datos de ejemplo (ejemplo.js): fuera de Canales, en el menú de la cuenta. Quitarlos borra solo
// los inventados y ya no vuelven solos.
async function pintarEjemplo() {
  const b = $('ejemploMenu');
  if (!b) return;
  let n;
  try { n = await api('/api/ejemplo'); } catch { return; }
  const hay = n.tickets || n.clientes;
  b.classList.remove('oculto');
  b.lastChild.textContent = hay ? `Quitar los datos de ejemplo (${n.tickets})` : 'Poner datos de ejemplo';
  b.onclick = async () => {
    if (hay && !confirm(`¿Quitar los ${n.tickets} tickets y ${n.clientes} clientes de ejemplo? Los reales no se tocan.`)) return;
    try {
      await api('/api/ejemplo', { accion: hay ? 'quitar' : 'poner' });
      aviso(hay ? 'Datos de ejemplo quitados.' : 'Datos de ejemplo puestos.');
      tickets = []; clientesCache = null; menuYo(false); pintarEjemplo(); ruta();
    } catch (e) { fallo(e); }
  };
}
const botonGoogle = href => `<a class="boton-google" href="${href}"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continuar con Google</span></a>`;

// Aviso rojo en el menú si el buzón está configurado pero falla.
function marcarCanales(r) {
  googleInfo = r.google || googleInfo;
  const c = r.correo;
  const falla = (c.configurado && (c.lectura.ok === false || c.envio.ok === false)) || (googleInfo.activo && googleInfo.ok === false);
  $('alertaCanales').classList.toggle('oculto', !falla);
  $('alertaYo').classList.toggle('oculto', !falla);
}

// ================= Arranque =================
(async () => {
  try {
    [equipo, portal] = await Promise.all([api('/api/equipo'), fetch('/api/portal').then(r => r.json())]);
    [H_INI, H_FIN] = (portal.horario || '09:00-18:00').split('-').map(h => { const [a, b] = h.split(':').map(Number); return a * 60 + (b || 0); });
  } catch (e) { return fallo(e); }
  pintarYo();
  $('yoBoton').onclick = e => { e.stopPropagation(); menuYo($('menuYo').classList.contains('oculto')); };
  $('menuYo').onclick = e => e.stopPropagation();
  $('canalesMenu').onclick = () => menuYo(false);
  document.addEventListener('click', () => menuYo(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') menuYo(false); });
  $('salir').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/admin/login'; };
  cargarClientes().catch(() => {});
  mirarPedidas();
  mirarOnboarding();
  setInterval(() => { if (!document.hidden) { mirarPedidas(); mirarOnboarding(); } }, 30000);
  pintarEjemplo();
  api('/api/canales').then(marcarCanales).catch(() => {});
  // Vuelta de «Continuar con Google».
  const vueltaGoogle = new URLSearchParams(location.search).get('google');
  if (vueltaGoogle !== null) {
    history.replaceState(null, '', '/admin' + location.hash);
    const bien = {
      ok: 'Google conectado: ya se pueden crear videollamadas y el cliente puede reservar.',
      entrado: 'Has entrado con Google.',
      'entrado-calendario': 'Has entrado con Google y tu calendario queda conectado para las videollamadas.',
    }[vueltaGoogle];
    aviso(bien || {
      cancelado: 'Has cancelado la conexión con Google.',
      caducado: 'La conexión ha caducado: vuelve a pulsar «Continuar con Google».',
      'sin-configurar': 'Falta crear el cliente de Google y poner GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en Render: los pasos están en Cuenta → Canales.',
    }[vueltaGoogle] || vueltaGoogle, !bien);
  }
  ruta();
})();
// Visor de imágenes del chat: se cierra con la cruz, con Esc o pulsando fuera de la imagen.
// Ctrl/Cmd + clic sigue abriéndola en otra pestaña.
(() => {
  const visor = document.createElement('div');
  visor.className = 'visor'; visor.hidden = true;
  visor.setAttribute('role', 'dialog'); visor.setAttribute('aria-modal', 'true'); visor.setAttribute('aria-label', 'Imagen adjunta');
  visor.innerHTML = '<span class="nombre"></span><button type="button" class="cerrar" aria-label="Cerrar (Esc)" title="Cerrar (Esc)">×</button><img alt="">';
  document.body.append(visor);
  const img = visor.querySelector('img');
  let origen = null;
  const cerrar = () => {
    if (visor.hidden) return;
    visor.hidden = true; img.removeAttribute('src'); document.body.style.overflow = '';
    if (origen?.isConnected) origen.focus();
  };
  document.addEventListener('click', e => {
    const a = e.target.closest('a.ver-img');
    if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    origen = a; img.src = a.href; img.alt = a.querySelector('img')?.alt || '';
    visor.querySelector('.nombre').textContent = img.alt;
    visor.hidden = false; document.body.style.overflow = 'hidden';
    visor.querySelector('.cerrar').focus();
  });
  visor.addEventListener('click', e => { if (e.target !== img) cerrar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !visor.hidden) { e.preventDefault(); cerrar(); } });
})();
</script>
