<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de soporte · Interactivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #C81D25; --cal: #f6f7f9; --bruma: #5b6472; --pizarra: #1c2230; --linea: #e6e8ec; --linea2: #d8dce3; --blanco: #fff;
    --suave: #f1f3f6; --muted: #8a919c;
    /* Barra lateral azul marino y acento azul, como el diseño del panel */
    --marino: #0f1b33; --azul: #2563eb; --azul-h: #1d4ed8; --azul-f: #eef3fe; --azul-l: #c7d7fb;
    --sombra-b: 0 1px 2px rgba(16, 24, 40, .06);
    /* Estado (fijos, siempre con icono y texto) */
    --ok: #0ca30c; --ok-t: #0a6b0a; --ok-f: #e7f5e7;
    --at: #fab219; --at-t: #7a5200; --at-f: #fdf3dc;
    --cr: #d03b3b; --cr-t: #a32020; --cr-f: #fbe9e9;
    /* Gráficos */
    --nota: #fff8e1; --nota-l: #f0d58a;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { min-height: 100%; }
  body { margin: 0; font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cal); color: var(--pizarra); display: grid; grid-template-columns: 228px minmax(0, 1fr); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .oculto { display: none !important; }

  /* Navegación */
  /* Barra lateral fija a la izquierda: solo se desplaza el panel */
  .nav { background: var(--marino); color: #fff; display: flex; flex-direction: column; gap: 4px; padding: 22px 14px 16px; position: fixed; top: 0; left: 0; bottom: 0; width: 228px; overflow-y: auto; z-index: 20; }
  .nav .marca { padding: 4px 10px 24px; line-height: 0; }
  .nav .marca img { display: block; width: 100%; max-width: 180px; height: auto; }
  .nav .enlaces { display: flex; flex-direction: column; gap: 4px; }
  .nav a.ir { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #c3cbdb; text-decoration: none; font-size: 15px; font-weight: 500; position: relative; transition: background .15s, color .15s; }
  .nav a.ir:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  .nav a.ir.on { background: var(--azul); color: #fff; font-weight: 600; box-shadow: 0 6px 16px rgba(37, 99, 235, .35); }
  /* Punto claro a la derecha del activo, salvo si ya lleva contador */
  .nav a.ir.on::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #9bb8ff; }
  .nav a.ir.on:has(.cuenta:not(.oculto))::after { display: none; }
  .nav a.ir svg { flex: none; width: 20px; height: 20px; }
  .nav .cuenta { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--azul); color: #fff; }
  /* Cuenta: avatar con iniciales del técnico; al pulsar, el menú (quién soy, portal y salir) */
  .nav .abajo { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .1); padding-top: 14px; position: relative; }
  .yo-boton { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px; border: 0; border-radius: 12px; background: none; color: #fff; cursor: pointer; text-align: left; }
  .yo-boton:hover, .yo-boton[aria-expanded="true"] { background: rgba(255, 255, 255, .06); }
  .yo-boton .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2c3b5c; display: grid; place-items: center; font-size: 14px; font-weight: 600; flex: none; }
  .yo-boton b { display: block; font-weight: 600; font-size: 14px; }
  .yo-boton small { display: block; font-size: 12px; color: #9aa6bd; }
  .yo-boton > svg { margin-left: auto; color: #9aa6bd; flex: none; }
  .yo-boton.falta .avatar { background: #b45309; }
  .yo-boton.falta { box-shadow: inset 0 0 0 2px rgba(250, 178, 25, .7); }
  .menu-yo { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: var(--blanco); color: var(--pizarra); border-radius: 14px; padding: 14px; box-shadow: 0 16px 40px rgba(15, 27, 51, .35); z-index: 30; }
  .menu-yo label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  .menu-yo select { width: 100%; }
  .menu-yo select.falta { border-color: var(--at); box-shadow: 0 0 0 3px rgba(250, 178, 25, .25); }
  .menu-yo a, .menu-yo button.salir { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--pizarra); text-decoration: none; background: none; border: 0; cursor: pointer; text-align: left; }
  .menu-yo a:hover, .menu-yo button.salir:hover { background: var(--suave); }
  .alerta-canales { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--error, #dc2626); color: #fff; flex: none; }
  .yo-boton .alerta-canales { margin-left: 0; }
  .menu-yo hr { border: 0; border-top: 1px solid var(--linea); margin: 12px 0 4px; }
  #vista { min-width: 0; grid-column: 2; }

  /* Comunes */
  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; text-decoration: none; border: 1px solid var(--azul); border-radius: 10px; padding: 9px 16px; cursor: pointer; background: var(--azul); color: #fff; white-space: nowrap; box-shadow: 0 1px 2px rgba(37, 99, 235, .25); transition: background .15s, border-color .15s, box-shadow .15s; }
  .boton:hover { background: var(--azul-h); border-color: var(--azul-h); }
  .boton:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--azul-l); }
  .boton:disabled { opacity: .5; cursor: default; }
  .boton svg { flex: none; }
  .boton.sec { background: var(--blanco); color: var(--pizarra); border-color: var(--linea2); box-shadow: var(--sombra-b); }
  .boton.sec:hover { background: #f8f9fb; border-color: #c9ced8; }
  .boton.verde { background: var(--ok-t); border-color: var(--ok-t); box-shadow: none; }
  .boton.verde:hover { background: #085a08; border-color: #085a08; }
  .boton.rojo { background: var(--cr-t); border-color: var(--cr-t); box-shadow: none; }
  .boton.rojo:hover { background: #8a1a1a; border-color: #8a1a1a; }
  .boton.peq { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
  .campo { border: 1px solid var(--linea2); border-radius: 10px; padding: 8px 10px; background: var(--blanco); }
  .campo:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-f); }
  .tarjeta { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; padding: 18px 20px; box-shadow: var(--sombra-b); }
  .tarjeta h3 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--bruma); }
  .pastilla { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--suave); color: var(--bruma); }
  .pastilla.ok { background: var(--ok-f); color: var(--ok-t); }
  .pastilla.atencion { background: var(--at-f); color: var(--at-t); }
  .pastilla.critico { background: var(--cr-f); color: var(--cr-t); }
  .pastilla.oscura { background: var(--pizarra); color: #fff; }
  .pastilla.urg { background: var(--rojo); color: #fff; }
  .cabeza { display: flex; align-items: center; gap: 12px; padding: 20px 28px 0; flex-wrap: wrap; }
  .cabeza h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .vacio { color: var(--muted); text-align: center; padding: 36px 16px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.clic { cursor: pointer; }
  tr.clic:hover td { background: #fbfbfa; }
  .tabla { overflow-x: auto; }

  /* Bandeja */
  .bandeja { display: grid; grid-template-columns: clamp(300px, 25vw, 380px) minmax(0, 1fr); height: 100vh; }
  .bandeja > *, .detalle > *, .conv, .lista .top > * { min-width: 0; }
  .lista { border-right: 1px solid var(--linea); background: var(--blanco); display: flex; flex-direction: column; min-height: 0; }
  .lista .top { padding: 16px 14px 10px; border-bottom: 1px solid var(--linea); }
  .lista .top .fila { display: flex; gap: 8px; align-items: center; }
  .lista .top h1 { font-size: 18px; margin: 0 auto 0 0; }
  .buscar { width: 100%; margin-top: 12px; }
  .pestanas { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .pestanas button { border: 0; background: none; padding: 6px 9px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--bruma); cursor: pointer; white-space: nowrap; }
  .pestanas button:hover { background: var(--suave); }
  .pestanas button.on { background: var(--azul); color: #fff; }
  .pestanas button b { font-weight: 600; opacity: .7; margin-left: 3px; }
  .items { overflow-y: auto; flex: 1; }
  .item { display: block; padding: 12px 14px; border-bottom: 1px solid var(--linea); text-decoration: none; color: inherit; border-left: 3px solid transparent; }
  .item:hover { background: #fbfbfa; }
  .item.sel { background: var(--azul-f); border-left-color: var(--azul); }
  .item .l1 { display: flex; gap: 8px; align-items: baseline; }
  .item .l1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .l1 time { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .item .l2 { font-size: 12px; color: var(--bruma); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item .l3 { font-size: 13px; color: var(--bruma); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--azul); flex: none; display: inline-block; }
  .detalle { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 20vw, 300px); min-height: 0; height: 100vh; }
  .conv { display: flex; flex-direction: column; min-height: 0; }
  .conv .cab { padding: 18px 24px 14px; background: var(--blanco); border-bottom: 1px solid var(--linea); }
  .conv .cab h2 { font-size: 19px; margin: 0; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .conv .cab .meta { color: var(--bruma); font-size: 13px; margin-top: 3px; }
  .acciones-contacto { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .acciones-contacto a, .acciones-contacto button { font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--linea2); background: var(--blanco); text-decoration: none; cursor: pointer; color: var(--pizarra); }
  .acciones-contacto a:hover, .acciones-contacto button:hover { background: var(--suave); }
  .hilo { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 76%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m small { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
  .m.cliente { align-self: flex-start; background: var(--blanco); border: 1px solid var(--linea); border-bottom-left-radius: 4px; }
  .m.tecnico { align-self: flex-end; background: var(--pizarra); color: #fff; border-bottom-right-radius: 4px; }
  .m.nota { align-self: flex-end; background: var(--nota); border: 1px dashed var(--nota-l); }
  .m.sistema { align-self: center; background: none; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 8px; }
  /* Clientes: cabecera, filtros, tabla con avatar y píldoras, tarjetas y paginación */
  .cl-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 28px 0; flex-wrap: wrap; }
  .cl-cab h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .cl-cab p { margin: 4px 0 0; color: var(--bruma); font-size: 14px; }
  .cl-filtros { display: grid; grid-template-columns: minmax(240px, 1.7fr) repeat(4, minmax(130px, 1fr)) auto; gap: 12px; align-items: end; background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; box-shadow: var(--sombra-b); }
  .cl-buscar { position: relative; }
  .cl-buscar > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .cl-buscar input { width: 100%; padding-left: 36px; padding-right: 58px; }
  .cl-buscar kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 11px Inter, sans-serif; color: var(--muted); border: 1px solid var(--linea2); border-radius: 6px; padding: 2px 6px; background: var(--suave); }
  .cl-f label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 4px 2px; }
  .cl-f select { width: 100%; }
  #cliMas svg { width: 16px; height: 16px; }
  .cl-mas { display: none; grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(150px, 230px)); gap: 12px; padding-top: 4px; }
  .cl-mas.on { display: grid; }
  .cl-tabla { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; box-shadow: var(--sombra-b); }
  .cl-barra { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
  .cl-barra > b { font-size: 15px; }
  .cl-tabs { display: inline-flex; gap: 4px; background: var(--suave); border-radius: 10px; padding: 4px; }
  .cl-tabs button { border: 0; background: none; padding: 9px 16px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; color: var(--bruma); cursor: pointer; white-space: nowrap; }
  .cl-tabs button.on { background: var(--blanco); color: var(--pizarra); box-shadow: var(--sombra-b); }
  .cl-tabs .n { font-weight: 700; color: var(--azul); margin-left: 4px; }
  .cl-barra .orden { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--bruma); }
  .cl-vista { margin-left: auto; display: inline-flex; border: 1px solid var(--linea2); border-radius: 9px; overflow: hidden; }
  .cl-vista button { border: 0; background: var(--blanco); padding: 7px 10px; cursor: pointer; color: var(--bruma); display: grid; place-items: center; }
  .cl-vista button.on { background: var(--azul); color: #fff; }
  .cl-vista svg { width: 16px; height: 16px; }
  .cl-tabla th { background: #fafbfc; }
  .cl-tabla th.ord { cursor: pointer; user-select: none; }
  .cl-tabla th.ord:hover, .cl-tabla th.ord.on { color: var(--pizarra); }
  .cl-tabla th .fl { margin-left: 5px; font-size: 10px; opacity: .45; }
  .cl-tabla th.ord.on .fl { opacity: 1; color: var(--azul); }
  .cl-tabla tbody tr[data-nombre] { cursor: pointer; }
  .cl-tabla tbody tr[data-nombre]:hover td { background: #f7f9ff; }
  .cl-card { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .cl-card:hover { border-color: var(--azul-l); box-shadow: 0 4px 14px rgba(37, 99, 235, .08); }
  .cl-tabla td { font-size: 13px; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; letter-spacing: .02em; }
  .cl-nom { display: flex; gap: 10px; align-items: center; min-width: 190px; }
  .cl-nom a { color: var(--pizarra); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .cl-nom a:hover { color: var(--azul); }
  .cl-nom small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
  .pl { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
  .pl.kit { background: #f1ecfd; color: #6d3fd1; }
  .pl.kit2 { background: #fdeef7; color: #a3266f; }
  .pl.premium { background: #e7f6ec; color: #17803d; }
  .pl.impl { background: var(--azul-f); color: var(--azul-h); }
  .pl.sin { background: var(--suave); color: var(--bruma); }
  .pl.o-akira { background: #e8f4fb; color: #1f6f99; border-color: #cfe6f3; }
  .pl.o-gest { background: #fdf0e6; color: #b45309; border-color: #f8dcc4; }
  .pl.o-ref { background: #eaf7ee; color: #17803d; border-color: #cfeedd; }
  .pl.o-dir { background: var(--suave); color: var(--bruma); border-color: var(--linea); }
  .cl-fecha, .cl-mail { display: inline-flex; gap: 6px; align-items: center; color: var(--bruma); white-space: nowrap; }
  .cl-fecha svg, .cl-mail svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
  .cl-mail { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .cl-tabla th, .cl-tabla td { padding-left: 8px; padding-right: 8px; }
  .cl-acc { display: flex; gap: 4px; align-items: center; justify-content: flex-end; position: relative; }
  .cl-menu-b { border: 0; background: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; color: var(--bruma); font-size: 18px; line-height: 1; }
  .cl-menu-b:hover { background: var(--suave); }
  .cl-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--blanco); border: 1px solid var(--linea); border-radius: 10px; box-shadow: 0 10px 30px rgba(16, 24, 40, .12); padding: 6px; min-width: 200px; }
  .cl-menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; font: inherit; font-size: 13px; cursor: pointer; color: var(--pizarra); }
  .cl-menu button:hover { background: var(--suave); }
  .cl-pie { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 13px; color: var(--bruma); flex-wrap: wrap; gap: 10px; }
  .cl-pie:empty { display: none; }
  .cl-pag { display: flex; gap: 4px; align-items: center; }
  .cl-pag button { min-width: 32px; height: 32px; border: 1px solid var(--linea2); background: var(--blanco); border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; color: var(--pizarra); }
  .cl-pag button.on { background: var(--azul); color: #fff; border-color: var(--azul); }
  .cl-pag button:disabled { opacity: .4; cursor: default; }
  .cl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px; }
  .cl-card { border: 1px solid var(--linea); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--blanco); }
  .cl-card .cl-nom { min-width: 0; }
  .cl-card .num3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; background: var(--cal); border-radius: 10px; padding: 8px 4px; }
  .cl-card .num3 b { display: block; font-size: 16px; }
  .cl-card .num3 span { font-size: 11px; color: var(--muted); }
  @media (max-width: 1150px) { .cl-filtros { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cl-buscar { grid-column: 1 / -1; } .cl-mas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .cl-cab { padding: 16px 16px 0; } .cl-tabla .tabla table { min-width: 940px; } .cl-filtros { grid-template-columns: 1fr; } .cl-mas { grid-template-columns: 1fr; } }
  /* Ficha de cliente: sus incidencias con la conversación y, aparte, las notas internas */
  .ficha { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 20px; align-items: start; }
  .ficha-datos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .ficha-lado { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  /* Acceso al portal (ficha) y lista de asesorías */
  .acc-sub { margin: 0 0 10px; font-size: 12px; color: var(--bruma); }
  .acc-fila { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--linea); }
  .acc-fila > div { flex: 1 1 160px; min-width: 0; }
  .acc-fila b { display: block; font-size: 13px; }
  .acc-fila small { display: block; font-size: 12px; color: var(--bruma); overflow-wrap: anywhere; }
  .acc-vacio { font-size: 13px; color: var(--muted); margin: 0; padding: 8px 0 2px; }
  .acc-nuevo { display: grid; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--linea); }
  .acc-nuevo .boton { justify-self: start; }
  .pl.acc-activa { background: #eaf7ee; color: #17803d; border-color: #cfeedd; }
  .pl.acc-inv { background: #eef3fe; color: #1d4ed8; border-color: #d6e2fc; }

  .periodo-panel { position: absolute; left: 0; top: calc(100% + 6px); z-index: 30; background: var(--blanco); border: 1px solid var(--linea); border-radius: 12px; box-shadow: 0 16px 40px rgba(16, 24, 40, .14); display: flex; max-width: calc(100vw - 32px); }

  .mk-sec-cab { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
  .mk-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--mk-azul-f); color: var(--mk-azul); display: grid; place-items: center; flex: none; }

  button.mk-estado small { font-weight: 700; opacity: .75; }

  /* Por qué está en Atención o Crítico (29/10/2026, «tan feo»): una tarjeta por motivo, una al
     lado de la otra, con la cifra grande en el color del estado y los casos en filas de una línea. */
  .mk-porque { margin: -4px 0 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start; }
  .mk-pq { border: 1px solid var(--linea); border-radius: 12px; background: var(--blanco); overflow: hidden; --f: var(--mk-at-f); --p: var(--mk-at-p); --t: var(--mk-at-t); }

  .mk-pq-pill { font-style: normal; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--suave); color: var(--bruma); white-space: nowrap; }

  @media (max-width: 760px) { .mk-pq-caso .q small { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; } }
  /* KPI que abren su detalle por clientes */
  .mk-tile.clic, .mk-aro.clic { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .mk-tile.clic:hover { border-color: #c9d6f5; box-shadow: 0 4px 14px rgba(37, 99, 235, .10); }

  .mk-desplegar { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; padding: 10px; border: 1px dashed var(--linea2); border-radius: 10px; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--azul); cursor: pointer; }

  .mk-premium .tot b { color: var(--azul-h); }
  /* Detalle de un KPI, como en Super Gemas: el periodo, el total y cada cliente con su barra */
  dialog.det-met { width: min(760px, 94vw); max-height: 88vh; overflow: auto; }
  .dm { padding: 20px 24px 22px; }
  .dm-cab { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .dm-cab small { font-size: 12px; font-weight: 600; color: var(--azul); }

  .dm-x { border: 0; background: var(--suave); width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; color: var(--bruma); flex: none; }
  .dm-x:hover { color: var(--pizarra); }

  .dm-total { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 14px; }
  .dm-fila { display: flex; gap: 16px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--linea); }

  .dm-quien > a:hover { color: var(--azul); }
  .dm-quien > small { margin-left: 6px; font-size: 12px; color: var(--muted); }
  .dm-barra { height: 8px; border-radius: 8px; background: #eef0f4; margin: 7px 0 4px; overflow: hidden; }
  .dm-barra span { display: block; height: 100%; border-radius: 8px; background: var(--azul); }
  .dm-barra span.ok { background: var(--mk-ok); } .dm-barra span.atencion { background: var(--mk-at); } .dm-barra span.critico { background: var(--mk-cr); }
  .dm-items { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .dm-items a { font-size: 12.5px; color: var(--bruma); text-decoration: none; overflow-wrap: anywhere; }
  .dm-items a:hover { color: var(--azul); }
  .dm-items small { color: var(--muted); }
  .dm-val { flex: none; font-weight: 700; font-size: 15px; min-width: 70px; text-align: right; }

  .bj-est.auto { background: var(--suave); color: var(--bruma); }
  .bj-esperar[aria-pressed="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }

  .nt-cli { margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; font-size: 13px; background: var(--suave); color: var(--bruma); }
  .nt-cli.si { background: #eaf7ee; color: #17803d; }
  .mk-tile-enlace { color: inherit; text-decoration: none; display: grid; }

  .mk-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .mk-tile { background: var(--mk-gris); border: 1px solid #ececee; border-radius: 12px; padding: 14px 16px 16px; }
  .mk-tile .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .mk-tile .top svg { width: 18px; height: 18px; }
  .mk-tile .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .mk-tile .v small { font-size: 15px; font-weight: 600; color: var(--muted); }
  .mk-tile .l { font-size: 13px; color: var(--bruma); margin-top: 4px; }
  .mk-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .mk-pill.ok { background: var(--mk-ok-p); color: var(--mk-ok-t); }
  .mk-pill.atencion { background: var(--mk-at-p); color: var(--mk-at-t); }
  .mk-pill.critico { background: var(--mk-cr-p); color: var(--mk-cr-t); }

  .c-ok { color: var(--mk-ok); } .c-atencion { color: var(--mk-at); } .c-critico { color: var(--mk-cr); } .c-nada { color: var(--muted); } .c-azul { color: var(--mk-azul); }

  .mk-suma { margin-top: 16px; }
  /* Videollamadas pedidas por clientes, encima de la bandeja hasta que se confirman */
  .bj-pedidas { display: flex; flex-direction: column; gap: 6px; }

  .mk-tiles { margin-top: 16px; }

  .mk-aros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
  /* Aros del PDF: pista en el tono suave del estado y arco del color, de arriba en el sentido del reloj. */
  .mk-aro { text-align: center; min-width: 0; --c: #c9c8c3; --p: #eeeeec; --t: var(--muted); }
  .mk-aro.ok { --c: var(--mk-ok); --p: var(--mk-ok-p); --t: var(--mk-ok-t); }
  .mk-aro.atencion { --c: var(--mk-at); --p: var(--mk-at-p); --t: var(--mk-at-t); }
  .mk-aro.critico { --c: var(--mk-cr); --p: var(--mk-cr-p); --t: var(--mk-cr-t); }
  /* Horas: sin semáforo, en el azul del panel */
  .mk-aro.horas { --c: var(--azul); --p: #dbe6fd; --t: var(--azul-h); }
  .mk-aro .max { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .mk-aro .max i { width: 1.5px; height: 9px; border-radius: 1px; background: #c9c8c3; }
  .mk-aro svg { display: block; width: 100%; max-width: 112px; height: auto; margin: 4px auto 8px; }
  .mk-aro .pista { fill: none; stroke: var(--p); stroke-width: 12; }

  .mk-aro text { font: 700 30px/1 Inter, system-ui, sans-serif; fill: #111; letter-spacing: -.02em; }
  .mk-aro .l { font-size: 12.5px; color: var(--bruma); line-height: 1.35; }
  .mk-aro .e { font-size: 12px; font-weight: 700; margin-top: 3px; color: var(--t); }
  @keyframes mk-arco { from { stroke-dasharray: 0 400; } }
  .quieto .mk-aro .arco { animation: none; }
  /* Gráfica del detalle de cada KPI, como la de Super Gemas */
  .dm-graf-t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--bruma); margin: 4px 0 6px; }
  .dm-graf { position: relative; margin: 0 0 18px; }

  .dm-hot:hover { background: rgba(37, 99, 235, .06); border-radius: 6px; }
  .dm-hot .globo { display: none; position: absolute; left: 50%; transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; background: #1b2330; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.35; box-shadow: 0 6px 18px rgba(20, 30, 50, .28); z-index: 3; pointer-events: none; }

    .mk-tile { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-areas: "i v p" "i l p"; column-gap: 12px; align-items: center; padding: 12px 14px; }

  /* Modal y avisos */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, 94vw); box-shadow: 0 24px 60px rgba(0,0,0,.25); }

  /* ===== Bandeja con el diseño nuevo ===== */

<script>
// ================= Utilidades =================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 0) => n == null ? '—' : Number(n).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const horasTxt = h => h == null ? '—' : `${num(h, h % 1 ? 1 : 0)} h`;
const fecha = iso => iso ? new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '';
const fechaHora = iso => iso ? new Date(iso).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const hace = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `${m} min`;
  if (m < 1440) return `${Math.floor(m / 60)} h`;
  const d = Math.floor(m / 1440);
  return d < 30 ? `${d} d` : fecha(iso);
};
const dur = min => min == null ? '—' : min < 60 ? `${min} min` : min < 600 ? `${Math.floor(min / 60)} h ${min % 60 ? (min % 60) + ' min' : ''}`.trim() : `${Math.round(min / 60)} h`;
const hms = s => `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const iso = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = '/admin/login?next=' + encodeURIComponent('/admin' + location.hash); throw new Error('Sesión caducada'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Algo ha fallado');
  return d;
}
function aviso(texto, error = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (error ? ' error' : '');
  t.textContent = texto;
  $('avisos').append(t);
  setTimeout(() => t.remove(), error ? 6000 : 3000);
}
const fallo = e => aviso(e.message, true);

// Horario laboral para el SLA (el mismo que usa el servidor).
let H_INI = 540, H_FIN = 1080;
function laborables(a, b = new Date()) {
  const ini = new Date(a), fin = new Date(b);
  if (!(fin > ini)) return 0;
  let total = 0;
  const d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate());
  while (d <= fin) {
    if (d.getDay() % 6) {
      const s = Math.max(d.getTime() + H_INI * 60000, ini), e = Math.min(d.getTime() + H_FIN * 60000, fin);
      if (e > s) total += (e - s) / 60000;
    }
    d.setDate(d.getDate() + 1);
  }
  return Math.round(total);
}

// ================= Estado global =================
let equipo = [], tickets = [], clientesCache = null, portal = {}, googleInfo = { activo: false };
const TIPOS = ['Facturación y Verifactu', 'Contabilidad e impuestos', 'Bancos y conciliación', 'Equipo y fichajes', 'Acceso y usuarios', 'Formación', 'Importación de datos', 'Plantillas', 'Suscripción y plan', 'Otra cosa'];
// Un solo técnico (28/10/2026): ya no se elige quién trabaja.
const yo = () => equipo[0] || '';
// Tarjeta de cuenta de la barra: iniciales y nombre del técnico.
function pintarYo() {
  const n = yo();
  $('yoIni').textContent = n ? n.split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase() : '?';
  $('yoNombre').textContent = n;
}
const menuYo = abrir => { $('menuYo').classList.toggle('oculto', !abrir); $('yoBoton').setAttribute('aria-expanded', abrir); };

// ================= Router =================
let pararVista = () => {};
function ruta() {
  const [, v = 'bandeja', arg] = location.hash.split('/');
  document.querySelectorAll('.nav a.ir').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  if (v === 'bandeja' && $('items')) return seleccionar(Number(arg) || null);
  pararVista();
  pararVista = () => {};
  ({ bandeja: vistaBandeja, metricas: vistaMetricas, comercial: vistaComercial, clientes: vistaClientes, asesorias: vistaAsesorias, canales: vistaCanales }[v] || vistaBandeja)(arg);
}
addEventListener('hashchange', ruta);

// ================= Bandeja =================
const PESTANAS = [
  ['abiertos', 'Abiertos', t => t.estado !== 'Cerrado'],
  ['vencen', 'Vencen', t => t.estado !== 'Cerrado' && !t.primera_respuesta && t.origen !== 'Sheet'],
  ['espera', 'Stand-by', t => t.estado === 'Pendiente cliente'],
  ['cerrados', 'Cerrados', t => t.estado === 'Cerrado'],
];
let pestana = leer('pestana', 'abiertos');
if (!['abiertos', 'vencen', 'espera', 'cerrados'].includes(pestana)) pestana = 'abiertos';
let busca = '', modoNota = false, selActual = null, firmaDet = '';
const firmaDe = t => JSON.stringify([t?.id, t?.mensajes?.length, t?.estado, t?.tecnico, t?.sesiones?.length, t?.activa?.inicio, t?.activa?.esperando, t?.pantalla, !!t?.anydesk, t?.anydesk?.numero, t?.tipo_incidencia, t?.cierreAuto, t?.nps]);

// Cambia el ticket abierto sin volver a montar la bandeja.
function seleccionar(id) {
  selActual = id;
  document.querySelector('.bandeja')?.classList.toggle('con-sel', !!id);
  document.querySelectorAll('.item').forEach(a => a.classList.toggle('sel', a.getAttribute('href') === '#/bandeja/' + id));
  const t = tickets.find(x => x.id === id);
  firmaDet = firmaDe(t);
  if (id) pintarDetalle(t);
  else $('detalle').innerHTML = '<div class="vacio" style="grid-column:1/-1;align-self:center">Elige un ticket de la bandeja</div>';
}

function slaDe(t) {
  if (t.estado === 'Cerrado') return ['', 'Resuelto'];
  if (t.estado === 'Pendiente cliente') return ['atencion', 'Espera cliente'];
  if (t.primera_respuesta) return ['oscura', 'En curso'];
  if (t.origen === 'Sheet') return ['', t.estado];
  const m = laborables(t.entrada);
  return [m > 60 ? 'critico' : m > 45 ? 'atencion' : 'ok', m > 60 ? `Fuera de SLA · ${dur(m)}` : `Sin responder · ${dur(m)}`];
}
// La videollamada que espera a que entren los dos (esperando) aún no cuenta (tickets.js).
const segundos = t => (t.horas_previas || 0) * 3600 + (t.sesiones || []).reduce((s, x) => s + (x.esperando ? 0 : ((x.fin ? new Date(x.fin) : new Date()) - new Date(x.inicio)) / 1000), 0);

// Prioridad (28/10/2026): 1) Servicio Premium, 2) asesorías partner, 3) Implementación, 4) Kit Digital 1
// y, cuando abra, 5) Kit Digital 2. Las asesorías partner tienen Premium gratis: van detrás de los que pagan.
const GRUPO_BJ = t => t.servicio === 'Premium' ? (t.tipo_cliente === 'Asesoría' ? 1 : 0) : t.servicio === 'Implementación' ? 2 : t.servicio === 'Kit Digital 2' ? 4 : 3;
const ETIQ_BJ = t => [['premium', 'Servicio Premium'], ['asesoria', 'Asesoría partner'], ['impl', 'Implementación'], ['kit', 'Kit Digital 1'], ['kit2', 'Kit Digital 2']][GRUPO_BJ(t)];
function ordenar(l) {
  if (pestana === 'cerrados') return l.sort((a, b) => (b.cierre || '').localeCompare(a.cierre || ''));
  const peso = t => t.primera_respuesta ? 1 : 0;
  return l.sort((a, b) => GRUPO_BJ(a) - GRUPO_BJ(b) || peso(a) - peso(b) || a.entrada.localeCompare(b.entrada));
}
// Stand-by: a los 14 días sin noticias del cliente se cierra sola (tickets.js), contados desde que se
// puso en espera o desde lo último que se escribió. Sin fecha de espera (de antes), el servidor empieza a contar ahora.
const ultimaAct = t => [[...t.mensajes].reverse().find(m => m.de !== 'nota')?.fecha || t.entrada, t.pendienteDesde || ''].sort().pop();
const cierraEl = t => fecha(new Date((t.pendienteDesde ? new Date(ultimaAct(t)).getTime() : Date.now()) + 14 * 864e5));
// Número del ticket dentro del cliente: 1, 2, 3… por fecha de entrada.
const numDelCliente = t => tickets.filter(x => x.cliente === t.cliente && !x.historico && x.entrada <= t.entrada).length;

// Iconos de la bandeja (trazo, como el resto del panel).
const ICO_BJ = {
  sobre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>',
  buscar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  aviso: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  persona: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/></svg>',
  canal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>',
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  reloj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  acciones: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5 1.4 0 2.6.4 3.6 1M18 13v6M15 16h6"/></svg>',
  detalles: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>',
  pantalla: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  remoto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="m10 7 5 2.5-2.2.6-.6 2.2z"/></svg>',
  espera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/></svg>',
  cerrar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  pausa: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
  enviar: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>',
  responder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/></svg>',
  nota: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
};

// Estado del ticket para la lista y la cabecera: texto y color.
// De dónde viene: el canal y, si es correo, el buzón donde entró.
const tituloBj = t => t.asunto || t.tipo_incidencia || 'Incidencia';
const origenTxt = t => t.canal === 'Correo' && t.buzon ? `Correo a ${t.buzon}` : (t.canal || '');
const ESTADO_BJ = t => t.historico ? ['cerrado', 'Historial'] : t.estado === 'Cerrado' ? ['cerrado', 'Cerrado'] : t.estado === 'Pendiente cliente' ? ['espera', 'Stand-by'] : t.estado === 'Nuevo' ? ['nuevo', 'Nuevo'] : ['curso', 'En curso'];
// SLA de la primera respuesta (1 h laborable), solo mientras nadie ha respondido.
function slaBj(t) {
  if (t.estado === 'Cerrado' || t.primera_respuesta || t.origen === 'Sheet') return null;
  const m = laborables(t.entrada);
  return m > 60 ? ['critico', `Fuera de SLA · hace ${dur(m - 60)}`] : ['atencion', `SLA en riesgo · vence en ${dur(60 - m)}`];
}

function vistaBandeja(idSel) {
  selActual = Number(idSel) || null;
  const sel = selActual;
  $('vista').innerHTML = `
    <div class="bandeja bj ${sel ? 'con-sel' : ''}">
      <section class="lista">
        <div class="top">
          <div class="fila"><span class="bj-logo">${ICO_BJ.sobre}</span><h1>Bandeja</h1></div>
          <button class="boton bj-nuevo" id="nuevo">+ Nuevo ticket</button>
          <div class="bj-pedidas oculto" id="bjPedidas"></div>
          <div class="bj-buscar">${ICO_BJ.buscar}<input class="campo buscar" id="buscar" placeholder="Buscar cliente, ticket o contenido…" value="${esc(busca)}"></div>
          <div class="pestanas" id="pestanas"></div>
        </div>
        <div class="items" id="items"></div>
      </section>
      <section class="detalle" id="detalle">${sel ? '' : '<div class="vacio" style="grid-column:1/-1;align-self:center">Elige un ticket de la bandeja</div>'}</section>
    </div>`;
  $('buscar').oninput = e => { busca = e.target.value; pintarLista(selActual); };

    const b = e.target.closest('button');
    if (!b) return;
    pestana = b.dataset.p;
    escribir('pestana', pestana);
    pintarLista(selActual);
  };
  const refrescar = async () => {
    if (document.hidden) return;
    try { tickets = await api('/api/tickets'); } catch (e) { return fallo(e); }

    if (selActual) {
      const t = tickets.find(x => x.id === selActual);
      if (firmaDe(t) !== firmaDet) { firmaDet = firmaDe(t); pintarDetalle(t); }
    }
  };
  // Con la lista ya en memoria se pinta al instante; luego se refresca.
  if (tickets.length) { pintarLista(selActual); if (selActual) seleccionar(selActual); }
  refrescar();
  const i1 = setInterval(refrescar, 8000);
  const i2 = setInterval(tick, 1000);
  document.addEventListener('visibilitychange', refrescar);
  pararVista = () => { clearInterval(i1); clearInterval(i2); clearInterval(salaTimer); document.removeEventListener('visibilitychange', refrescar); };
}

function pintarLista(sel) {
  const abiertos = tickets.filter(t => t.estado !== 'Cerrado');
  $('cuentaBandeja').textContent = abiertos.length;
  $('cuentaBandeja').classList.toggle('oculto', !abiertos.length);
  if (!$('items')) return;
  $('pestanas').innerHTML = PESTANAS.map(([k, n, f]) => `<button data-p="${k}" class="${k === pestana ? 'on' : ''}">${n}<b>${num(tickets.filter(f).length)}</b></button>`).join('');
  const filtro = PESTANAS.find(p => p[0] === pestana)?.[2] || PESTANAS[0][2];
  const q = busca.trim().toLowerCase();
  const l = ordenar(tickets.filter(t => filtro(t) && (!q || `${t.id} ${t.cliente} ${t.contacto} ${t.email} ${t.descripcion} ${t.mensajes.map(m => m.texto).join(' ')}`.toLowerCase().includes(q))));
  const vista = pestana === 'cerrados' ? l.slice(0, 150) : l;
  $('items').innerHTML = vista.map(t => {
    const [ec, et] = ESTADO_BJ(t), sla = slaBj(t);
    const ultimoCliente = [...t.mensajes].reverse().find(m => m.de === 'cliente')?.texto || t.descripcion;
    return `<a class="item ${t.id === sel ? 'sel' : ''}" href="#/bandeja/${t.id}">
      <div class="l1"><span class="bj-dot ${ec}" title="${esc(et)}"></span><b>${esc(t.cliente)}</b><span class="bj-est ${ec}">${et}</span><time>${hace(t.estado === 'Cerrado' ? t.cierre || t.entrada : t.entrada)}</time></div>
      <div class="l0"><span class="bj-serv ${ETIQ_BJ(t)[0]}">${ETIQ_BJ(t)[1]}</span><span class="bj-asunto">${esc(tituloBj(t))}</span></div>
      <div class="l2">Cliente: ${esc(t.contacto || t.cliente)} · <b class="bj-origen">${esc(origenTxt(t))}</b> · ${esc(t.tipo_incidencia)}${t.servicio === 'Kit Digital 1' && t.tecnico ? ' · ' + esc(t.tecnico) : ''}${t.activa ? ' · <b style="color:var(--ok-t)">⏱ en marcha</b>' : ''}${t.cierreAuto ? ' · <b>Cierre automático por inactividad</b>' : t.estado === 'Pendiente cliente' ? ` · se cierra sola el ${cierraEl(t)}` : ''}${(t.citas || []).some(c => c.estado === 'pedida') ? ' · <b class="bj-pide">Pide videollamada</b>' : ''}</div>
      ${sla ? `<div class="bj-sla ${sla[0]}">${ICO_BJ.aviso}${esc(sla[1])}</div>` : ''}
      <div class="l3">${esc(ultimoCliente)}</div></a>`;
  }).join('') + (l.length > vista.length ? `<div class="vacio">Se muestran los 150 más recientes. Usa el buscador para el resto.</div>` : '')
    || `<div class="vacio">${q ? 'Nada coincide con la búsqueda.' : pestana === 'sin' ? 'Todo asignado. 👌' : 'No hay tickets aquí.'}</div>`;
}

          return `<p class="bj-hist-aviso">Nos ha escrito ${n} veces${mismo ? ` · ${mismo} ${mismo === 1 ? 'vez' : 'veces'} antes sobre «${esc(t.tipo_incidencia)}»` : ''}.</p>`; })() : ''}

          return notas.length ? `<div class="bj-hist-notas"><b>Últimas notas internas</b>${notas.map(m => `<div class="nota-f">${esc(m.texto)}<small>${esc(m.autor || '')} · ${fecha(m.fecha)} · ${esc(tituloBj(m.x))}</small></div>`).join('')}</div>` : ''; })()}

    </aside>`;
  const hilo = $('hilo');
  hilo.scrollTop = hilo.scrollHeight;

  const crecer = () => { resp.style.height = 'auto'; resp.style.height = Math.min(200, Math.max(70, resp.scrollHeight)) + 'px'; };
  resp.oninput = crecer;
  resp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('redactar').requestSubmit(); } };
  $('redactar').querySelector('.modos').onclick = e => {
    const b = e.target.closest('button[data-m]');
    if (!b) return;
    modoNota = b.dataset.m === 'nota';
    pintarDetalle(t);
    $('resp').focus();
  };
  $('plantilla').onchange = e => {
    const p = PLANTILLAS[e.target.value];
    if (!p) return;
    resp.value = p[1].replace('{contacto}', t.contacto ? ' ' + t.contacto.split(' ')[0] : '').replace('{tecnico}', yo() || 'el técnico');
    e.target.value = '';
    crecer();
    resp.focus();
  };
  $('redactar').onsubmit = async e => {
    e.preventDefault();
    const texto = resp.value.trim();
    if (!texto) return;
    resp.value = '';
    try { await accion(t.id, 'mensaje', { texto, nota: modoNota }); }
    catch (err) { resp.value = texto; fallo(err); }
  };
  det.querySelector('.lado').onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.t) {
      if (b.dataset.t === 'otro') return pedirTiempo(t);
      if (b.dataset.t === 'llamada') return pedirLlamada({ t });
      return accion(t.id, 'tiempo', { minutos: Number(b.dataset.t) }).then(() => aviso(`+${b.dataset.t} min apuntados a ${yo()}`)).catch(fallo);
    }
    const a = b.dataset.a;
    if (!a) return;
    if (a === 'cerrar') return cerrarTicket(t);
    if (a === 'descartar') {
      if (!confirm(`¿«${t.cliente}» no es una incidencia? Sale de la bandeja, de Clientes y de Métricas, y no se avisa a nadie.`)) return;
      return accion(t.id, 'descartar').then(() => {
        tickets = tickets.filter(x => x.id !== t.id);
        pintarLista(null);
        location.hash = '#/bandeja';
        aviso('Quitado de la bandeja.');
      }).catch(fallo);
    }
    if (a === 'video') return dialogoVideo(t);
    if (a === 'compartirPantalla') return compartirPantalla(t);
    if (a === 'dejarPantalla') return pantalla?.id === t.id ? dejarPantalla() : accion(t.id, 'pantalla', { paso: 'cerrar' }).catch(fallo);
    if (a === 'pedirAnydesk') return accion(t.id, 'anydesk', { paso: 'pedir' }).then(() => aviso('Le hemos pedido al cliente su número de AnyDesk.')).catch(fallo);
    if (a === 'quitarAnydesk') return accion(t.id, 'anydesk', { paso: 'quitar' }).catch(fallo);
    if (a === 'conectarAnydesk') {
      // Abre AnyDesk en este ordenador con el número del cliente; desde ahora cuenta el tiempo.
      const enlace = document.createElement('a');
      enlace.href = 'anydesk:' + t.anydesk.numero;
      enlace.click();
      return accion(t.id, 'anydesk', { paso: 'conectar' }).catch(fallo);
    }
    if (a === 'confirmarCita') return confirmarCita(t, Number(b.dataset.cita));
    if (a === 'anularCita') {
      if (!confirm('¿Anular esta videollamada? El cliente recibirá el aviso.')) return;
      return accion(t.id, 'anularCita', { cita: Number(b.dataset.cita) }).then(() => { aviso('Videollamada anulada.'); mirarPedidas(); }).catch(fallo);
    }
    accion(t.id, a).catch(fallo);
  };
  $('pTipo').onchange = e => accion(t.id, 'datos', { tipo_incidencia: e.target.value }).catch(fallo);
  vigilarSala(t);
}

// Videollamadas de Google Meet del ticket: previstas, hechas (con su duración real) y anuladas.
function tarjetaCitas(t) {
  const l = (t.citas || []).filter(c => c.origen !== 'ahora' || c.estado !== 'prevista').slice().sort((a, b) => b.inicio.localeCompare(a.inicio));
  if (!l.length) return '';
  const ahoraIso = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
  return `<div class="tarjeta"><h3>Videollamadas</h3><div class="historial">${l.map(c => {
    const futura = c.estado === 'prevista' && c.fin > ahoraIso;
    const pedida = c.estado === 'pedida';
    const estado = pedida ? 'Pedida por el cliente: falta el enlace' : c.estado === 'hecha' ? `${c.minutosReales} min con el cliente (Meet)` : c.estado === 'anulada' ? 'Anulada' : c.estado === 'sin_datos' ? 'Sin registro en Meet' : futura ? (c.origen === 'cliente' ? 'Reservada por el cliente' : 'Prevista') : 'Pendiente de Meet';
    return `<div style="padding:8px 0;border-top:1px solid var(--linea);font-size:13px">
      <div style="display:flex;justify-content:space-between;gap:8px"><b style="${c.estado === 'anulada' ? 'text-decoration:line-through;color:var(--muted)' : ''}">${c.origen === 'ahora' ? 'Al momento' : fechaHora(c.inicio)}</b><span style="color:var(--muted)">${esc(estado)}</span></div>
      ${futura ? `<div style="display:flex;gap:6px;margin-top:6px"><a class="boton sec peq" style="text-decoration:none" href="${esc(c.enlace)}" target="_blank" rel="noopener">Unirme ↗</a><button class="boton sec peq" data-a="anularCita" data-cita="${c.id}">Anular</button></div>` : ''}

      else if (/^\d+$/.test(f.destino.value)) await api(`/api/tickets/${f.destino.value}/llamada`, { tecnico: yo(), minutos, texto });

// Videollamada en marcha: Meet dice si el cliente ya está en la sala; hasta entonces el tiempo no cuenta.
// Cuando entran los dos, el servidor pone el tiempo en marcha y aquí se vuelve a pintar el ticket.
let salaTimer = null;
function vigilarSala(t) {
  clearInterval(salaTimer);
  if (t.activa?.tipo !== 'video' || !t.activa.esperando || !t.activa.codigo || !googleInfo.activo) return;
  const mirar = async () => {
    let r;
    try { r = await api(`/api/tickets/${t.id}/sala`); } catch { return; }
    if (selActual !== t.id) return;
    if (r.ticket) {
      tickets = tickets.map(x => x.id === r.ticket.id ? r.ticket : x);
      if (firmaDe(r.ticket) !== firmaDet) { firmaDet = firmaDe(r.ticket); return pintarDetalle(r.ticket); }
    }
    if (r.personas == null) return;
    const sub = document.querySelector('.reloj-sub');
    if (sub && !r.juntos) sub.textContent = r.personas ? 'Estás tú en la sala: el tiempo empieza cuando entre el cliente' : 'Esperando a que entréis los dos: el tiempo aún no cuenta';
  };
  mirar();
  salaTimer = setInterval(mirar, 20000);
}

// ---------- Compartir mi pantalla y control remoto con AnyDesk (30/10/2026) ----------
// Mi pantalla: el cliente la ve en su incidencia sin instalar nada (WebRTC). Su navegador pide verla y este
// panel le contesta con la pantalla; el tiempo cuenta solo mientras el cliente está conectado. Llevar su
// ratón no se puede desde el navegador: para eso, AnyDesk (el cliente manda su número y aquí se conecta).
function botonesRemoto(t) {
  const mia = pantalla?.id === t.id;
  const pant = mia || t.pantalla
    ? `<button class="boton sec" data-a="dejarPantalla">${ICO_BJ.pantalla}Dejar de compartir</button><div class="bj-espera-nota">${!mia ? 'Se está compartiendo desde otra pestaña.' : t.activa?.tipo === 'pantalla' ? 'El cliente está viendo tu pantalla: el tiempo cuenta.' : 'Esperando a que el cliente la abra en su incidencia (aún no cuenta el tiempo).'}</div>`
    : `<button class="boton sec" data-a="compartirPantalla">${ICO_BJ.pantalla}Compartir mi pantalla</button>`;
  const ad = !t.anydesk ? `<button class="boton sec" data-a="pedirAnydesk">${ICO_BJ.remoto}Control remoto (AnyDesk)</button>`
    : t.anydesk.numero ? `<button class="boton sec" data-a="conectarAnydesk">${ICO_BJ.remoto}Conectar con AnyDesk · ${esc(t.anydesk.numero)}</button><button type="button" class="bj-otro" data-a="quitarAnydesk">Ya no hace falta AnyDesk</button>`
    : `<div class="bj-espera-nota">AnyDesk: esperando a que el cliente mande su número.</div><button type="button" class="bj-otro" data-a="quitarAnydesk">Ya no hace falta AnyDesk</button>`;
  return pant + ad;
}
let pantalla = null; // { id, stream, pc, visor, timer, corte, ocupado }
const iceListo = pc => new Promise(ok => {
  if (pc.iceGatheringState === 'complete') return ok();
  const fin = setTimeout(ok, 3000);
  pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(fin); ok(); } });
});
async function compartirPantalla(t) {
  if (pantalla) return aviso('Ya estás compartiendo la pantalla en otra incidencia: deja de compartirla antes.', true);
  let stream;
  try { stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15 }, audio: false }); }
  catch { return aviso('No se ha compartido la pantalla.', true); }
  pantalla = { id: t.id, stream, pc: null, visor: null };
  stream.getVideoTracks()[0].addEventListener('ended', () => dejarPantalla());
  try { await accion(t.id, 'pantalla', { paso: 'abrir' }); }
  catch (e) { stream.getTracks().forEach(x => x.stop()); pantalla = null; return fallo(e); }
  aviso('Pantalla compartida: el cliente la verá al pulsar «Ver su pantalla» en su incidencia.');
  pantalla.timer = setInterval(senalPantalla, 1500);
}
async function senalPantalla() {
  const p = pantalla;
  if (!p || p.ocupado) return;
  p.ocupado = true;
  try {
    const r = await api(`/api/tickets/${p.id}/pantalla`);
    if (!r.abierta) return void dejarPantalla(false);
    // El cliente ha cerrado su visor: se corta ya y deja de contar el tiempo.
    if (p.visor && !r.visor) {
      p.pc?.close();
      Object.assign(p, { pc: null, visor: null });
      clearTimeout(p.corte);
      return void accion(p.id, 'pantalla', { paso: 'desconectado' }).catch(() => {});
    }
    if (!r.oferta || r.visor === p.visor) return;
    // Un visor nuevo (el cliente la abre o recarga su página): conexión nueva.
    p.pc?.close();
    p.visor = r.visor;
    const pc = p.pc = new RTCPeerConnection(r.ice);
    p.stream.getTracks().forEach(x => pc.addTrack(x, p.stream));
    pc.onconnectionstatechange = () => estadoPantalla(p, pc);
    await pc.setRemoteDescription(r.oferta);
    await pc.setLocalDescription(await pc.createAnswer());
    await iceListo(pc);
    await api(`/api/tickets/${p.id}/senal`, { visor: r.visor, respuesta: pc.localDescription });
  } catch {} finally { p.ocupado = false; }
}
// Conectado: cuenta el tiempo. Cortado: si en 8 s no vuelve, deja de contar.
function estadoPantalla(p, pc) {
  if (pantalla !== p || p.pc !== pc) return;
  clearTimeout(p.corte);
  const paso = paso => accion(p.id, 'pantalla', { paso }).catch(() => {});
  if (pc.connectionState === 'connected') paso('conectado');
  else if (['failed', 'closed'].includes(pc.connectionState)) paso('desconectado');
  else if (pc.connectionState === 'disconnected') p.corte = setTimeout(() => paso('desconectado'), 8000);
}
async function dejarPantalla(avisarServidor = true) {
  const p = pantalla;
  if (!p) return;
  pantalla = null;
  clearInterval(p.timer); clearTimeout(p.corte);
  p.pc?.close();
  p.stream.getTracks().forEach(x => x.stop());
  if (avisarServidor) await accion(p.id, 'pantalla', { paso: 'cerrar' }).catch(fallo);
}
// Si se cierra la pestaña mientras se comparte, deja de contar enseguida.
addEventListener('pagehide', () => {
  if (pantalla) navigator.sendBeacon(`/api/tickets/${pantalla.id}/pantalla`, new Blob([JSON.stringify({ paso: 'cerrar', tecnico: yo() })], { type: 'application/json' }));
});

// Si la empresa, el correo o el teléfono ya son de un cliente, se rellena lo que falta con sus
// datos (sin pisar lo escrito). Si no coincide con nadie, el ticket da de alta el contacto nuevo.
// Sin mayúsculas, acentos ni espacios de más: «cafe nomada» es «Café Nòmada».
const normal = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/\s+/g, ' ');
const nueveDigitos = s => String(s || '').replace(/\D/g, '').slice(-9);
function contactoConocido({ empresa, email, tel }) {
  const l = tickets.filter(t => !t.interno);
  const fichas = clientesCache?.clientes || [];
  const porEmail = email && l.find(t => normal(t.email) === normal(email));
  const porTel = !porEmail && nueveDigitos(tel).length === 9 && l.find(t => nueveDigitos(t.telefono) === nueveDigitos(tel));
  const ficha = fichas.find(c => (empresa && normal(c.nombre) === normal(empresa)) || (email && c.emails.includes(normal(email))) || (nueveDigitos(tel).length === 9 && c.telefonos.some(x => nueveDigitos(x) === nueveDigitos(tel))));
  const cliente = porEmail?.cliente || porTel?.cliente || ficha?.nombre || (empresa && l.find(t => normal(t.cliente) === normal(empresa))?.cliente);
  if (!cliente) return null;
  const ultimo = porEmail || porTel || l.find(t => t.cliente === cliente && (t.contacto || t.email || t.telefono));
  const f = fichas.find(c => c.nombre === cliente);
  return { cliente, contacto: ultimo?.contacto || '', email: ultimo?.email || f?.emails[0] || '', tel: ultimo?.telefono || f?.telefonos[0] || '', servicio: f?.servicio, origen: f?.tipo_cliente };
}

  };

// ================= Métricas =================
// Periodo como en Super Gemas: un solo botón con el rango y, al abrirlo, Semana, Mes, Año o
// Personalizado (28/10/2026).
const PERIODOS = {
  semana: ['Semana actual', () => { const h = new Date(), l = new Date(h); l.setDate(h.getDate() - ((h.getDay() + 6) % 7)); return [iso(l), iso(h)]; }],
  mes: ['Mes actual', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), h.getMonth(), 1)), iso(h)]; }],
  anio: ['Año actual', () => { const h = new Date(); return [iso(new Date(h.getFullYear(), 0, 1)), iso(h)]; }],

const PALABRA = { ok: 'OK', atencion: 'Atención', critico: 'Crítico' };
// Lo que quiere decir cada color en cada indicador (28/10/2026): frases cortas y que se entiendan.
const MOTIVO = {

  fueraSla: { ok: 'Dentro de la hora', atencion: 'Requiere seguimiento', critico: 'SLA superado' },
  valoracion: { ok: 'OK', atencion: 'Requiere seguimiento', critico: 'NPS bajo' },
};
const motivo = (clave, nivel) => nivel ? (MOTIVO[clave]?.[nivel] || PALABRA[nivel]) : 'Sin datos';
// El estado del servicio dice por qué: «Crítico · SLA superado», «Crítico · NPS bajo»…
// Por qué un servicio está en Atención o Crítico: cada indicador que falla, con su valor y la
// norma que lo pone de ese color (los mismos umbrales que metricas.js).
const REGLA = {
  abiertas: { atencion: 'Atención con 6 a 10 incidencias abiertas; Crítico con más de 10.', critico: 'Crítico con más de 10 incidencias abiertas.' },
  fueraSla: { atencion: 'Atención con 1 incidencia respondida pasada la hora; Crítico con 2 o más.', critico: 'Crítico con 2 o más incidencias respondidas pasada la hora.' },
  excedido: { atencion: 'Atención con hasta 30 min sin responder pasada la hora; Crítico con más.', critico: 'Crítico con más de 30 min sin responder pasada la hora.' },
  valoracion: { atencion: 'Atención con una valoración media entre 4,0 y 4,4; Crítico por debajo de 4,0.', critico: 'Crítico con una valoración media por debajo de 4,0.' },
};
const ORDEN_MOTIVO = ['excedido', 'fueraSla', 'valoracion', 'abiertas'];
function motivos(b, estado) {
  const n = b.niveles || {};
  // [cifra, lo que es]: el chip del estado los junta; la tarjeta del porqué pone la cifra en grande.
  const valor = {
    abiertas: () => [num(b.abiertas), b.abiertas === 1 ? 'incidencia abierta' : 'incidencias abiertas'],
    fueraSla: () => [num(b.fueraSla), `${b.fueraSla === 1 ? 'incidencia respondida' : 'incidencias respondidas'} pasada la hora`],
    excedido: () => [exceso(b.excedidoMin || 0), 'sin responder sobre la hora de SLA'],
    valoracion: () => [`${num(b.valoracion, 1)}/5`, 'valoración media'],
  };
  return ORDEN_MOTIVO.filter(k => n[k] === estado).map(k => {
    const [cifra, que] = valor[k]();
    return { clave: k, cifra, que, texto: k === 'valoracion' ? `${que} de ${cifra}` : `${cifra} ${que}`, regla: REGLA[k][estado] };
  });
}
// Dentro del porqué, quién está detrás de cada motivo: qué clientes, qué incidencias y quién

const PORQUE_VISIBLES = 3;
function casosDelMotivo(b, clave) {
  const d = b.detalle || {};
  const pill = (txt, val) => `<em class="mk-pq-pill${val ? ' val' : ''}">${esc(txt)}</em>`;
  const fila = (c, dcha, sub, cuando) => `<button type="button" class="mk-pq-caso" data-ticket="${c.id}"${sub ? ` title="${esc(sub)}"` : ''}><span class="q"><b>${esc(c.cliente)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span><span class="d">${dcha}${cuando ? `<small>${esc(cuando)}</small>` : ''}</span></button>`;
  const l = clave === 'abiertas' ? (b.casos || []).map(c => fila(c, pill(c.estado), c.titulo || c.tipo || '', `desde ${horaEntrada(c.entrada)}`))
    : clave === 'fueraSla' ? (d.fueraSla || []).map(c => fila(c, pill(c.respondido ? `en ${dur(c.esperaMin)}` : `sin responder · ${dur(c.esperaMin)}`, true), c.titulo || '', horaEntrada(c.entrada)))
    : clave === 'excedido' ? (d.excedido || []).map(c => fila(c, pill(exceso(c.excesoMin), true), c.titulo || '', `sin responder desde ${horaEntrada(c.entrada)}`))
    : (d.valoracion || []).map(c => fila(c, `<span class="mk-pq-nps ${c.nps >= 9 ? 'ok' : c.nps >= 7 ? 'atencion' : 'critico'}">${c.nps}/10</span>`,
        [c.contacto, c.titulo].filter(Boolean).join(' · ') + (c.mejora ? ` — «${c.mejora}»` : ''), fecha(c.cierre)));
  if (!l.length) return '';
  return `<div class="mk-pq-casos">${l.map((x, i) => i >= PORQUE_VISIBLES ? x.replace('class="mk-pq-caso"', 'class="mk-pq-caso mas oculto"') : x).join('')}

}

// Tarjeta de número grande, como las del mockup: icono y semáforo arriba, valor y etiqueta.
// Con «aviso», en vez del semáforo lleva esa palabra en azul (cifras sin umbral, como las del periodo).
function tile(icono, nivel, valor, sufijo, etiqueta, aviso, clave, det) {
  const n = nivel || 'nada';
  const arriba = aviso ? `<span class="c-azul">${icono}</span><span class="mk-pill info">${aviso}</span>`
    : `<span class="c-${n}">${icono}</span><span class="mk-pill ${n}"${nivel && nivel !== 'ok' && REGLA[clave] ? ` title="${esc(REGLA[clave][nivel])}"` : ''}>${motivo(clave, nivel)}</span>`;
  return `<div class="mk-tile${det ? ' clic" data-det="' + esc(det) + '" role="button" tabindex="0" title="Ver el detalle por cliente' : ''}"><div class="top">${arriba}</div>

}

const exceso = m => !m ? '0 min' : m < 60 ? `+${m} min` : `+${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
const horaEntrada = isoTxt => {
  const d = new Date(isoTxt), hoy = new Date();
  const hm = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === hoy.toDateString() ? hm : `${fecha(isoTxt)} · ${hm}`;
};

  // Arriba los 4 aros con todo el servicio sumado; «Desglosar» abre los de cada tipo de cliente

// Aro de la página 2 del mockup: pista suave y arco del color del estado que arranca arriba,

      <circle class="pista" cx="64" cy="64" r="${r}"/>

    <div class="l">${etiqueta}</div><div class="e">${pie ?? motivo(clave, nivel)}</div></div>`;
}

  valoracion: { titulo: 'Valoración media (NPS / Google)', serie: 'valoracion', serieTit: 'Valoración media, por', serieFmt: v => num(v, 1) + '/5', total: b => b.valoracion == null ? '—' : num(b.valoracion, 1) + '/5', valor: c => mediaNps(c.valoraciones), fmt: v => num(v, 1) + '/5', max: 5,

function bloqueDe(servicio, grupo) {

function abrirDetalle(servicio, grupo, clave) {

      </div><div class="dm-val">${k.fmt(v)}</div></div>`).join('') || `<div class="dm-vacio">${k.ahora ? 'Ningún cliente ahora mismo.' : 'Ningún cliente en este periodo.'}</div>`}

// La gráfica del detalle: cómo ha ido el KPI tramo a tramo (día, semana o mes según el periodo),
// con la curva suave, el área y un globo con el dato al pasar por encima, como en Super Gemas.
const TRAMO = { dia: 'día', semana: 'semana', mes: 'mes' };
function graficaDet(s, k) {
  const vals = (s?.puntos || []).map(p => p[k.serie]);
  const con = vals.filter(v => v != null);
  if (vals.length < 2 || !con.length) return '';
  const W = 640, H = 210, izq = 46, der = 14, arr = 18, aba = 30, base = H - aba;
  const entero = !['horas', 'valoracion'].includes(k.serie);
  let paso, tope;
  if (k.serie === 'valoracion') { paso = 1; tope = 5; }
  else {
    const crudo = Math.max(...con, entero ? 4 : 1) / 4, p10 = 10 ** Math.floor(Math.log10(crudo)), n = crudo / p10;
    paso = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p10;
    if (entero) paso = Math.max(1, Math.round(paso));
    tope = paso * Math.max(1, Math.ceil(Math.max(...con) / paso));
  }
  const X = i => izq + i * (W - izq - der) / (vals.length - 1);
  const Y = v => arr + (1 - v / tope) * (base - arr);
  const pts = vals.map((v, i) => v == null ? null : [X(i), Y(v)]);
  // Un trazo por cada racha con dato (la valoración puede no tener nota en algún tramo).
  const tramos = [];
  pts.forEach((p, i) => { if (!p) return; if (i && pts[i - 1]) tramos.at(-1).push(p); else tramos.push([p]); });
  const lim = y => Math.min(base, Math.max(arr, y));
  const curva = l => l.map((q, i) => {
    if (!i) return `M${q[0].toFixed(1)},${q[1].toFixed(1)}`;
    const a = l[i - 2] || l[i - 1], b = l[i - 1], e = l[i + 1] || q, t = 0.18;
    return ` C${(b[0] + (q[0] - a[0]) * t).toFixed(1)},${lim(b[1] + (q[1] - a[1]) * t).toFixed(1)} ${(q[0] - (e[0] - b[0]) * t).toFixed(1)},${lim(q[1] - (e[1] - b[1]) * t).toFixed(1)} ${q[0].toFixed(1)},${q[1].toFixed(1)}`;
  }).join('');
  const linea = tramos.map(curva).join(' ');
  const area = tramos.filter(l => l.length > 1).map(l => `${curva(l)} L${l.at(-1)[0].toFixed(1)},${base} L${l[0][0].toFixed(1)},${base} Z`).join(' ');
  let rejilla = '';
  for (let v = 0; v <= tope + 1e-9; v += paso) rejilla += `<line x1="${izq}" y1="${Y(v).toFixed(1)}" x2="${W - der}" y2="${Y(v).toFixed(1)}" stroke="#eef1f5"/><text x="${izq - 8}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#9aa3b1">${esc(k.serieFmt(Math.round(v * 10) / 10))}</text>`;
  const corta = f => new Date(f + 'T12:00').toLocaleDateString('es-ES', s.tipo === 'mes' ? { month: 'short', year: '2-digit' } : { day: 'numeric', month: 'short' });
  const larga = p => s.tipo === 'dia' ? new Date(p.desde + 'T12:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' })
    : s.tipo === 'semana' ? `Del ${corta(p.desde)} al ${corta(p.hasta)}` : new Date(p.desde + 'T12:00').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  const cada = Math.ceil(vals.length / 7);
  const ejeX = s.puntos.map((p, i) => i % cada && i !== vals.length - 1 ? '' : `<text x="${X(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="10" fill="#9aa3b1">${esc(corta(p.desde))}</text>`).join('');
  const ult = pts.map((p, i) => p ? i : -1).filter(i => i >= 0).at(-1);
  const puntos = pts.map((p, i) => p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === ult ? 5 : 3}" fill="${i === ult ? '#2563eb' : '#fff'}" stroke="#2563eb" stroke-width="2"/>` : '').join('');
  // Una zona por tramo, de arriba abajo, con su globo a la altura del punto.
  const ancho = (W - izq - der) / (vals.length - 1) / W * 100;
  const zonas = s.puntos.map((p, i) => `<div class="dm-hot${i === 0 ? ' primero' : i === vals.length - 1 ? ' ultimo' : ''}" style="left:${(X(i) / W * 100).toFixed(2)}%;width:${ancho.toFixed(2)}%;height:${(base / H * 100).toFixed(1)}%"><span class="globo" style="top:${((pts[i] ? pts[i][1] : base) / base * 100).toFixed(1)}%">${esc(larga(p))}<b>${vals[i] == null ? 'Sin datos' : esc(k.serieFmt(vals[i]))}</b></span></div>`).join('');
  const tit = `${k.serieTit} ${TRAMO[s.tipo]}`;
  return `<div class="dm-graf-t">${esc(tit)}</div><div class="dm-graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tit)}">
    <defs><linearGradient id="dmArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".2"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>
    ${rejilla}${area ? `<path d="${area}" fill="url(#dmArea)"/>` : ''}<path d="${linea}" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${puntos}${ejeX}</svg>${zonas}</div>`;
}

// ================= Clientes =================
async function cargarClientes() {
  if (!clientesCache) clientesCache = await api('/api/clientes');

}
// Filtros de la lista. «tick» sustituye a las pestañas: por defecto, los que tienen incidencias.
let filtroCli = { q: '', serv: '', orig: '', tick: 'con', estado: '', contacto: '', horas: '', orden: 'cliente:1', vista: 'lista', mas: false, pag: 1 };
const POR_PAGINA = 25;

const TARJETAS_SOLO = () => innerWidth < 1200;

// Primero: textos de la A a la Z, números de más a menos y último contacto de los más recientes.
// Sin fecha o sin correo siempre van al final.
const cmpNom = (a, b) => a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' });
const ORDEN_CLI = {
  cliente: { dir: 1, f: cmpNom, txt: ['Nombre (A-Z)', 'Nombre (Z-A)'] },
  servicio: { dir: 1, f: (a, b) => a.servicio.localeCompare(b.servicio, 'es'), txt: ['Servicio (A-Z)', 'Servicio (Z-A)'] },
  origen: { dir: 1, f: (a, b) => a.tipo_cliente.localeCompare(b.tipo_cliente, 'es'), txt: ['Origen (A-Z)', 'Origen (Z-A)'] },
  tickets: { dir: -1, f: (a, b) => a.tickets - b.tickets, txt: ['Menos tickets', 'Más tickets'] },
  abiertos: { dir: -1, f: (a, b) => a.abiertos - b.abiertos, txt: ['Menos abiertos', 'Más abiertos'] },
  horas: { dir: -1, f: (a, b) => a.horas - b.horas, txt: ['Menos horas', 'Más horas'] },
  ultimo: { dir: -1, f: (a, b) => a.ultimo.localeCompare(b.ultimo), vacio: x => !x.ultimo, txt: ['Contacto más antiguo', 'Contacto más reciente'] },
  email: { dir: 1, f: (a, b) => a.emails[0].localeCompare(b.emails[0]), vacio: x => !x.emails[0], txt: ['Email (A-Z)', 'Email (Z-A)'] },
};
const ordenCli = () => { const [col, d] = filtroCli.orden.split(':'); return ORDEN_CLI[col] ? [col, Number(d) || ORDEN_CLI[col].dir] : ['cliente', 1]; };
function ordenarClientes(l) {
  const [col, dir] = ordenCli(), o = ORDEN_CLI[col];
  return l.sort((a, b) => (o.vacio ? o.vacio(a) - o.vacio(b) : 0) || (o.vacio && o.vacio(a) ? 0 : dir * o.f(a, b)) || cmpNom(a, b));
}
// Clientes de la lista del Kit Digital 1 activos que aún no han abierto ninguna incidencia.

// Falta clasificar: sin servicio, o Implementación/Premium sin origen (en Kit Digital 1 el origen no aplica).

const prospecto = x => !!x.partner && !['Convenio firmado', 'Partner activa'].includes(x.partner.etapa);
const pendiente = x => x.servicio === 'Sin clasificar' || (['Implementación', 'Premium'].includes(x.servicio) && x.tipo_cliente === 'Sin clasificar');

const ICO_CLI = {

// Avatar con las iniciales y un color fijo por cliente.
const COLORES_AV = [['#e0e7ff', '#4338ca'], ['#fce7f3', '#be185d'], ['#dcfce7', '#15803d'], ['#fef3c7', '#b45309'], ['#e0f2fe', '#0369a1'], ['#ede9fe', '#6d28d9'], ['#ffe4e6', '#be123c'], ['#ccfbf1', '#0f766e'], ['#f1f5f9', '#475569'], ['#ffedd5', '#c2410c']];
function avatar(nombre) {
  const p = String(nombre).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(' ').filter(Boolean);
  const ini = (p.length > 1 ? p[0][0] + p[1][0] : (p[0] || '?').slice(0, 2)) || '?';
  let h = 0;
  for (const ch of String(nombre)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const [bg, fg] = COLORES_AV[h % COLORES_AV.length];
  return `<span class="av" style="background:${bg};color:${fg}">${esc(ini)}</span>`;
}
const pildoraServ = s => `<span class="pl ${{ 'Kit Digital 1': 'kit', 'Kit Digital 2': 'kit2', Premium: 'premium', 'Implementación': 'impl' }[s] || 'sin'}">${esc(s)}</span>`;

const fechaLarga = iso => iso ? new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

function vistaClientes(arg) {
