<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola de soporte</title>
<style>
  :root { --bg:#f4f5fb; --card:#fff; --ink:#1b1f2e; --mute:#6b7185; --line:#e4e6ef;
          --brand:#4f46e5; --brand2:#eef0ff; --ok:#16a34a; --warn:#d97706; --crit:#dc2626; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  header a { color:var(--brand); text-decoration:none; font-weight:600; }
  select, input, textarea { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; color:inherit; }
  button { font:inherit; font-weight:600; border:0; border-radius:9px; padding:9px 14px; cursor:pointer; background:var(--brand); color:#fff; }
  button.sec { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.ok { background:var(--ok); } button.crit { background:var(--crit); }
  .app { flex:1; display:grid; grid-template-columns:340px 1fr; min-height:0; }
  .lista { border-right:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; min-height:0; }
  .filtros { display:flex; gap:6px; padding:10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .filtros button { padding:6px 10px; font-size:13px; }
  .filtros input { flex:1 1 100%; }
  .items { overflow:auto; flex:1; }
  .item { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#fafbff; } .item.sel { background:var(--brand2); }
  .item .l1 { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .item .l2 { color:var(--mute); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; background:#eef0f4; color:var(--mute); }
  .pill.ok { background:#dcfce7; color:#166534; } .pill.warn { background:#fef3c7; color:#92400e; } .pill.crit { background:#fee2e2; color:#991b1b; } .pill.brand { background:var(--brand2); color:var(--brand); }
  .detalle { display:flex; flex-direction:column; min-height:0; }
  .vacio { margin:auto; color:var(--mute); text-align:center; }
  .cab { background:var(--card); border-bottom:1px solid var(--line); padding:14px 18px; display:grid; grid-template-columns:1fr auto; gap:12px; }
  .cab h2 { margin:0; font-size:18px; }
  .contacto { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .contacto a { font-size:13px; padding:5px 10px; border-radius:99px; border:1px solid var(--line); text-decoration:none; color:var(--ink); background:#fff; }
  .reloj { text-align:right; }
  .reloj .t { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
  .reloj .t.on { color:var(--ok); }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:6px; }
  .chat { flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.cliente { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.tecnico { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
  .msg.nota { align-self:flex-end; background:#fff8e6; border:1px dashed #f0c36d; }
  .msg.sistema { align-self:center; background:#eef0f4; color:var(--mute); font-size:13px; }
  .msg small { display:block; opacity:.7; font-size:11px; margin-top:4px; }
  .responder { background:var(--card); border-top:1px solid var(--line); padding:12px 18px; display:flex; gap:8px; align-items:flex-end; }
  .responder textarea { flex:1; min-height:46px; max-height:160px; resize:vertical; }
  .responder label { font-size:13px; color:var(--mute); display:flex; gap:4px; align-items:center; white-space:nowrap; }
  dialog { border:0; border-radius:16px; padding:22px; width:min(480px,92vw); box-shadow:0 20px 50px rgba(0,0,0,.2); }
  dialog h3 { margin:0 0 6px; }
  dialog label { display:block; font-size:13px; font-weight:600; margin:12px 0 5px; }
  dialog select, dialog input, dialog textarea { width:100%; }
  dialog .pie { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .resumen { background:var(--bg); border-radius:10px; padding:10px 12px; font-size:13px; }
  @media (max-width:820px){ .app{grid-template-columns:1fr} .lista{max-height:40vh} .cab{grid-template-columns:1fr} .reloj{text-align:left} .acciones{justify-content:flex-start} }
</style>
</head>
<body>
<header>
  <h1>Consola de soporte Holded</h1>
  <a href="/">Dashboard</a>
  <select id="yo" title="Técnico"></select>
  <button id="btnNuevo">+ Nuevo ticket</button>
</header>
<div class="app">
  <aside class="lista">
    <div class="filtros">
      <input id="buscar" placeholder="Buscar cliente o texto…">
      <button class="sec" data-f="abiertos">Abiertos</button>
      <button class="sec" data-f="mios">Míos</button>
      <button class="sec" data-f="cerrados">Cerrados</button>
      <button class="sec" data-f="todos">Todos</button>
    </div>
    <div class="items" id="items"></div>
  </aside>
  <main class="detalle" id="detalle"><div class="vacio">Elige un ticket de la izquierda</div></main>
</div>

<dialog id="dlgCerrar">
  <h3>Cerrar ticket</h3>
  <div class="resumen" id="cerrarResumen"></div>
  <label>Tipo de incidencia</label><select id="cTipo"></select>
  <label>Servicio</label><select id="cServicio"><option>Implementación</option><option>Premium</option><option>Kit Digital</option><option>Sin clasificar</option></select>
  <label>Tipo de cliente</label><select id="cCliente"><option>Gestoría</option><option>Directo</option><option>Antiguo cliente AKIRA</option><option>Sin clasificar</option></select>
  <div class="sub" style="margin-top:12px;color:var(--mute);font-size:13px">Al cerrar, el cliente recibe la encuesta de valoración en su chat.</div>
  <div class="pie"><button class="sec" onclick="dlgCerrar.close()">Cancelar</button><button class="ok" id="btnCerrarOk">Cerrar y pedir valoración</button></div>
</dialog>

<dialog id="dlgNuevo">
  <h3>Nuevo ticket</h3>
  <div style="color:var(--mute);font-size:13px">Para llamadas, WhatsApp o correos que no llegan por el portal.</div>
  <label>Canal</label><select id="nCanal"><option>Teléfono</option><option>WhatsApp</option><option>Correo</option></select>
  <label>Empresa</label><input id="nEmpresa">
  <label>Contacto</label><input id="nContacto">
  <label>Teléfono</label><input id="nTel" type="tel">
  <label>Correo</label><input id="nEmail" type="email">
  <label>Tipo</label><select id="nTipo"></select>
  <label>Qué necesita</label><textarea id="nDesc" rows="4"></textarea>
  <div class="pie"><button class="sec" onclick="dlgNuevo.close()">Cancelar</button><button id="btnNuevoOk">Crear y empezar</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hora = iso => iso ? new Date(iso).toLocaleString('es-ES', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
const TIPOS = ['Duda de uso', 'Facturación / Verifactu', 'Contabilidad', 'Bancos', 'Equipo y fichajes', 'Acceso y usuarios', 'Formación', 'Importación de datos', 'Otra'];
let tickets = [], sel = null, filtro = 'abiertos', ultimoChat = '';
const guardado = k => { try { return localStorage.getItem(k); } catch { return null; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

async function api(url, body) {
  const r = await fetch(url, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {});
  const d = await r.json();
  if (!r.ok) { alert(d.error || 'Error'); throw new Error(d.error); }
  return d;
}
const yo = () => $('yo').value;

function hms(seg) {
  const h = Math.floor(seg / 3600), m = Math.floor(seg % 3600 / 60), s = Math.floor(seg % 60);
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
// Segundos totales: lo ya guardado más lo que lleva la sesión abierta.
function segundos(t) {
  return (t.sesiones || []).reduce((s, x) => s + ((x.fin ? new Date(x.fin) : new Date()) - new Date(x.inicio)) / 1000, 0);
}
function espera(t) {
  if (t.estado === 'Cerrado') return ['', 'Cerrado'];
  if (t.primera_respuesta) return t.estado === 'Pendiente cliente' ? ['warn', 'Espera cliente'] : ['brand', 'En curso'];
  const min = (Date.now() - new Date(t.entrada)) / 60000;
  return [min > 60 ? 'crit' : min > 45 ? 'warn' : 'ok', min > 60 ? 'Fuera de SLA' : `${Math.round(min)} min sin responder`];
}

async function cargar() {
  tickets = await api('/api/tickets');
  pintarLista();
  if (sel) pintarDetalle(tickets.find(t => t.id === sel));
}

function pintarLista() {
  const q = $('buscar').value.toLowerCase();
  const l = tickets.filter(t =>
    (filtro === 'todos' || (filtro === 'cerrados' ? t.estado === 'Cerrado' : t.estado !== 'Cerrado')) &&
    (filtro !== 'mios' || t.tecnico === yo()) &&
    (!q || (t.cliente + ' ' + t.descripcion).toLowerCase().includes(q)));
  document.querySelectorAll('.filtros button').forEach(b => b.style.borderColor = b.dataset.f === filtro ? 'var(--brand)' : '');
  $('items').innerHTML = l.map(t => {
    const [n, txt] = espera(t);
    return `<div class="item${t.id === sel ? ' sel' : ''}" data-id="${t.id}">
      <div class="l1"><span>#${t.id} ${esc(t.cliente)}</span><span class="pill ${n}">${txt}</span></div>
      <div class="l2">${t.activa ? '⏱ ' : ''}${esc(t.canal)} · ${esc(t.tipo_incidencia)} · ${esc(t.tecnico || 'Sin asignar')}</div>
      <div class="l2">${esc(t.descripcion)}</div></div>`;
  }).join('') || '<div class="vacio" style="padding:30px">No hay tickets aquí</div>';
}

function pintarDetalle(t) {
  if (!t) return;
  const tel = (t.telefono || '').replace(/[^\d+]/g, '');
  const wa = tel.replace(/^\+/, '').replace(/^(?=[6-9]\d{8}$)/, '34');
  const corriendo = t.activa;
  const nuevo = !$('chat') || $('detalle').dataset.id != t.id;
  if (nuevo) {
    $('detalle').dataset.id = t.id;
    ultimoChat = '';
    $('detalle').innerHTML = `
      <div class="cab">
        <div>
          <h2 id="dTitulo"></h2>
          <div style="color:var(--mute)" id="dSub"></div>
          <div class="contacto" id="dContacto"></div>
        </div>
        <div class="reloj">
          <div class="t" id="reloj">0:00:00</div>
          <div class="acciones" id="acciones"></div>
        </div>
      </div>
      <div class="chat" id="chat"></div>
      <form class="responder" id="formResp">
        <textarea id="resp" placeholder="Responder al cliente… (Enter envía, Mayús+Enter salto de línea)"></textarea>
        <label><input type="checkbox" id="esNota"> Nota interna</label>
        <button>Enviar</button>
      </form>`;
    $('formResp').onsubmit = async e => {
      e.preventDefault();
      const texto = $('resp').value.trim();
      if (!texto) return;
      $('resp').value = '';
      await accion('mensaje', { texto, nota:$('esNota').checked });
    };
    $('resp').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('formResp').requestSubmit(); } };
  }
  $('dTitulo').textContent = `#${t.id} · ${t.cliente}`;
  $('dSub').textContent = `${t.contacto || 'Sin contacto'} · ${t.canal} · ${t.tipo_incidencia} · ${t.estado}${t.tecnico ? ' · ' + t.tecnico : ''} · entró ${hora(t.entrada)}`;
  $('dContacto').innerHTML = [
    tel && `<a href="tel:${esc(tel)}">📞 ${esc(t.telefono)}</a>`,
    wa && `<a href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`,
    t.email && `<a href="mailto:${esc(t.email)}?subject=${encodeURIComponent('Incidencia #' + t.id)}">✉ ${esc(t.email)}</a>`,
    `<a href="/soporte?t=${esc(t.token)}" target="_blank" rel="noopener">Ver como cliente</a>`,
  ].filter(Boolean).join('');
  $('reloj').classList.toggle('on', !!corriendo);
  const botones = t.estado === 'Cerrado'
    ? `<span class="pill">${t.nps != null ? 'NPS ' + t.nps : 'Valoración pendiente'}</span><button class="sec" data-a="reabrir">Reabrir</button>`
    : `${corriendo ? `<button class="crit" data-a="parar">Parar ${corriendo.tipo === 'video' ? 'videollamada' : 'cronómetro'}</button>` : `<button class="ok" data-a="iniciar">Iniciar cronómetro</button>`}
       ${corriendo?.tipo === 'video' ? `<button class="sec" onclick="window.open('${esc(t.video)}')">Abrir sala</button>` : `<button class="sec" data-a="video">Videollamada</button>`}
       <button class="sec" data-a="pendiente">Espera cliente</button>
       <button data-a="cerrar">Cerrar</button>`;
  // Solo se repinta si cambia, para no robar el clic con el refresco cada 5 s.
  if ($('acciones').dataset.html !== botones) $('acciones').innerHTML = $('acciones').dataset.html = botones;
  $('acciones').onclick = e => {
    const a = e.target.dataset.a;
    if (!a) return;
    if (a === 'cerrar') return abrirCierre(t);
    if (a === 'video') { const w = window.open('about:blank'); return accion('video').then(r => { w.location = r.video; }); }
    accion(a);
  };
  const html = t.mensajes.map(m => `<div class="msg ${m.de}">${esc(m.texto)}${m.enlace ? `<br><a href="${esc(m.enlace)}" target="_blank" rel="noopener">${esc(m.enlace)}</a>` : ''}<small>${m.de === 'nota' ? 'Nota interna · ' : ''}${m.autor ? esc(m.autor) + ' · ' : ''}${hora(m.fecha)}</small></div>`).join('');
  if (html !== ultimoChat) { $('chat').innerHTML = html; $('chat').scrollTop = 1e9; ultimoChat = html; }
  tick();
}

function tick() {
  const t = tickets.find(x => x.id === sel);
  if (t && $('reloj')) $('reloj').textContent = hms(segundos(t));
}

async function accion(a, extra = {}) {
  const t = await api(`/api/tickets/${sel}/${a}`, { tecnico:yo(), ...extra });
  tickets = tickets.map(x => x.id === t.id ? t : x);
  pintarLista(); pintarDetalle(t);
  return t;
}

function abrirCierre(t) {
  $('cTipo').innerHTML = TIPOS.map(x => `<option${x === t.tipo_incidencia ? ' selected' : ''}>${x}</option>`).join('');
  $('cServicio').value = t.servicio; $('cCliente').value = t.tipo_cliente;
  $('cerrarResumen').innerHTML = `<b>${esc(t.cliente)}</b> · tiempo registrado: <b>${hms(segundos(t))}</b>`;
  $('dlgCerrar').showModal();
}
$('btnCerrarOk').onclick = async () => {
  await accion('cerrar', { tipo_incidencia:$('cTipo').value, servicio:$('cServicio').value, tipo_cliente:$('cCliente').value });
  $('dlgCerrar').close();
};

$('nTipo').innerHTML = TIPOS.map(x => `<option>${x}</option>`).join('');
$('btnNuevo').onclick = () => $('dlgNuevo').showModal();
$('btnNuevoOk').onclick = async () => {
  const t = await api('/api/tickets', { canal:$('nCanal').value, empresa:$('nEmpresa').value, contacto:$('nContacto').value,
    telefono:$('nTel').value, email:$('nEmail').value, tipo:$('nTipo').value, descripcion:$('nDesc').value, tecnico:yo() });
  $('dlgNuevo').close();
  ['nEmpresa','nContacto','nTel','nEmail','nDesc'].forEach(id => $(id).value = '');
  sel = t.id; filtro = 'abiertos';
  await cargar();
  await accion('iniciar');
};

$('items').onclick = e => {
  const it = e.target.closest('.item');
  if (!it) return;
  sel = Number(it.dataset.id);
  pintarLista(); pintarDetalle(tickets.find(t => t.id === sel));
};
document.querySelector('.filtros').onclick = e => { if (e.target.dataset.f) { filtro = e.target.dataset.f; pintarLista(); } };
$('buscar').oninput = pintarLista;

(async () => {
  const { tecnicos } = await api('/api/config');
  $('yo').innerHTML = tecnicos.map(n => `<option>${esc(n)}</option>`).join('');
  if (tecnicos.includes(guardado('tecnico'))) $('yo').value = guardado('tecnico');
  $('yo').onchange = () => { guardar('tecnico', yo()); pintarLista(); };
  await cargar();
  setInterval(cargar, 5000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
